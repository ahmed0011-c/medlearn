<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="1520" height="720" font-family="Arial"><rect width="760" height="360" fill="#fff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fdb"/></marker><marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b0287a"/></marker></defs><line x1="36.0" y1="85.8" x2="224.0" y2="154.2" stroke="#1f9d55" stroke-width="6" stroke-opacity=".55"/><line x1="130" y1="120" x2="130" y2="230" stroke="#222" stroke-width="4" marker-end="url(#a)"/><text x="124" y="248" font-size="13" font-weight="700" text-anchor="middle">body weight (1×)</text><line x1="130" y1="120" x2="94.6" y2="217.1" stroke="#2f6fdb" stroke-width="4" marker-end="url(#b)"/><line x1="130" y1="120" x2="165.4" y2="132.9" stroke="#b0287a" stroke-width="4" marker-end="url(#c)"/><text x="20" y="275" font-size="14" fill="#2f6fdb" font-weight="700">compression (squeeze) 0.94×</text><text x="20" y="295" font-size="14" fill="#b0287a" font-weight="700">shear (slide) 0.34×</text><text x="130" y="325" font-size="16" font-weight="700" text-anchor="middle" fill="#1f9d55">Type I: mostly compression (20°)</text><line x1="303.4" y1="55.7" x2="456.6" y2="184.3" stroke="#e08a00" stroke-width="6" stroke-opacity=".55"/><line x1="380" y1="120" x2="380" y2="230" stroke="#222" stroke-width="4" marker-end="url(#a)"/><text x="374" y="248" font-size="13" font-weight="700" text-anchor="middle">body weight (1×)</text><line x1="380" y1="120" x2="325.8" y2="184.6" stroke="#2f6fdb" stroke-width="4" marker-end="url(#b)"/><line x1="380" y1="120" x2="434.2" y2="165.4" stroke="#b0287a" stroke-width="4" marker-end="url(#c)"/><text x="270" y="275" font-size="14" fill="#2f6fdb" font-weight="700">compression (squeeze) 0.77×</text><text x="270" y="295" font-size="14" fill="#b0287a" font-weight="700">shear (slide) 0.64×</text><text x="380" y="325" font-size="16" font-weight="700" text-anchor="middle" fill="#e08a00">Type II: mixed (40°)</text><line x1="587.7" y1="29.4" x2="672.3" y2="210.6" stroke="#d64545" stroke-width="6" stroke-opacity=".55"/><line x1="630" y1="120" x2="630" y2="230" stroke="#222" stroke-width="4" marker-end="url(#a)"/><text x="624" y="248" font-size="13" font-weight="700" text-anchor="middle">body weight (1×)</text><line x1="630" y1="120" x2="587.9" y2="139.6" stroke="#2f6fdb" stroke-width="4" marker-end="url(#b)"/><line x1="630" y1="120" x2="672.1" y2="210.4" stroke="#b0287a" stroke-width="4" marker-end="url(#c)"/><text x="520" y="275" font-size="14" fill="#2f6fdb" font-weight="700">compression (squeeze) 0.42×</text><text x="520" y="295" font-size="14" fill="#b0287a" font-weight="700">shear (slide) 0.91×</text><text x="630" y="325" font-size="16" font-weight="700" text-anchor="middle" fill="#d64545">Type III: mostly shear (65°)</text><text x="10" y="350" font-size="12" fill="#5d6470">Faint line = fracture plane. Body weight splits into compression across the line (cosine of the angle) and shear along it (sine). Simplified: the real hip force is tilted.</text></svg>