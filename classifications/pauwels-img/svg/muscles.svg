</g><line x1="308" y1="164" x2="298" y2="69" stroke="#d64545" stroke-width="5"  marker-end="url(#md64545)"/><text x="20" y="40" font-size="14" fill="#d64545" font-weight="700">Gluteus medius + minimus → greater trochanter</text><text x="20" y="58" font-size="13" fill="#d64545" font-weight="400">pull the trochanter up and in (abduction)</text><line x1="409" y1="343" x2="559" y2="223" stroke="#2f6fdb" stroke-width="5"  marker-end="url(#m2f6fdb)"/><text x="560" y="150" font-size="14" fill="#2f6fdb" font-weight="700">Iliopsoas → lesser trochanter</text><text x="560" y="168" font-size="13" fill="#2f6fdb" font-weight="400">pulls up toward the spine/pelvis (flexion);</text><text x="560" y="184" font-size="13" fill="#2f6fdb" font-weight="400">its medial-back attachment turns the shaft outward</text><line x1="322" y1="206" x2="552" y2="226" stroke="#7b3fc4" stroke-width="5" stroke-dasharray="8 5" marker-end="url(#m7b3fc4)"/><text x="20" y="250" font-size="14" fill="#7b3fc4" font-weight="700">Short external rotators (dashed = run BEHIND the bone</text><text x="20" y="268" font-size="13" fill="#7b3fc4" font-weight="400">toward the pelvis): piriformis, obturator internus + gemelli,</text><text x="20" y="284" font-size="13" fill="#7b3fc4" font-weight="400">obturator externus, quadratus femoris → back of greater</text><text x="20" y="300" font-size="13" fill="#7b3fc4" font-weight="400">trochanter / trochanteric fossa / intertrochanteric crest</text><line x1="396" y1="460" x2="566" y2="370" stroke="#1f9d55" stroke-width="5"  marker-end="url(#m1f9d55)"/><text x="560" y="390" font-size="14" fill="#1f9d55" font-weight="700">Adductors → shaft (linea aspera)</text><text x="560" y="408" font-size="13" fill="#1f9d55" font-weight="400">pull the shaft up and inward</text><path d="M393,526 A55,22 0 0 1 298,526" fill="none" stroke="#e08a00" stroke-width="5" marker-end="url(#me08a00)"/><text x="20" y="560" font-size="14" fill="#e08a00" font-weight="700">Net result on the shaft fragment: pulled UP (shortening) and turned OUT (external rotation)</text><text x="20" y="585" font-size="12" fill="#5d6470">Right proximal femur, front view (schematic). Arrows show the direction of pull only; attachment points are approximate.</text></svg>