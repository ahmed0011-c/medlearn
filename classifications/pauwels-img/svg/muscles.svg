<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 595" width="1800" height="1190" font-family="Arial"><rect width="900" height="595" fill="#fff"/><defs><marker id="md64545" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d64545"/></marker><marker id="m2f6fdb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fdb"/></marker><marker id="m7b3fc4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7b3fc4"/></marker><marker id="m1f9d55" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f9d55"/></marker><marker id="me08a00" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e08a00"/></marker></defs><g transform="translate(250,70) scale(1.3)">
<path d="M60,330 L58,150 Q52,110 40,70 Q62,52 92,72 L128,92 Q150,96 160,92 L178,150 Q150,162 128,180 Q118,196 124,208 Q112,214 110,224 L112,330 Z" fill="#f3ead8" stroke="#555" stroke-width="2"/>
