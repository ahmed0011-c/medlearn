<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-label="A mobile joint that positions the thumb"><title>A mobile joint that positions the thumb</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#c24b38"/></marker></defs><rect width="960" height="520" rx="18" fill="#f8fafc"/><g font-family="Arial,sans-serif" font-size="20" fill="#18354b"><text x="32" y="40" font-size="25" font-weight="bold">A mobile joint that positions the thumb</text><path d="M70 165Q170 90 270 165L270 290Q170 215 70 290Z" fill="#f5e7c8" stroke="#7c6548" stroke-width="3"/><path d="M80 310Q170 240 260 310L260 360Q170 415 80 360Z" fill="#dcecf3" stroke="#42647d" stroke-width="3"/><text x="58" y="110">1st metacarpal base</text><text x="85" y="440">Trapezium</text><text x="350" y="125" font-weight="bold">Saddle-shaped surfaces</text><text x="350" y="165">Concave in one direction;</text><text x="350" y="197">convex in the perpendicular direction.</text><text x="350" y="260">Flexion / extension</text><text x="350" y="302">Abduction / adduction</text><text x="350" y="360" font-weight="bold">Opposition combines movements</text><text x="350" y="396">to bring the thumb towards the fingers.</text><text x="32" y="496" font-size="15" fill="#546778">MedLearn original teaching schematic • simplified and not to scale</text></g></svg>