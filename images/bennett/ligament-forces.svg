<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-label="Why the small fragment stays and the shaft moves"><title>Why the small fragment stays and the shaft moves</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#c24b38"/></marker></defs><rect width="960" height="520" rx="18" fill="#f8fafc"/><g font-family="Arial,sans-serif" font-size="20" fill="#18354b"><text x="32" y="40" font-size="25" font-weight="bold">Why the small fragment stays and the shaft moves</text><rect x="100" y="330" width="170" height="85" rx="22" fill="#f5e7c8" stroke="#7c6548" stroke-width="3"/><text x="110" y="450">Trapezium</text><path d="M125 300L200 245L205 312Z" fill="#89cbb5" stroke="#226c5b" stroke-width="3"/><path d="M145 331L160 300L190 307L196 331" fill="#9d8dd1" stroke="#635196" stroke-width="3"/><path d="M260 280L333 280L355 100Q310 70 270 100Z" fill="#f5e7c8" stroke="#7c6548" stroke-width="3"/><path d="M337 190L375 87" stroke="#c24b38" stroke-width="4" fill="none" marker-end="url(#arrow)"/><text x="400" y="104" fill="#a43726">APL contributes to proximal pull</text><text x="400" y="155">Muscle forces displace the larger fragment.</text><text x="400" y="220">Adductor pollicis contributes to</text><text x="400" y="251">adduction and supination.</text><path d="M160 285L380 290" stroke="#226c5b" stroke-width="2"/><text x="400" y="298">Volar-ulnar fragment (green)</text><path d="M175 323L380 350" stroke="#635196" stroke-width="2"/><text x="400" y="357">Anterior oblique ligament (purple)</text><text x="400" y="410">Other stabilisers are omitted here.</text><text x="400" y="442">Combined forces act in three dimensions.</text><text x="32" y="496" font-size="15" fill="#546778">MedLearn original teaching schematic • simplified and not to scale</text></g></svg>