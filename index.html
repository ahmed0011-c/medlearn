<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MedLearn – Endocrinology</title>
<style>:root{--bg:#f7f6f2;--panel:#fff;--ink:#1f2328;--mute:#5d6470;--line:#e3e1da;--acc:#2f6fdb;--ok:#1f9d55;--bad:#d64545;
--c-enzyme:#7b3fc4;--c-hormone:#0f8b8d;--c-cell:#d9730d;--c-disease:#c62828;--c-drug:#1f5fd1;--c-concept:#7a5c1e;--c-test:#b0287a}
body.dark{--bg:#14161a;--panel:#1d2026;--ink:#e8e6e1;--mute:#a3a9b3;--line:#30343c;--acc:#6ea0ff;
--c-enzyme:#b88cff;--c-hormone:#35c2c4;--c-cell:#ffa451;--c-disease:#ff6b6b;--c-drug:#74a6ff;--c-concept:#d9b56b;--c-test:#ff7fc8}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible","Inter","Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;font-size:17px;line-height:1.7;transition:background .3s}
#app{display:flex;min-height:100vh}
nav{width:300px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--line);padding:18px;position:sticky;top:0;height:100vh;overflow:auto}
nav h1{font-size:20px;margin:0 0 4px}nav .sub{color:var(--mute);font-size:13px;margin-bottom:14px}
nav .grp{font-weight:700;margin:12px 0 4px;font-size:14px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute)}
nav .lec{font-weight:600;font-size:14px;margin:6px 0}
nav a{display:block;padding:6px 10px;border-radius:8px;color:var(--ink);text-decoration:none;font-size:14px;line-height:1.4;cursor:pointer}
nav a:hover{background:var(--bg)}nav a.on{background:var(--acc);color:#fff}
nav a .soon{font-size:11px;opacity:.7}
main{flex:1;max-width:980px;margin:0 auto;padding:24px 28px 120px}
.top{position:sticky;top:0;z-index:20;background:var(--bg);padding:10px 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.bar{flex:1;min-width:180px;height:12px;background:var(--line);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#2fbf71,#2f6fdb);transition:width .6s}
.pill{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:14px;white-space:nowrap}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:6px 12px}
button:hover{border-color:var(--acc)}button.pri{background:var(--acc);color:#fff;border-color:var(--acc)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px 26px;margin:22px 0;transition:opacity .3s,box-shadow .3s}
.card h2{margin:0 0 6px;font-size:23px;line-height:1.3}.card h3{font-size:18px;margin:18px 0 6px}
.meta{color:var(--mute);font-size:14px;margin-bottom:10px}
.card p{margin:10px 0;max-width:72ch}
body.focus .card{opacity:.22}body.focus .card.active{opacity:1;box-shadow:0 0 0 3px var(--acc)}
.scene{border-left:5px solid var(--c-hormone);background:color-mix(in srgb,var(--c-hormone) 9%,transparent);padding:10px 16px;border-radius:0 10px 10px 0;margin:12px 0}
.hint{background:color-mix(in srgb,#f5c518 18%,transparent);border-radius:10px;padding:10px 14px;margin:12px 0}
.corr{background:color-mix(in srgb,var(--c-disease) 10%,transparent);border:1px dashed var(--c-disease);border-radius:10px;padding:10px 14px;margin:12px 0;font-size:15px}
.exam{background:color-mix(in srgb,var(--acc) 12%,transparent);border:2px solid var(--acc);border-radius:12px;padding:12px 18px;margin:14px 0}
.recap{background:color-mix(in srgb,var(--ok) 10%,transparent);border-radius:10px;padding:8px 16px;margin:12px 0;display:none}.recap.show{display:block}
.goals li{margin:4px 0}.goals li.got::marker{content:"✅ "}
.term{font-weight:700;cursor:pointer;border-bottom:2px dotted currentColor}
.t-enzyme{color:var(--c-enzyme)}.t-hormone{color:var(--c-hormone)}.t-cell{color:var(--c-cell)}.t-disease{color:var(--c-disease)}.t-drug{color:var(--c-drug)}.t-concept{color:var(--c-concept)}
.code{font-size:12px;color:var(--mute);background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:0 5px;margin-left:3px;font-family:ui-monospace,monospace;font-weight:400}
#pop{position:absolute;z-index:99;max-width:340px;background:var(--panel);border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.25);border-radius:12px;padding:12px 14px;font-size:15px;line-height:1.5;display:none}
#pop b{display:block;margin-bottom:4px}#pop .why{margin-top:6px;color:var(--mute)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:14px;margin:8px 0}
.quiz{border-top:1px solid var(--line);margin-top:16px;padding-top:12px}
.quiz .q{font-weight:600;margin:8px 0}.opt{display:block;width:100%;text-align:left;margin:6px 0}
.opt.right{background:color-mix(in srgb,var(--ok) 20%,var(--panel));border-color:var(--ok)}.opt.wrong{background:color-mix(in srgb,var(--bad) 18%,var(--panel));border-color:var(--bad)}
.fb{font-size:15px;margin:6px 0;padding:6px 10px;border-radius:8px;background:var(--bg)}
.done-badge{float:right;font-size:14px;color:var(--ok);font-weight:700}
figure{margin:14px 0}figure img,figure svg{max-width:100%;border-radius:10px;border:1px solid var(--line);background:#fff}
figcaption{font-size:14px;color:var(--mute);margin-top:4px}.ai{display:inline-block;background:#222;color:#fff;font-size:11px;border-radius:5px;padding:1px 6px;margin-right:6px}
.svgwrap{overflow-x:auto}.svgwrap svg{min-width:640px}
.ctrl{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.ctrl button.on{background:var(--acc);color:#fff}
.info{background:var(--bg);border-radius:10px;padding:10px 14px;min-height:48px;font-size:15px}
table{border-collapse:collapse;width:100%;font-size:15px}td,th{border-bottom:1px solid var(--line);padding:7px;text-align:left;vertical-align:top}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}.match button{display:block;width:100%;margin:5px 0;text-align:left}
.match button.sel{outline:3px solid var(--acc)}.match button.ok{background:color-mix(in srgb,var(--ok) 25%,var(--panel));opacity:.6;pointer-events:none}
.fc{perspective:900px;height:200px;cursor:pointer;margin:10px 0}.fc .in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.fc.flip .in{transform:rotateY(180deg)}.fc .f,.fc .b{position:absolute;inset:0;backface-visibility:hidden;border-radius:14px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;padding:20px;text-align:center;font-size:19px;background:var(--panel)}
.fc .b{transform:rotateY(180deg);background:color-mix(in srgb,var(--acc) 10%,var(--panel));font-size:16px}
.step{display:none;border-left:4px solid var(--line);padding:4px 14px;margin:12px 0}.step.show{display:block;animation:fade .5s}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
.soon-card{opacity:.85}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:200}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(120px);background:var(--ok);color:#fff;padding:12px 22px;border-radius:999px;font-weight:700;transition:transform .4s;z-index:201}
#toast.show{transform:translateX(-50%) translateY(0)}
svg text{font-family:inherit}
.pw-edge{cursor:pointer}.pw-node rect{transition:all .3s}
#modsel{display:none;font:inherit;font-size:14px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:6px 8px;max-width:100%}
@media(max-width:860px){nav{display:none}#app{display:block}main{padding:12px}#modsel{display:block;flex-basis:100%}}
.t-test{color:var(--c-test)}
.obj{background:color-mix(in srgb,var(--acc) 7%,transparent);border-radius:10px;padding:6px 16px;margin:10px 0;font-size:15px}.obj ul{margin:4px 0;padding-left:20px}
.ctrl button.clue.flag-red{border-color:var(--bad)}.ctrl button.clue.flag-grey{border-color:var(--mute)}.ctrl button.clue.on{background:var(--acc);color:#fff}
.labt tr.lr{cursor:pointer;transition:background .2s}.labt tr.lr:hover{background:var(--bg)}.labt tr.lr.sel{background:color-mix(in srgb,var(--acc) 14%,transparent)}.labt tr.lr.seen td:first-child::before{content:"✓ ";color:var(--ok)}
.labt tr.fH td:nth-child(2){color:var(--bad)}.labt tr.fL td:nth-child(2){color:var(--acc)}
.fl{font-size:12px;border-radius:6px;padding:1px 7px;background:var(--bg);color:var(--mute);white-space:nowrap}.fl.fh{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad);font-weight:700}.fl.flo{background:color-mix(in srgb,var(--acc) 18%,transparent);color:var(--acc);font-weight:700}
.ladder{display:flex;flex-direction:column-reverse;gap:6px;margin:8px 0;border-left:6px double var(--line);border-right:6px double var(--line);padding:6px 10px}
.ladder button{text-align:left;display:flex;align-items:center;gap:10px}.ladder button.on{background:var(--acc);color:#fff}.ladder button.seen:not(.on){border-color:var(--ok)}
.ladder .rung{display:inline-flex;width:26px;height:26px;border-radius:50%;background:var(--bg);color:var(--ink);align-items:center;justify-content:center;font-weight:800;font-size:14px;flex-shrink:0}
nav .area2{font-weight:700;font-size:15px;margin:2px 0 6px}
.sortrow{border-bottom:1px solid var(--line);padding:6px 0;display:flex;flex-wrap:wrap;align-items:center;gap:8px}.sortrow .st{flex:1;min-width:220px;font-size:15px}.sortrow .sb{display:flex;gap:6px}.sortrow .sb button{font-size:14px;padding:4px 10px}
.sortrow button.right{background:color-mix(in srgb,var(--ok) 20%,var(--panel));border-color:var(--ok)}.sortrow button.wrong{background:color-mix(in srgb,var(--bad) 18%,var(--panel));border-color:var(--bad)}.sortrow .sfb{flex-basis:100%;font-size:14px;color:var(--mute)}

.mlfig .zoombtn{display:block;padding:0;border:0;background:none;cursor:zoom-in;width:100%;text-align:left}
.mlfig img{display:block;width:100%;height:auto}
.mlfig .imgcheck{display:inline-block;margin-top:4px;background:#fff7e0;color:#5a4300;border-left:3px solid #e0a800;padding:3px 7px;border-radius:4px}
body.dark .mlfig .imgcheck{background:#3a3220;color:#f3e3b5}
.mlfig .credit{font-size:12px;opacity:.8}
.lightbox{position:fixed;inset:0;z-index:9999;background:rgba(10,10,12,.96);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px;overflow:auto;cursor:zoom-out}
.lightbox img{max-width:100%;max-height:78vh;object-fit:contain;background:#fff;border-radius:8px}
.lightbox .lbcap{color:#eee;background:#111;padding:8px 12px;border-radius:8px;font-size:14px;max-width:1000px;margin-top:8px;cursor:default}
.lightbox .lbcap .imgcheck{background:#3a3220;color:#f3e3b5}
.lightbox .lbclose{position:absolute;top:10px;right:14px;font-size:22px;background:#fff;color:#111;border:0;border-radius:50%;width:40px;height:40px;cursor:pointer}
/* mobile overflow fix (wide tables kept the page wider than the phone screen) */
@media(max-width:700px){.card table{display:block;max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}}
/* Subsections 7–9 */
details.chk{border:2px dashed var(--acc);border-radius:12px;padding:8px 12px;margin:14px 0;background:color-mix(in srgb,var(--acc) 6%,var(--panel))}details.chk summary{cursor:pointer;font-weight:700}details.chk p{margin:8px 0 2px}
.tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}.ptab small{color:var(--mute)}.ptab td,.ptab th{font-size:14px}
.pbar{display:block;height:7px;background:var(--line);border-radius:4px;margin-top:4px;min-width:60px}.pbar i{display:block;height:100%;border-radius:4px}
.mtiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin:10px 0}
.mtile{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px;border:2px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);cursor:pointer;text-align:center;min-height:70px}
.mtile .ml{font-size:28px;font-weight:900;color:var(--acc)}.mtile.open{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,var(--panel))}.mtile .mt{font-size:13px;line-height:1.35}
.info table td,.info table th{font-size:14px}
body.dark details.chk{background:color-mix(in srgb,var(--acc) 10%,var(--panel))}
.xgame{border:2px solid var(--line);border-radius:14px;padding:12px;margin:16px 0;background:color-mix(in srgb,var(--acc) 4%,var(--panel))}
.xord{margin:8px 0;padding-left:22px}.xord li{padding:4px 0;color:var(--ok);font-weight:600}
.xchips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}.xchip,.xstate{min-height:44px;text-align:left;font-size:15px}
.xstate{display:block;width:100%;margin:6px 0}.xstate.ok{border-color:var(--ok);opacity:.7}.xstate.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 15%,var(--panel))}
.xreset{margin-top:6px}.shake{animation:xsh .35s}@keyframes xsh{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.xcard{display:flex;align-items:center;justify-content:center;width:100%;min-height:120px;margin:8px 0;padding:14px;border:2px dashed var(--acc);border-radius:14px;background:var(--panel);color:var(--ink);font-size:18px;cursor:pointer;text-align:center}.xcard.back{border-style:solid;font-size:15px}
.xscen{font-size:16px;margin:8px 0}
.swipe{display:none;font-size:13px;color:var(--mute);margin:4px 0}
@media(max-width:700px){.swipe{display:block}[data-widget] .ctrl button,[data-widget] .sb button,.xchip{min-height:44px}[data-widget] .ctrl{gap:8px}}
.match{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.match button{white-space:normal;overflow-wrap:anywhere}
</style></head><body><noscript><div style="padding:40px;font:18px sans-serif">This page needs JavaScript. Please download the file and open it in Chrome, Edge, Safari or Firefox.</div></noscript>

nucleus:{l:"cyclopentanoperhydrophenanthrene nucleus",c:"concept",d:"The four-ring skeleton shared by every steroid: three six-carbon rings (A, B, C) and one five-carbon ring (D).",w:"Every adrenal hormone is this same skeleton with different side groups – small changes, big functional differences."},

pka:{l:"protein kinase A",c:"enzyme",d:"An enzyme activated by cyclic adenosine monophosphate that switches other proteins on by adding phosphate.",w:"Activates cholesterol ester hydrolase and the steroidogenic acute regulatory protein."},
ceh:{l:"cholesterol ester hydrolase",c:"enzyme",d:"Also called hormone-sensitive lipase; cuts the fatty acid off stored cholesteryl esters to free cholesterol.",w:"Quickly increases free cholesterol within minutes of a stress signal."},

mito:{l:"mitochondria",c:"cell",d:"Energy organelles; in adrenal cells they contain the first and last steroid enzymes and have bubble-like (tubulovesicular) cristae.",w:"Cholesterol side-chain cleavage and the 11-beta / aldosterone synthase steps happen here."},
ser:{l:"smooth endoplasmic reticulum",c:"cell",d:"A membrane network without ribosomes; the workshop for lipid and steroid enzymes.",w:"The middle steps (3-beta, 17-alpha, 21-hydroxylation) happen here; very abundant in steroid cells."},

preg:{l:"pregnenolone",c:"hormone",d:"The first 21-carbon steroid; the 'mother' of all steroid hormones.",w:"Every pathway starts here."},

hsd3:{l:"3-beta-hydroxysteroid dehydrogenase type 2",c:"enzyme",d:"Converts 'delta-5' steroids (pregnenolone, 17-hydroxypregnenolone, dehydroepiandrosterone) into 'delta-4' steroids (progesterone, 17-hydroxyprogesterone, androstenedione).",w:"Type 2 works in adrenal and gonads; type 1 in placenta and skin/liver.",k:"HSD3B2"},
cyp17:{l:"17-alpha-hydroxylase",c:"enzyme",d:"Adds an -OH at carbon 17 (the 'cortisol direction'). Same protein also has 17,20-lyase activity.",w:"Absent in glomerulosa – that is why glomerulosa cannot make cortisol or androgens.",k:"CYP17A1"},
lyase:{l:"17,20-lyase",c:"enzyme",d:"Second activity of the same protein as 17-alpha-hydroxylase: cuts off carbons 20–21 to make 19-carbon androgens.",w:"Strongest in reticularis; target of the prostate cancer drug abiraterone.",k:"CYP17A1"},

cyp11b2:{l:"aldosterone synthase",c:"enzyme",d:"Glomerulosa-only mitochondrial enzyme doing three steps: 11-beta-hydroxylation, 18-hydroxylation and 18-oxidation to make aldosterone.",w:"Controlled by angiotensin II and potassium, not mainly by adrenocorticotropic hormone.",k:"CYP11B2"},

sult:{l:"sulfotransferase",c:"enzyme",d:"Adds a sulfate group to dehydroepiandrosterone, making dehydroepiandrosterone sulfate.",w:"Dehydroepiandrosterone sulfate is a marker of adrenal (not ovarian) androgen production.",k:"SULT2A1"},

aldo:{l:"aldosterone",c:"hormone",d:"The main mineralocorticoid, from zona glomerulosa: retains sodium, excretes potassium.",w:"Lost in salt-wasting 21-hydroxylase deficiency → low sodium, high potassium."},
dhea:{l:"dehydroepiandrosterone",c:"hormone",d:"A weak 19-carbon adrenal androgen from the reticularis.",w:"Converted in peripheral tissues to testosterone and oestradiol."},
dheas:{l:"dehydroepiandrosterone sulfate",c:"hormone",d:"The sulfated, long-lived storage form of dehydroepiandrosterone in blood.",w:"High levels point to an adrenal source of androgen excess."},
andro:{l:"androstenedione",c:"hormone",d:"A 19-carbon androgen made from dehydroepiandrosterone or 17-hydroxyprogesterone.",w:"Shunted product in 21-hydroxylase deficiency → virilisation."},
angii:{l:"angiotensin II",c:"hormone",d:"Peptide from the renin–angiotensin system that rises when blood volume or pressure falls.",w:"Main stimulus (with potassium) for aldosterone synthase in glomerulosa."},
cah:{l:"congenital adrenal hyperplasia",c:"disease",d:"Inherited (autosomal recessive) defects of cortisol-making enzymes. Low cortisol → high adrenocorticotropic hormone → enlarged glands.",w:"21-hydroxylase deficiency is by far the most common form; included in German newborn screening."},
lipoid:{l:"congenital lipoid adrenal hyperplasia",c:"disease",d:"Mutation of steroidogenic acute regulatory protein: cholesterol cannot enter mitochondria, so ALL steroids are missing and cells fill with fat.",w:"Proves the transport step is rate-limiting."},
fgd:{l:"familial glucocorticoid deficiency",c:"disease",d:"Adrenocorticotropic hormone resistance due to melanocortin 2 receptor or accessory protein mutation.",w:"Low cortisol, very high adrenocorticotropic hormone (dark skin), but aldosterone is usually preserved."},

{id:"c1",title:"The steroid skeleton and the carbon countdown",min:3,goal:0,html:`
<div class="scene"><b>The scene:</b> A pharmacology student asks you: "Cortisol, aldosterone, testosterone, oestradiol – why do they all look like the same chicken-wire drawing?" Because they <i>are</i> the same skeleton.</div>
<p>Every steroid is built on the [[nucleus]]: three six-carbon rings (<b>A, B, C</b>) plus one five-carbon ring (<b>D</b>). Carbons are numbered 1 to 17 around the rings; extra carbons (18 to 27) sit on side groups.</p>
<p>[[cholesterol|Cholesterol]] has <b>27 carbons</b>. Each step down the pathway <b>removes carbons</b>:</p>
<div data-widget="nucleus"></div>
<div class="hint">💡 <b>Countdown 27 → 21 → 19 → 18:</b> "Cholesterol (27) cuts its tail to become the 21-club (cortisol, aldosterone, progesterone), the 19-club are the Androgens, and [[aromatase|Aromatase]] Amputates one more to make the 18-carbon oestrogens."</div>`,
recap:["All steroids share 4 rings: A, B, C (six carbons) and D (five carbons).","Cholesterol 27 → corticoids and progestogens 21 → androgens 19 → oestrogens 18.","Aromatase removes carbon 19 to turn androgens into oestrogens."],
quiz:[{q:"Which group has 19 carbons?",o:["Glucocorticoids","Androgens","Oestrogens","Mineralocorticoids"],a:1,e:"Androgens (dehydroepiandrosterone, androstenedione, testosterone) have 19 carbons. Glucocorticoids and mineralocorticoids have 21; oestrogens 18."},
{q:"Ring D of the steroid nucleus is…",o:["a six-carbon ring","a five-carbon ring (cyclopentane)","an aromatic ring"],a:1,e:"Rings A, B, C are cyclohexane (six carbons); ring D is cyclopentane (five carbons). Ring A becomes aromatic only in oestrogens."}]},

{id:"c2",title:"Where does the cholesterol come from?",min:3,goal:1,html:`
<div class="scene"><b>The scene:</b> A 60-year-old on a high-dose statin asks: "If you block my cholesterol, will my body stop making stress hormones?"</div>
<p>The adrenal cortex mainly <b>imports</b> cholesterol from blood [[ldl]]. In the lecture figure (Barrett, Medical Physiology) about <b>80 %</b> comes from circulating low-density lipoprotein and about <b>20 %</b> is made inside the cell from acetyl-coenzyme A.</p>
<p><b>The import route, step by step:</b></p>
<ol><li>Low-density lipoprotein binds the [[ldlr]].</li>
<li>The receptor sits in a [[clathrin]] → [[endocytosis]] swallows it.</li>
<li>The vesicle fuses with a [[lysosome]] → free cholesterol is released.</li>
<li>Extra cholesterol is stored as [[ester|cholesteryl esters]] in [[lipid]].</li></ol>
<p>Those fat droplets dissolve during slide preparation – that is why fasciculata cells look pale and foamy: the famous <b>"clear cells"</b>.</p>
<div data-widget="cell"></div>
<figure class="mlfig"><button class="zoombtn" type="button" aria-label="Enlarge figure: Labelled illustration of a zona fasciculata clear cell"><img src="images/m5-clear-cell-labelled.jpg" alt="Labelled illustration of a zona fasciculata clear cell" loading="lazy" width="1400" height="867"></button>
<figcaption><span class="ai">AI</span><b>A zona fasciculata "clear cell" – labelled.</b> The yellow lipid droplets (cholesteryl esters) are the cholesterol store; the mitochondria and smooth endoplasmic reticulum are where steroids are made. Top right: a low-density lipoprotein particle arriving in a clathrin-coated pit. <i>Tap or click to enlarge.</i><br><span class="imgcheck">🔍 <b>Image check:</b> real fasciculata cells are <b>polygonal</b> (many-sided, packed in columns), not round as drawn here. The lipid droplets are drawn <b>too large</b> compared with the nucleus. The mitochondrial cristae look more <b>tubular</b> than the typical tubulovesicular (bubbly) shape of steroid cells.</span><br><span class="credit">AI illustration generated by ChatGPT, labelled and checked by MedLearn.</span></figcaption></figure>
<figure class="mlfig"><button class="zoombtn" type="button" aria-label="Enlarge figure: Numbered illustration of low-density lipoprotein uptake by receptor-mediated endocytosis"><img src="images/m5-ldl-uptake-labelled.jpg" alt="Numbered illustration of low-density lipoprotein uptake by receptor-mediated endocytosis" loading="lazy" width="1400" height="783"></button>
<figcaption><span class="ai">AI</span><b>How the cell imports cholesterol, in 6 steps.</b> Follow the blue numbers from left to right: bind → pinch off → coat released → fusion with a lysosome → free cholesterol → stored in lipid droplets. <i>Tap or click to enlarge.</i><br><span class="imgcheck">🔍 <b>Image check:</b> the mitochondrial cristae are drawn as <b>shelf-like/tubular</b> folds; in adrenal cortex cells they are typically <b>tubulovesicular</b> (bubbly). The steps are shown side by side in one cell for teaching – in reality they happen at different times and places.</span><br><span class="credit">AI illustration generated by ChatGPT, labelled and checked by MedLearn.</span></figcaption></figure>
<p><b>Back to our patient:</b> [[statin|Statins]] lower blood cholesterol, but clinically important adrenal insufficiency is not a recognised routine problem – the adrenal compensates by making more receptors and taking up more low-density lipoprotein.</p>
<div class="hint">💡 "The adrenal shops more than it cooks" – mostly imported cholesterol, a little home-made.</div>`,
recap:["Main source: blood low-density lipoprotein via receptor-mediated endocytosis.","Lysosomes free the cholesterol; surplus is stored as cholesteryl esters in lipid droplets.","Lipid droplets make fasciculata cells look 'clear'."],
quiz:[{q:"Why do zona fasciculata cells look pale ('clear') on routine histology?",o:["They have no nucleus","Their lipid droplets dissolve during processing","They are full of glycogen"],a:1,e:"Cholesteryl-ester droplets are washed out by the solvents used in tissue processing, leaving pale, foamy cytoplasm."}]},

{id:"c3",title:"The switch: adrenocorticotropic hormone and the rate-limiting step",min:4,goal:2,html:`
<div class="scene"><b>The scene:</b> You stub your toe at 3 a.m. Within minutes your cortisol rises. How does the adrenal respond so fast if it stores no cortisol?</div>
<p><b>The signalling chain</b> (follow the arrows):</p>
<p>[[acth]] → [[mc2r]] (needs [[mrap]]) → [[gs]] → adenylyl cyclase → [[camp]] → [[pka]].</p>
<p>Protein kinase A then does two fast jobs:</p>
<ol><li>Activates [[ceh]] → frees cholesterol from lipid droplets.</li>
<li>Activates [[star]] → moves cholesterol from the outer to the <b>inner</b> mitochondrial membrane. This transport is the <b>[[ratelimit]]</b>.</li></ol>
<p>On the inner membrane, [[scc]] cuts the side chain → [[preg]].</p>
<h3>Fast versus slow effects</h3>
<table><tr><th>Acute (minutes)</th><th>Long-term (hours to days)</th></tr>
<tr><td>More free cholesterol, more transport into mitochondria</td><td>More enzyme genes switched on, more low-density lipoprotein receptors, gland growth (hypertrophy). Without adrenocorticotropic hormone the fasciculata and reticularis <b>atrophy</b>.</td></tr></table>
<h3>When the switch is broken</h3>
<p>• [[fgd]]: receptor does not work → low cortisol, very high adrenocorticotropic hormone (dark skin), aldosterone usually normal (angiotensin II drives it).<br>
• [[lipoid]]: transport protein broken → <b>no steroids at all</b>, glands stuffed with fat.</p>
<div class="hint">💡 "<b>StAR is the gatekeeper</b>": the star of the show decides how much cholesterol gets in the door – the enzymes only work as fast as the gate opens.</div>
<div class="corr">📝 <b>Name check:</b> the lecture calls the side-chain cleavage enzyme "desmolase" – an older name. Current name: cholesterol side-chain cleavage enzyme <span class="code">CYP11A1</span>. Remember: the <i>enzyme</i> is not rate-limiting; the <i>transport</i> by steroidogenic acute regulatory protein is.</div>`,
recap:["Adrenocorticotropic hormone → melanocortin 2 receptor → cyclic adenosine monophosphate → protein kinase A.","Rate-limiting step = cholesterol transport into the inner mitochondrial membrane by steroidogenic acute regulatory protein.","Acute: cholesterol supply (minutes). Chronic: enzymes and gland growth (days); no hormone = atrophy."],
quiz:[{q:"What is the rate-limiting step of adrenal steroid synthesis?",o:["21-hydroxylation","Cholesterol transport into the inner mitochondrial membrane","Release of cortisol from secretory vesicles","Sulfation of dehydroepiandrosterone"],a:1,e:"Steroidogenic acute regulatory protein-mediated transfer of cholesterol to the inner mitochondrial membrane (where side-chain cleavage happens) sets the pace."},
{q:"A child has very low cortisol, very high adrenocorticotropic hormone, dark skin, but normal sodium and potassium. Most likely?",o:["Familial glucocorticoid deficiency","Salt-wasting 21-hydroxylase deficiency","Congenital lipoid adrenal hyperplasia"],a:0,e:"Receptor resistance hits cortisol, but aldosterone (driven by angiotensin II) is preserved – so electrolytes are normal. Lipoid hyperplasia and salt-wasting would cause salt loss."}]},

{id:"c4",title:"The organelle ping-pong",min:3,goal:3,html:`
<div class="scene"><b>The scene:</b> Picture a factory where the product travels from the basement to the first floor and back down again for the final polish.</div>
<p>Steroid synthesis bounces between two organelles. Click each step to follow the ball:</p>
<div data-widget="pingpong"></div>
<p><b>No storage!</b> Unlike peptide hormones or adrenaline, cortisol is fat-soluble and simply <b>diffuses out</b> of the cell as soon as it is made. So cortisol is made <b>on demand</b>; the "store" is the cholesterol in lipid droplets.</p>
<div class="hint">💡 "<b>M – S – M</b>: Mitochondria start, Smooth endoplasmic reticulum in the middle, Mitochondria finish." First and last enzymes live in mitochondria.</div>`,
recap:["Mitochondria: cholesterol → pregnenolone.","Smooth endoplasmic reticulum: 3-beta-, 17-alpha-, 21-hydroxylation → 11-deoxycortisol.","Back in mitochondria: 11-beta-hydroxylase → cortisol (aldosterone synthase in glomerulosa). No vesicle storage."],
quiz:[{q:"Where does the final step to cortisol take place?",o:["Smooth endoplasmic reticulum","Mitochondria","Golgi apparatus","Secretory granules"],a:1,e:"11-beta-hydroxylase sits in the inner mitochondrial membrane."},
{q:"Why can't the adrenal cortex release a big pre-made 'burst' of cortisol like the medulla releases adrenaline?",o:["Cortisol is stored in the nucleus","Cortisol is lipid-soluble and is not stored in vesicles","Cortisol is destroyed by lysosomes"],a:1,e:"Steroids cross membranes freely, so they leave the cell as soon as they are made; regulation happens at synthesis."}]},

{id:"c5",title:"Three zones, three products",min:4,goal:4,html:`
<div class="scene"><b>The scene:</b> Same cholesterol, same starting enzyme – yet the outer layer makes salt hormone, the middle makes sugar hormone, the inner makes sex hormone. The secret: <b>which enzymes each zone switches on.</b></div>
<p><b>Zona glomerulosa (salt):</b> has [[cyp11b2]] but <b>no</b> [[cyp17]] → can only go the [[aldo|aldosterone]] way. Controlled by [[angii]] and blood potassium.</p>
<p><b>Zona fasciculata (sugar):</b> has 17-alpha-hydroxylase and [[cyp11b1]] → [[cortisol]]. Controlled by adrenocorticotropic hormone.</p>
<p><b>Zona reticularis (sex):</b> strong [[lyase]] and [[sult]] → [[dhea]] and [[dheas]]. Converted peripherally to testosterone and oestradiol.</p>
<p>👉 <b>Interactive pathway:</b> click any enzyme label, or switch on a deficiency or drug to see what gets blocked (red) and where the flow is shunted (bold orange).</p>
<figure class="mlfig"><button class="zoombtn" type="button" aria-label="Enlarge figure: Labelled illustration of an adrenal gland cross-section showing capsule, three cortical zones and medulla"><img src="images/m5-cross-section-labelled.jpg" alt="Labelled illustration of an adrenal gland cross-section showing capsule, three cortical zones and medulla" loading="lazy" width="1400" height="673"></button>

{id:"c6",title:"The enzyme toolkit",min:4,goal:5,html:`
<div class="scene"><b>The scene:</b> Exam question: "Which enzyme is found in the glomerulosa only?" Let's build your toolkit.</div>
<div class="svgwrap"><table>
<tr><th>Enzyme</th><th>Does</th><th>Where</th></tr>
<tr><td>[[scc]]</td><td>Cholesterol → pregnenolone</td><td>All zones, gonads, placenta, brain</td></tr>
<tr><td>[[hsd3]]</td><td>Pregnenolone → progesterone (delta-5 → delta-4)</td><td>Adrenal, gonads (type 1: placenta, liver)</td></tr>
<tr><td>[[cyp17]] / [[lyase]]</td><td>Adds 17-OH / cuts to 19 carbons</td><td>Fasciculata, reticularis, gonads – <b>not glomerulosa</b></td></tr>
<tr><td>[[cyp21]]</td><td>Progesterone → 11-deoxycorticosterone; 17-hydroxyprogesterone → 11-deoxycortisol</td><td>All adrenal zones</td></tr>
<tr><td>[[cyp11b1]]</td><td>11-deoxycortisol → cortisol</td><td>Fasciculata</td></tr>
<tr><td>[[cyp11b2]]</td><td>Corticosterone → aldosterone</td><td>Glomerulosa only</td></tr>
<tr><td>[[aromatase]]</td><td>Androgens → oestrogens</td><td>Fat, ovary, placenta</td></tr>
<tr><td>[[hsd11b1]]</td><td>Cortisone → cortisol (activates)</td><td>Liver, fat, brain</td></tr>
<tr><td>[[hsd11b2]]</td><td>Cortisol → cortisone (inactivates)</td><td>Kidney, colon, salivary glands, placenta</td></tr></table></div>
<div class="hint">💡 <b>11-beta-hydroxysteroid dehydrogenase: "Type 1 turns it ON (1 = one = on), type 2 turns it OFF (2 = 'to' the toilet)."</b> Type 2 guards the kidney's mineralocorticoid receptor.</div>
<h3>🎮 Matching game: click an enzyme, then its step</h3>
<div data-widget="match"></div>`,
recap:["Side-chain cleavage and 21-hydroxylase: all zones; aldosterone synthase: glomerulosa only.","17-alpha-hydroxylase/17,20-lyase is one protein, absent from glomerulosa.","11-beta-hydroxysteroid dehydrogenase type 1 activates, type 2 inactivates cortisol."],
quiz:[{q:"Which enzyme protects the kidney's mineralocorticoid receptor from cortisol?",o:["11-beta-hydroxysteroid dehydrogenase type 1","11-beta-hydroxysteroid dehydrogenase type 2","11-beta-hydroxylase"],a:1,e:"Type 2 converts cortisol to inactive cortisone in the kidney, so only aldosterone activates the receptor."}]},

{id:"c7",title:"When enzymes fail: deficiencies and drugs",min:4,goal:6,html:`
<div class="scene"><b>The scene:</b> Three patients, three broken enzymes, three different blood pressures. Learn the rule once, solve them all.</div>
<p>In [[cah]] cortisol is low → adrenocorticotropic hormone is high → the gland enlarges and precursors pile up <b>before</b> the block and spill into open side-roads.</p>
<table><tr><th>Deficiency</th><th>Blood pressure / potassium</th><th>Sex hormones</th><th>Key lab</th></tr>
<tr><td>[[cyp21]] deficiency</td><td>Low blood pressure, salt wasting, <b>high</b> potassium</td><td>Excess androgens → virilised girls</td><td>High [[ohp17]]</td></tr>
<tr><td>[[cyp11b1]] deficiency</td><td><b>Hypertension</b>, low potassium ([[doc]] acts like aldosterone)</td><td>Excess androgens → virilisation</td><td>High 11-deoxycortisol and 11-deoxycorticosterone</td></tr>
<tr><td>[[cyp17]] deficiency</td><td><b>Hypertension</b>, low potassium</td><td><b>No</b> sex steroids → undervirilised boys, absent puberty</td><td>High 11-deoxycorticosterone and [[corticosterone]]</td></tr></table>
<div class="hint">💡 <b>The "1" rule:</b> If the enzyme number <b>ends</b> in 1 (21, 11) → <b>virilisation</b>. If it <b>starts</b> with 1 (11, 17) → <b>hypertension</b>. 11-beta-hydroxylase does both.</div>
<h3>Drugs that block steps</h3>
<p>• [[ketoconazole]] / levoketoconazole – side-chain cleavage and 17-alpha-hydroxylase.<br>
• [[metyrapone]] and [[osilodrostat]] – 11-beta-hydroxylase (Cushing treatment; metyrapone test).<br>
• [[etomidate]] – 11-beta-hydroxylase: cortisol suppression after anaesthetic induction.<br>
• [[abiraterone]] – 17-alpha-hydroxylase/17,20-lyase (prostate cancer).<br>
• [[mitotane]] – destroys adrenal cortex (adrenocortical carcinoma).<br>
• [[liquorice]] – blocks 11-beta-hydroxysteroid dehydrogenase type 2 → [[ame]].</p>
<p>Go back to the <a href="#c5" onclick="go('c5')">pathway diagram</a> and toggle these to see the blocks.</p>`,
recap:["Low cortisol → high adrenocorticotropic hormone → precursor pile-up and shunting.","21: salt loss + virilisation; 11: hypertension + virilisation; 17: hypertension + no sex steroids.","Metyrapone, osilodrostat, etomidate block 11-beta-hydroxylase; abiraterone blocks 17; liquorice blocks 11-beta-hydroxysteroid dehydrogenase type 2."],
quiz:[{q:"A 16-year-old phenotypic girl has no breast development, hypertension and low potassium. Which deficiency?",o:["21-hydroxylase","17-alpha-hydroxylase","11-beta-hydroxysteroid dehydrogenase type 1"],a:1,e:"No sex steroids (no puberty) plus mineralocorticoid excess from 11-deoxycorticosterone = 17-alpha-hydroxylase deficiency."},
{q:"Which drug is the basis of a test of pituitary reserve because it makes 11-deoxycortisol rise?",o:["Abiraterone","Metyrapone","Mitotane"],a:1,e:"Metyrapone blocks 11-beta-hydroxylase; a healthy pituitary responds with more adrenocorticotropic hormone and 11-deoxycortisol rises."}]}
],
cases:[
{id:"k1",title:"Case 1 – The newborn who crashed on day 10",steps:[
{t:`<b>The scene:</b> A term baby is born after an uneventful pregnancy. The midwife notices enlarged clitoris and partly fused labia; no gonads are palpable. The karyotype later returns 46,XX.`,q:"What is the single most useful first blood test?",o:["Serum 17-hydroxyprogesterone","Thyroid-stimulating hormone","Serum cortisol only"],a:0,e:"A raised 17-hydroxyprogesterone points to 21-hydroxylase deficiency – the most common cause of virilisation in a genetically female newborn. (Germany screens for it in the newborn blood spot.)"},
{t:`The degree of virilisation is described on the [[prader]] (schematic below – no photographs are used).<div data-widget="prader"></div>`},
{t:`<b>Day 10:</b> The baby feeds poorly, vomits and is lethargic. Sodium is low, potassium is high, glucose is low-normal.`,q:"Why does the salt crisis appear now and not at birth?",o:["Maternal hormones and placental clearance protected the baby until birth; mineralocorticoid deficiency shows over 1–2 weeks","The baby caught an infection","Breast milk contains too much potassium"],a:0,e:"In the womb the placenta handles salt and potassium balance. After birth, lack of aldosterone causes progressive salt loss; crises typically appear in the first 1–2 weeks."},
{t:`Look at the pathway: 21-hydroxylase blocks BOTH the cortisol and aldosterone branches. High adrenocorticotropic hormone drives precursors into the only open road: androgens.`,q:"Which treatment combination is correct?",o:["Hydrocortisone + fludrocortisone + salt","Fludrocortisone alone","Spironolactone + potassium"],a:0,e:"Hydrocortisone replaces cortisol and suppresses adrenocorticotropic hormone (so androgens fall); fludrocortisone and salt replace aldosterone. Acute crisis: intravenous fluids, glucose and hydrocortisone."}],
take:["21-hydroxylase deficiency = low cortisol + low aldosterone + androgen excess.","Girls: ambiguous genitalia at birth; boys: often missed until salt-wasting crisis.","High 17-hydroxyprogesterone; treat with hydrocortisone + fludrocortisone + salt."]},
{id:"k2",title:"Case 2 – The liquorice lover with high blood pressure",steps:[
{t:`<b>The scene:</b> A 52-year-old Dutch man has new hypertension and muscle weakness. Potassium is low. He proudly says he eats a large bag of salty liquorice every day.`,q:"You measure renin and aldosterone. What do you expect?",o:["High renin, high aldosterone","Low renin, low aldosterone","Low renin, high aldosterone"],a:1,e:"The salt-retaining effect suppresses renin, and therefore aldosterone. Low/low with hypertension and low potassium = apparent mineralocorticoid excess pattern."},
{t:`Glycyrrhetinic acid blocks [[hsd11b2]] in the kidney. Cortisol – present in far higher amounts than aldosterone – is no longer inactivated and occupies the mineralocorticoid receptor.`,q:"Best management?",o:["Stop liquorice, correct potassium, monitor blood pressure","Start hydrocortisone","Adrenalectomy"],a:0,e:"Effects reverse over weeks after stopping. A mineralocorticoid receptor blocker can be used meanwhile if needed."}],
take:["Cortisol can activate the mineralocorticoid receptor; 11-beta-hydroxysteroid dehydrogenase type 2 prevents this.","Liquorice → apparent mineralocorticoid excess: hypertension, low potassium, low renin, low aldosterone.","Same pattern: genetic type 2 deficiency, or very high cortisol overwhelming the enzyme (ectopic Cushing)."]},
{id:"k3",title:"Case 3 (bonus) – The hypertensive virilised child",steps:[
{t:`<b>The scene:</b> A 4-year-old girl has early pubic hair, rapid growth and a blood pressure well above the normal range for her age. Potassium is low.`,q:"Which enzyme defect fits virilisation PLUS hypertension?",o:["21-hydroxylase","11-beta-hydroxylase","17-alpha-hydroxylase"],a:1,e:"11-beta-hydroxylase deficiency: androgen shunting plus accumulation of 11-deoxycorticosterone (a mineralocorticoid)."},
{t:`Labs: high 11-deoxycortisol and 11-deoxycorticosterone, low renin. Treatment: hydrocortisone suppresses adrenocorticotropic hormone, so precursors and blood pressure fall. Fludrocortisone is NOT needed.`}],
take:["11-beta-hydroxylase deficiency: virilisation + hypertension + low potassium.","Marker: 11-deoxycortisol; mineralocorticoid effect from 11-deoxycorticosterone.","Glucocorticoid alone usually fixes both problems."]}
],

/* ===== CBL 5: Adrenal insufficiency case (Schmidt syndrome) – glossary additions ===== */
Object.assign(CATS,{test:"Tests and investigations"});
Object.assign(GLOSSARY,{
addison:{l:"Addison disease",c:"disease",d:"Chronic primary adrenal insufficiency: the adrenal cortex itself is destroyed (most often by the immune system), so cortisol AND aldosterone are missing.",w:"Dark skin, salt craving, low sodium, high potassium. Lifelong replacement and a steroid emergency card."},
pai:{l:"primary adrenal insufficiency",c:"disease",d:"The adrenal gland itself fails. Cortisol, aldosterone and adrenal androgens all fall; the pituitary answers with very high adrenocorticotropic hormone.",w:"High adrenocorticotropic hormone → dark skin. No aldosterone → high potassium."},
sai:{l:"secondary adrenal insufficiency",c:"disease",d:"The pituitary does not make enough adrenocorticotropic hormone, so the adrenal is under-stimulated. Cortisol falls; aldosterone stays normal because the renin–angiotensin system still controls it.",w:"Most common cause: stopping long-term steroid tablets. Pale skin, normal potassium."},
tai:{l:"tertiary adrenal insufficiency",c:"disease",d:"The hypothalamus does not make enough corticotropin-releasing hormone, so pituitary and adrenal are both under-stimulated.",w:"Looks like secondary at the bedside. Long-term steroid therapy suppresses both hypothalamus and pituitary."},
crisis:{l:"adrenal crisis",c:"disease",d:"Acute, life-threatening lack of cortisol (often with lack of aldosterone): shock, vomiting, abdominal pain, confusion, low sodium, high potassium, low glucose.",w:"Treat immediately with hydrocortisone and saline. Never wait for test results."},
hpa:{l:"hypothalamic–pituitary–adrenal axis",c:"concept",d:"The hormone chain: hypothalamus (corticotropin-releasing hormone) → pituitary (adrenocorticotropic hormone) → adrenal cortex (cortisol). Cortisol switches the top two off (negative feedback).",w:"Where the chain breaks tells you whether the insufficiency is primary, secondary or tertiary."},
crh:{l:"corticotropin-releasing hormone",c:"hormone",d:"Hypothalamic hormone that tells the pituitary to release adrenocorticotropic hormone.",w:"Rises when cortisol is low, unless the hypothalamus itself is the broken part."},
pomc:{l:"proopiomelanocortin",c:"hormone",d:"A large precursor protein in the pituitary that is cut into adrenocorticotropic hormone and melanocyte-stimulating hormone.",w:"Lots of adrenocorticotropic hormone also means lots of melanocyte stimulation, so the skin darkens."},
hyperpig:{l:"hyperpigmentation",c:"concept",d:"Darkening of skin and mucosa, typically in palm creases, knuckles, scars, gums and the inside of the cheeks.",w:"Points to PRIMARY adrenal insufficiency (very high adrenocorticotropic hormone). Secondary = pale."},
renin:{l:"renin",c:"enzyme",d:"Kidney enzyme released when blood volume or pressure falls; starts the renin–angiotensin–aldosterone chain. Measured as plasma renin activity or concentration.",w:"High renin with low aldosterone means the adrenal cannot answer: primary insufficiency."},
hyponat:{l:"hyponatraemia",c:"concept",d:"Low blood sodium (below 136 mmol/L in this laboratory).",w:"In adrenal insufficiency: salt loss (no aldosterone) plus water retention (lack of cortisol raises antidiuretic hormone)."},
hyperkal:{l:"hyperkalaemia",c:"concept",d:"High blood potassium (above 5.1 mmol/L in this laboratory).",w:"Needs missing aldosterone, so it is typical of primary, not secondary, insufficiency. Dangerous for heart rhythm."},
hypogly:{l:"hypoglycaemia",c:"concept",d:"Low blood glucose.",w:"Cortisol keeps glucose up between meals by making new glucose in the liver (gluconeogenesis). Without cortisol, glucose falls."},
osm:{l:"serum osmolality",c:"test",d:"Concentration of dissolved particles in blood (285–295 milliosmoles per kilogram in this laboratory).",w:"Low osmolality proves the low sodium is true dilution (hypotonic hyponatraemia), not a laboratory artefact."},
adh:{l:"antidiuretic hormone",c:"hormone",d:"Also called vasopressin: a pituitary hormone that makes the kidney keep water (abbreviation: ADH).",w:"Cortisol normally restrains it. Lack of cortisol → more antidiuretic hormone → water retention → lower sodium, even in secondary insufficiency."},
eos:{l:"eosinophilia",c:"concept",d:"Too many eosinophils (a type of white blood cell) in blood.",w:"Cortisol normally lowers eosinophils, so their rise is a classic clue to cortisol deficiency."},
basalcort:{l:"morning (basal) cortisol",c:"test",d:"Blood cortisol taken around 8 a.m., when it should be near its daily peak.",w:"Slides: below 3 µg/dl = insufficiency very likely; above 14 µg/dl = axis intact; in between = do a stimulation test."},
synacthen:{l:"tetracosactide",c:"drug",d:"Synthetic adrenocorticotropic hormone (its first 24 amino acids). Brand names: Synacthen (Europe), Cortrosyn, also called cosyntropin (United States).",w:"Used for the stimulation tests: a healthy adrenal answers with a cortisol rise."},
sst:{l:"short adrenocorticotropic hormone stimulation test",c:"test",d:"Give 250 µg tetracosactide into a vein or muscle; measure cortisol at 0, 30 and 60 minutes. A low-dose 1 µg version also exists.",w:"First-line test to confirm adrenal insufficiency. Normal peak above 18–20 µg/dl (about 500–550 nmol/L) in the slides; cut-offs depend on the laboratory method."},
lst:{l:"long (depot) stimulation test",c:"test",d:"Long-acting tetracosactide is given; cortisol is measured repeatedly over 48 hours.",w:"No rise = Addison disease. Late rise = secondary insufficiency (a 'sleepy' but healthy gland waking up)."},
itt:{l:"insulin tolerance test",c:"test",d:"Insulin is injected into a vein to cause controlled hypoglycaemia. The stress should make cortisol rise.",w:"Gold standard for the WHOLE axis (hypothalamus, pituitary and adrenal). Dangerous in heart disease, epilepsy, or a patient who is already hypoglycaemic."},
ab21:{l:"21-hydroxylase antibodies",c:"test",d:"Autoantibodies against the adrenal enzyme 21-hydroxylase.",w:"Positive = autoimmune adrenalitis, the most common cause of Addison disease in Europe."},
ct:{l:"adrenal computed tomography",c:"test",d:"Cross-sectional X-ray imaging of the adrenals.",w:"Shows bleeding, metastases, infection (such as tuberculosis, often calcified) or a normal or small gland in autoimmune disease. Less important in primary insufficiency."},
aps:{l:"autoimmune polyglandular syndrome",c:"disease",d:"Two or more endocrine glands attacked by the immune system in the same person; four types.",w:"When you find one autoimmune endocrine disease, look for the others."},
aps2:{l:"autoimmune polyglandular syndrome type 2",c:"disease",d:"Autoimmune adrenal insufficiency (always present) plus autoimmune thyroid disease and/or type 1 diabetes. Eponym: Schmidt syndrome.",w:"Adult onset, more common in women, linked to the tissue types human leukocyte antigen DR3 and DR4. Our patient's diagnosis."},
aps1:{l:"autoimmune polyglandular syndrome type 1",c:"disease",d:"Rare inherited (autosomal recessive) syndrome caused by mutations in the autoimmune regulator gene (abbreviation: AIRE). Classic triad: chronic mucocutaneous candidiasis, hypoparathyroidism, Addison disease (at least two needed).",w:"Starts in childhood, usually with candidiasis first."},
schmidt:{l:"Schmidt syndrome",c:"disease",d:"Addison disease plus autoimmune thyroid disease. When type 1 diabetes is also present, some books call it Carpenter syndrome.",w:"Older name for autoimmune polyglandular syndrome type 2."},
thyroiditis:{l:"autoimmune thyroiditis",c:"disease",d:"Immune attack on the thyroid (Hashimoto thyroiditis). It may cause a goitre and, later, hypothyroidism.",w:"Can stay euthyroid for years, so thyroid function needs regular checks."},
euthy:{l:"euthyroidism",c:"concept",d:"Normal thyroid hormone levels (normal thyroid-stimulating hormone and free thyroxine).",w:"Our patient has a goitre and antibodies, but normal hormones, so no thyroxine is needed yet."},
antitg:{l:"anti-thyroglobulin antibodies",c:"test",d:"Antibodies against thyroglobulin, the storage protein of the thyroid.",w:"Positive in our patient: 24.3 units/ml (normal up to 4.1)."},
antitpo:{l:"anti-thyroid peroxidase antibodies",c:"test",d:"Antibodies against thyroid peroxidase, the enzyme that makes thyroid hormone.",w:"The most sensitive marker of autoimmune thyroiditis. Negative in our patient (0.37), which is less typical."},
tsh:{l:"thyroid-stimulating hormone",c:"hormone",d:"Pituitary hormone that drives the thyroid; the best screening test of thyroid function.",w:"Normal in our patient (0.94 micro-units/ml)."},
goitre:{l:"goitre grade Ib",c:"concept",d:"Enlarged thyroid. In the World Health Organization grading, grade Ib = palpable, and visible only when the neck is extended.",w:"The thyroid clue in our patient: think autoimmune thyroiditis."},
poi:{l:"primary ovarian insufficiency",c:"disease",d:"The ovaries stop working before age 40 (menopause before 40).",w:"Can be autoimmune and travels with Addison disease in autoimmune polyglandular syndrome type 2. Our patient: menopause at 38."},
shpt:{l:"secondary hyperparathyroidism",c:"disease",d:"The parathyroid glands make more parathyroid hormone in response to a problem elsewhere (here low vitamin D), which keeps calcium normal.",w:"Parathyroid hormone high, calcium normal or low, vitamin D low. Treat the vitamin D."},
pth:{l:"parathyroid hormone",c:"hormone",d:"Hormone that raises blood calcium.",w:"72 pg/ml in our patient (normal 12–65)."},
vitd:{l:"25-hydroxyvitamin D",c:"test",d:"The storage form of vitamin D measured in blood.",w:"18 ng/ml in our patient (normal range in the slides 30–100)."},
cholestasis:{l:"cholestasis",c:"disease",d:"Bile flow is blocked or reduced, so conjugated (direct) bilirubin and gamma-glutamyl transferase rise.",w:"Yellow eyes and pain under the right ribs. Here probably from gallstones: a second problem next to the adrenal one."},
ggt:{l:"gamma-glutamyl transferase",c:"enzyme",d:"Liver and bile-duct enzyme; rises in cholestasis and with alcohol or some drugs.",w:"101 units/L in our patient (normal 9–36)."},
dexa:{l:"dexamethasone",c:"drug",d:"Very potent, long-acting synthetic glucocorticoid with practically no mineralocorticoid (salt-retaining) effect.",w:"Not first choice in adrenal crisis or for routine Addison replacement."},
pred:{l:"prednisolone",c:"drug",d:"Intermediate-acting synthetic glucocorticoid (prednisone is converted into prednisolone in the liver).",w:"Long-term use suppresses the axis: secondary insufficiency if it is stopped suddenly."},
sickday:{l:"sick-day rules",c:"concept",d:"Rules for raising the glucocorticoid dose during illness: fever above 38 °C → double; above 39 °C → triple; cannot keep tablets down → injection.",w:"The most important teaching to prevent adrenal crisis."},
card:{l:"steroid emergency card",c:"concept",d:"A card the patient carries stating that they depend on steroids and need hydrocortisone in an emergency.",w:"Tells emergency staff to give hydrocortisone immediately."},
kit:{l:"hydrocortisone emergency injection kit",c:"drug",d:"100 mg hydrocortisone for injection into a muscle by the patient or family.",w:"For vomiting or collapse, followed by going to hospital."},
wfs:{l:"Waterhouse–Friderichsen syndrome",c:"disease",d:"Bleeding into both adrenal glands during severe sepsis, classically meningococcal.",w:"Sudden adrenal crisis with a purple (purpuric) rash and shock."},
gcsup:{l:"glucocorticoid-induced adrenal suppression",c:"disease",d:"Long-term steroid tablets (or other forms) switch off corticotropin-releasing hormone and adrenocorticotropic hormone, and the adrenal shrinks from disuse.",w:"Stopping suddenly causes secondary or tertiary insufficiency. Steroids must be tapered."}
});

const CBL5={
meta:"Endocrinology › Case-based learning 5 · Prof. Dr. Ionela Pascanu, UMCH 2026 · 35 slides · ⏱ about 30 minutes in 7 bite-sized steps",
intro:`<div class="scene"><b>The scene:</b> M.T., a 53-year-old woman, is sent up from the emergency department with pain under her right ribs, nausea, vomiting, exhaustion, low blood pressure and a low sodium. Everyone is thinking "gallbladder". You are going to follow her case slide by slide, and find out what is really going on.</div>
<p>This whole module is <b>one patient</b>. Each step reveals the next part of her story: you decide, get feedback, collect XP.</p>`,
goals:[
"Spot the history clues that point to adrenal insufficiency",
