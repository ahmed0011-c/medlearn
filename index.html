crisis:CBL5.crisis,
sort:[["Autoimmune adrenalitis (21-hydroxylase antibodies)","P","The immune system destroys the adrenal cortex: the most common primary cause in high-income countries."],
["Stopping prednisolone after 6 months","S","Long-term glucocorticoids suppress corticotropin-releasing hormone and adrenocorticotropic hormone (tertiary + secondary). The most common cause overall."],
["Meningococcal sepsis with bleeding into both adrenals","P","Waterhouse–Friderichsen syndrome: the adrenal cortex is destroyed by haemorrhage."],
["Bleeding at childbirth, then no breast milk","S","Sheehan syndrome: pituitary necrosis → no adrenocorticotropic hormone (and no prolactin)."],
["Adrenoleukodystrophy","P","X-linked: very long chain fatty acids damage the adrenal cortex itself."],
["Ipilimumab for melanoma, then headache and fatigue","S","Checkpoint-inhibitor hypophysitis: the pituitary is inflamed. (More rarely these drugs cause primary adrenalitis.)"],
["Tuberculosis with calcified adrenals","P","Infection destroys both adrenal glands."],
["Long-term high-dose opioids","S","Opioids suppress the hypothalamus and pituitary."],
["Mitotane for adrenocortical carcinoma","P","Mitotane destroys adrenal cortex cells (adrenolytic)."],
["Craniopharyngioma treated with surgery and radiotherapy","S","Hypothalamic and pituitary damage: tertiary and secondary failure."]],
ladder:[["1. Morning cortisol","Blood at about 8 a.m., before any glucocorticoid","Very low makes insufficiency very likely; clearly normal makes it unlikely; anything in between needs a stimulation test. Commonly used thresholds: below about 3 µg/dl (about 83 nmol/L) very likely; above about 14 µg/dl (about 386–400 nmol/L) unlikely (as in your CBL 5 slides). Exact cut-offs vary between laboratories.","The Endocrine Society (2016) suggests that a morning cortisol below 5 µg/dl (about 140 nmol/L) together with a high adrenocorticotropic hormone strongly suggests primary insufficiency while you arrange confirmation."],
["2. Adrenocorticotropic hormone","Same morning sample","High → primary. Low or inappropriately normal → secondary or tertiary.","The sample must be handled quickly and cold; the hormone breaks down in the tube."],
["3. Renin and aldosterone","Plasma renin and aldosterone at the same time","High renin with low or low-normal aldosterone → mineralocorticoid deficiency → primary. Normal in secondary and tertiary.","Mineralocorticoid deficiency can appear before cortisol deficiency in early autoimmune Addison disease."],
["4. Short stimulation test","250 µg tetracosactide (synthetic adrenocorticotropic hormone) into a vein or muscle; cortisol at 0, 30 and 60 minutes","Peak below the laboratory cut-off (classically 18–20 µg/dl, about 500–550 nmol/L, lower with newer assays) → adrenal insufficiency.","The recommended confirmation test (Endocrine Society, 2016). It can be falsely normal in the first weeks after sudden pituitary damage."],
["5. Insulin tolerance test or metyrapone test","Used when secondary or tertiary insufficiency is suspected and the short test is unclear","Insulin tolerance test: insulin-induced hypoglycaemia should raise cortisol (gold standard for the whole axis). Metyrapone test: blocking cortisol synthesis should raise adrenocorticotropic hormone and 11-deoxycortisol.","Insulin test is dangerous in heart disease, epilepsy or existing hypoglycaemia; done only in specialist units."],
["6. Find the cause","21-hydroxylase antibodies first","Positive → autoimmune adrenalitis; then screen for other autoimmune diseases.","In males with negative antibodies, measure very long chain fatty acids (adrenoleukodystrophy)."],
["7. Imaging","Adrenal computed tomography if antibodies are negative; pituitary magnetic resonance imaging in secondary insufficiency","Enlarged adrenals → infection, haemorrhage, metastases; calcified → old tuberculosis; small → autoimmune.","Imaging is less important when autoimmune Addison disease is proven."]],
cases:[
{id:"y1",title:"Case 1: The new mother who could not breastfeed",steps:[
{t:`<b>The scene:</b> A 31-year-old woman lost a lot of blood during delivery 4 months ago and needed transfusion. She could never breastfeed, her periods have not returned, and she is exhausted and cold. Sodium 129 mmol/L, potassium 4.1 mmol/L, glucose low-normal. Her skin is pale.`,q:"Most likely diagnosis?",o:["Sheehan syndrome with secondary adrenal insufficiency","Autoimmune Addison disease","Postpartum depression only"],a:0,e:"Severe bleeding at childbirth → pituitary necrosis (Sheehan syndrome). No milk = no prolactin; no periods = no gonadotropins; pale skin and normal potassium = secondary adrenal insufficiency."},
{t:`Her free thyroxine is also low, with a low-normal thyroid-stimulating hormone (central hypothyroidism).`,q:"Which hormone do you replace first?",o:["Thyroxine","Hydrocortisone","Oestrogen"],a:1,e:"Steroids before thyroxine: thyroxine speeds cortisol breakdown and raises demand, which can trigger a crisis in untreated adrenal insufficiency."}],
take:["Sheehan syndrome: childbirth bleeding → pituitary failure; no milk, no periods, tired, low sodium.","Secondary insufficiency: pale, normal potassium, no fludrocortisone needed.","Always replace hydrocortisone before thyroxine."]},
{id:"y2",title:"Case 2: The boy with Addison disease and falling grades",steps:[
{t:`<b>The scene:</b> A 12-year-old boy has darkening skin, fatigue and salt craving. Cortisol is low and adrenocorticotropic hormone very high: primary adrenal insufficiency. 21-hydroxylase antibodies are <b>negative</b>. His teachers report worse concentration and handwriting this year.`,q:"Which test is most important next?",o:["Very long chain fatty acids","Insulin tolerance test","Thyroid ultrasound"],a:0,e:"Antibody-negative primary insufficiency in a boy → think adrenoleukodystrophy (X-linked). Very long chain fatty acids are raised; brain magnetic resonance imaging and genetic counselling follow."},
{t:`The result is high. Read more: [[ald]].`,q:"Who else should be offered testing?",o:["Nobody","His mother and male relatives on the maternal side (X-linked inheritance)","Only his father"],a:1,e:"X-linked: the mother may be a carrier, and brothers or maternal male relatives may be affected even without symptoms yet."}],
take:["Primary insufficiency + negative antibodies + male → very long chain fatty acids.","Adrenoleukodystrophy is X-linked; adrenal failure can come before neurological signs.","Family testing and specialist neurology follow-up are essential."]},
{id:"y3",title:"Case 3: Shock on day 5 after hip surgery",steps:[
{t:`<b>The scene:</b> A 72-year-old woman is on heparin after a hip replacement. On day 5 she develops flank and abdominal pain, fever and low blood pressure that does not respond to fluids. Sodium 128 mmol/L, potassium 5.8 mmol/L, glucose 3.4 mmol/L.`,q:"Which diagnosis must you treat immediately?",o:["Bilateral adrenal haemorrhage with adrenal crisis","Simple dehydration","Hypothyroidism"],a:0,e:"Anticoagulation + stress of surgery + shock, low sodium, high potassium, low glucose = bilateral adrenal haemorrhage causing acute primary insufficiency."},
{t:`You take blood for cortisol and adrenocorticotropic hormone.${FIG("haem","Our patient's trigger is anticoagulation, not meningococcal infection, so she would not have this rash; the bleeding into the glands looks the same.")}`,q:"Next step?",o:["Wait for the cortisol result","Hydrocortisone 100 mg into a vein now, 1 litre 0.9 % saline in the first hour, glucose; then computed tomography of the adrenals when stable","Stop all fluids"],a:1,e:"Treat first, confirm later. Imaging shows the bleeding once she is stable; review the anticoagulation with the team."}],
take:["Sick, anticoagulated patient + flank pain + shock + high potassium → think adrenal haemorrhage.","Hydrocortisone and saline immediately; image later.","Survivors need lifelong replacement and steroid safety teaching."]}
],
flash:[["Definition of adrenal insufficiency","Not enough cortisol (with or without aldosterone) because the adrenal, pituitary or hypothalamus fails."],
["Most common cause overall","Stopping long-term glucocorticoids (glucocorticoid-induced suppression)."],
["Most common cause of primary insufficiency in high-income countries","Autoimmune adrenalitis (21-hydroxylase antibodies)."],
["Three findings specific for primary","Hyperpigmentation, salt craving, high potassium."],
["Why no fludrocortisone in secondary insufficiency?","Aldosterone is controlled by renin–angiotensin and potassium, which still work."],
["Male, primary insufficiency, negative antibodies","Measure very long chain fatty acids (adrenoleukodystrophy)."],
["Confirmation test","Short stimulation test: 250 µg tetracosactide, cortisol at 0, 30, 60 minutes."],
["Why can the pill hide adrenal insufficiency?","Oestrogen raises cortisol-binding globulin, so total cortisol looks higher."],
["When can the short stimulation test be falsely normal?","In the first weeks after sudden pituitary damage (the adrenal has not shrunk yet)."],
["Adrenal crisis: hydrocortisone dose","100 mg into a vein or muscle immediately, then 200 mg per 24 hours."],
["Adrenal crisis: fluids","1 litre 0.9 % saline within the first hour, then as needed; glucose if low."],
["Long-term hydrocortisone","15–25 mg per day in 2–3 doses, biggest on waking."],
["Fludrocortisone monitoring","Blood pressure (lying and standing), sodium, potassium, renin."],
["Drug that raises hydrocortisone needs","Enzyme inducers: rifampicin, phenytoin, carbamazepine, phenobarbital, St John's wort."],
["Sick-day rules","Above 38 °C double, above 39 °C triple, vomiting → 100 mg hydrocortisone into a muscle + hospital."],
["Surgery stress dose (major)","100 mg hydrocortisone at the start, then 200 mg per 24 hours until eating, then about double oral dose for a few days."]],
exam:[
"<b>Primary</b> = adrenal destroyed: cortisol + aldosterone low, adrenocorticotropic hormone high → <b>pigment, potassium, pinch of salt</b>. <b>Secondary/tertiary</b>: aldosterone intact, pale, normal potassium.",
"Most common cause overall: stopping long-term glucocorticoids. Most common primary cause in high-income countries: autoimmune adrenalitis.",
"Other causes: tuberculosis, adrenal haemorrhage (sepsis, anticoagulants), metastases, adrenoleukodystrophy, congenital adrenal hyperplasia, drugs (mitotane, ketoconazole, etomidate), pituitary tumours, Sheehan syndrome, hypophysitis (checkpoint inhibitors), opioids.",
"Diagnosis: morning cortisol + adrenocorticotropic hormone → renin/aldosterone → 250 µg short stimulation test → antibodies → very long chain fatty acids (males) → computed tomography.",
"Traps: oestrogen raises cortisol-binding globulin; short test can be falsely normal after recent pituitary damage; hydrocortisone and prednisolone interfere with cortisol tests.",
"<b>Crisis: treat before confirming.</b> Hydrocortisone 100 mg, then 200 mg per 24 hours; 1 litre 0.9 % saline in the first hour; glucose; treat the trigger.",
"Replacement: hydrocortisone 15–25 mg per day in 2–3 doses; fludrocortisone 50–200 µg in primary only; monitor clinically (renin for fludrocortisone).",
"Enzyme inducers → increase dose; avoid dexamethasone in pregnancy; hydrocortisone before thyroxine.",
"Sick-day rules: 38 °C double, 39 °C triple, vomiting = injection; card, kit, bracelet, trained family; stress dosing for surgery and labour."],

/* ===== Lecture 7 subsections 7, 8, 9 – new glossary terms (existing ones are reused) ===== */
Object.assign(GLOSSARY,{
halflife:{l:"half-life",c:"concept",d:"The time it takes for the amount of a substance in blood to fall by half. Plasma half-life = how fast it leaves the blood; biological half-life = how long its effect lasts.",w:"Explains how often a steroid must be given and why long-acting steroids suppress the axis more."},
aring:{l:"A-ring reduction",c:"concept",d:"The liver adds hydrogen to the double bond and the oxygen group in ring A of cortisol. The product (tetrahydrocortisol) no longer binds the receptor.",w:"The MAIN way the liver switches cortisol off – more important than hydroxylation."},
red5:{l:"5-alpha- and 5-beta-reductase",c:"enzyme",d:"Liver enzymes that reduce the double bond in ring A of steroids (the first step of A-ring reduction).",w:"5-alpha-reductase also turns testosterone into dihydrotestosterone in the skin and prostate."},
hsd3a:{l:"3-alpha-hydroxysteroid dehydrogenase",c:"enzyme",d:"Liver enzyme that finishes A-ring reduction by turning the oxygen group on carbon 3 into a hydroxyl group.",w:"Together with the reductases it makes the inactive tetrahydro metabolites."},
thf:{l:"tetrahydrocortisol",c:"hormone",d:"Inactive cortisol metabolite made by A-ring reduction (cortisone gives tetrahydrocortisone).",w:"Main cortisol breakdown products in urine; their ratio to cortisone metabolites shows 11-beta-hydroxysteroid dehydrogenase activity."},
glucur:{l:"conjugation with glucuronic acid",c:"concept",d:"The liver attaches a water-loving sugar acid (glucuronic acid, sometimes sulfate) to the inactive steroid.",w:"Makes fat-soluble steroids water-soluble so the kidney can excrete them in urine."},
cyp3a4:{l:"cytochrome P450 3A4",c:"enzyme",d:"Main drug-metabolising liver enzyme. For cortisol it performs 6-beta-hydroxylation (a minor route); for synthetic steroids such as dexamethasone, budesonide and fluticasone it is a major route.",w:"Inducers and inhibitors of this enzyme cause important steroid drug interactions."},
ufc:{l:"24-hour urinary free cortisol",c:"test",d:"All urine for 24 hours is collected and the unbound (free) cortisol in it is measured.",w:"Screening test for Cushing syndrome; integrates the whole day and is not affected by cortisol-binding globulin."},
lnsc:{l:"late-night salivary cortisol",c:"test",d:"Saliva collected at about 11 p.m. at home; saliva contains only free cortisol.",w:"Screening test for Cushing syndrome: the normal midnight low is lost early in the disease."},
cortisone:{l:"cortisone",c:"hormone",d:"Inactive form of cortisol (oxygen instead of a hydroxyl group on carbon 11). It does not bind the receptors.",w:"Can be turned back into cortisol by 11-beta-hydroxysteroid dehydrogenase type 1 – the cortisol–cortisone shuttle."},
mr:{l:"mineralocorticoid receptor",c:"cell",d:"Nuclear receptor in the kidney collecting duct, colon, heart and brain that makes cells keep sodium and lose potassium.",w:"Binds cortisol as strongly as aldosterone; only 11-beta-hydroxysteroid dehydrogenase type 2 keeps cortisol away from it."},
prednisone:{l:"prednisone",c:"drug",d:"Inactive prodrug (like cortisone) that the liver activates to prednisolone using 11-beta-hydroxysteroid dehydrogenase type 1.",w:"Common in some countries; equal to prednisolone milligram for milligram when the liver works normally."},
ritonavir:{l:"ritonavir and cobicistat",c:"drug",d:"'Booster' drugs used in human immunodeficiency virus treatment; they strongly block cytochrome P450 3A4.",w:"With inhaled fluticasone or budesonide, or steroid joint injections, they can cause Cushing syndrome and later adrenal insufficiency."},
fluticasone:{l:"fluticasone",c:"drug",d:"Potent inhaled or nasal steroid, normally almost completely broken down by cytochrome P450 3A4 in the liver.",w:"Classic culprit in drug-interaction Cushing syndrome."},
rifampicin:{l:"rifampicin",c:"drug",d:"Antibiotic for tuberculosis; a very strong inducer of liver enzymes.",w:"Speeds up steroid breakdown: patients on replacement usually need a higher hydrocortisone dose."},
placbar:{l:"placental steroid barrier",c:"concept",d:"11-beta-hydroxysteroid dehydrogenase type 2 in the placenta turns most maternal cortisol (and much prednisolone) into inactive forms before they reach the fetus.",w:"Prednisolone treats the mother; dexamethasone and betamethasone pass through and are used to mature the baby's lungs."},
thaldo:{l:"tetrahydroaldosterone",c:"hormone",d:"Inactive aldosterone metabolite made in the liver and excreted as a glucuronide; the kidney also makes aldosterone 18-glucuronide.",w:"Aldosterone is cleared very fast (half-life about 15–20 minutes), so its level follows renin and potassium closely."},
liddle:{l:"Liddle syndrome",c:"disease",d:"Inherited overactivity of the kidney's epithelial sodium channel: the kidney keeps salt without any hormone.",w:"Same 'low renin, low aldosterone, low potassium, high blood pressure' pattern as liquorice; treated with amiloride."},
spiro:{l:"spironolactone and eplerenone",c:"drug",d:"Mineralocorticoid receptor blockers.",w:"Treat hypertension and low potassium from aldosterone excess or from cortisol acting on the receptor."},
pvn:{l:"paraventricular nucleus",c:"cell",d:"Group of nerve cells in the hypothalamus that make corticotropin-releasing hormone (and vasopressin).",w:"The 'top' of the stress axis; it receives signals from the body clock, the limbic system and the immune system."},
portal:{l:"hypophyseal portal vessels",c:"cell",d:"Small veins that carry blood directly from the hypothalamus to the anterior pituitary.",w:"Releasing hormones arrive at high concentration without being diluted in the whole circulation."},
corticotroph:{l:"corticotroph cells",c:"cell",d:"Cells of the anterior pituitary that make proopiomelanocortin and cut it into adrenocorticotropic hormone.",w:"A tumour of these cells causes Cushing disease."},
negfb:{l:"negative feedback",c:"concept",d:"The end product (cortisol) inhibits the levels above it (hypothalamus and pituitary), keeping the level stable.",w:"The key to every endocrine puzzle: look at the hormone one level up to find where the problem is."},
circadian:{l:"circadian rhythm",c:"concept",d:"About-24-hour rhythm: cortisol rises in the second half of the night, peaks around waking and is lowest around midnight.",w:"Decides when to test (morning for too little, late night for too much) and when to give tablets."},
scn:{l:"suprachiasmatic nucleus",c:"cell",d:"The master body clock in the hypothalamus, reset every day by light falling on the eyes.",w:"Drives the daily rhythm of the hypothalamic–pituitary–adrenal axis."},
pulsatile:{l:"pulsatile secretion",c:"concept",d:"Adrenocorticotropic hormone is released in bursts, each followed by a pulse of cortisol.",w:"A single random cortisol value can be misleading."},
cytok:{l:"inflammatory cytokines",c:"hormone",d:"Signal proteins of the immune system such as interleukin-1, interleukin-6 and tumour necrosis factor.",w:"They switch on the stress axis in infection and injury; cortisol in turn damps their production."},
dst:{l:"dexamethasone suppression test",c:"test",d:"Dexamethasone is given and the patient's own cortisol is measured. Dexamethasone acts on the pituitary but is not measured in most cortisol assays.",w:"Healthy people suppress cortisol; people with Cushing syndrome do not."},
hddst:{l:"high-dose dexamethasone suppression test",c:"test",d:"8 mg dexamethasone (overnight or over 48 hours). Pituitary adenomas usually still partly suppress; ectopic and adrenal tumours do not.",w:"Classic exam logic; today largely replaced by corticotropin-releasing hormone testing, pituitary imaging and inferior petrosal sinus sampling."},
ipss:{l:"inferior petrosal sinus sampling",c:"test",d:"Catheters sample blood draining the pituitary and compare its adrenocorticotropic hormone with peripheral blood, usually after corticotropin-releasing hormone.",w:"Best test to prove that adrenocorticotropic hormone comes from the pituitary rather than an ectopic tumour."},
cushsyn:{l:"Cushing syndrome",c:"disease",d:"The clinical picture of too much glucocorticoid, from any cause.",w:"The most common cause overall is glucocorticoid medicine."},
cushdis:{l:"Cushing disease",c:"disease",d:"Cushing syndrome caused by an adrenocorticotropic hormone-secreting pituitary adenoma.",w:"The most common cause of endogenous Cushing syndrome; partial feedback is kept."},
ectopic:{l:"ectopic adrenocorticotropic hormone syndrome",c:"disease",d:"A tumour outside the pituitary (for example small cell lung cancer or a carcinoid tumour) makes adrenocorticotropic hormone.",w:"Very high cortisol, often with severe low potassium, muscle weakness and rapid onset; no feedback at all."},
adrad:{l:"cortisol-secreting adrenal adenoma",c:"disease",d:"A benign adrenal tumour that makes cortisol on its own.",w:"Adrenocorticotropic hormone is suppressed (low), and the other adrenal shrinks."},
pseudocush:{l:"pseudo-Cushing states",c:"disease",d:"Conditions that activate the axis without a tumour: severe depression, alcohol excess, severe obesity, poorly controlled diabetes, severe illness.",w:"Common cause of mildly abnormal screening tests."},
gr:{l:"glucocorticoid receptor",c:"cell",d:"Receptor inside the cytoplasm of almost every cell; after binding cortisol it moves into the nucleus and changes gene activity.",w:"Target of all anti-inflammatory steroid drugs."},
hsp:{l:"heat-shock proteins",c:"cell",d:"Helper proteins that hold the unbound glucocorticoid receptor in the cytoplasm and are released when the hormone binds.",w:"Their release lets the receptor move into the nucleus."},
gre:{l:"glucocorticoid response elements",c:"cell",d:"Short DNA sequences that the activated glucocorticoid receptor binds to switch genes on (or off).",w:"Explain the delay of hours: new messenger RNA and proteins must be made."},
nfkb:{l:"nuclear factor kappa B",c:"cell",d:"Transcription factor that switches on many inflammatory genes (cytokines, adhesion molecules, cyclo-oxygenase 2).",w:"Glucocorticoids block it – the main anti-inflammatory mechanism."},
ap1:{l:"activator protein 1",c:"cell",d:"A second inflammatory transcription factor blocked by the glucocorticoid receptor.",w:"Part of the transrepression mechanism."},
transact:{l:"transactivation",c:"concept",d:"The receptor switches genes ON (anti-inflammatory proteins, and metabolic enzymes such as those of gluconeogenesis).",w:"Responsible for many metabolic side effects (high glucose)."},
transrep:{l:"transrepression",c:"concept",d:"The receptor switches inflammatory genes OFF by blocking nuclear factor kappa B and activator protein 1.",w:"Responsible for most of the wanted anti-inflammatory effect."},
annexin:{l:"annexin A1",c:"cell",d:"Anti-inflammatory protein (formerly called lipocortin) made more under glucocorticoids; it reduces production of inflammatory lipid mediators.",w:"Classic example of a gene switched on by glucocorticoids."},
gneo:{l:"gluconeogenesis",c:"concept",d:"Making new glucose in the liver from amino acids, lactate and glycerol.",w:"Cortisol drives it: helpful in fasting and stress, harmful as steroid-induced diabetes."},
permis:{l:"permissive effect",c:"concept",d:"Cortisol does not raise blood pressure much on its own, but it lets blood vessels respond fully to adrenaline and noradrenaline.",w:"Without cortisol, shock does not respond well to fluids and vasopressors."},
iatro:{l:"glucocorticoid-induced (exogenous) Cushing syndrome",c:"disease",d:"Cushing syndrome caused by steroid medicines (tablets, injections, inhalers, creams).",w:"The most common cause of Cushing syndrome; the patient's own adrenocorticotropic hormone and cortisol are low."},
avn:{l:"avascular necrosis of bone",c:"disease",d:"Bone dies because its blood supply fails; classically the head of the femur.",w:"New hip or groin pain in a patient on steroids needs imaging."},
myop:{l:"steroid myopathy",c:"disease",d:"Weakness of the proximal muscles (thighs, shoulders) from muscle protein breakdown.",w:"Patient struggles to stand up from a chair or climb stairs."},
gio:{l:"glucocorticoid-induced osteoporosis",c:"disease",d:"Bone loss because glucocorticoids slow bone-building cells and reduce calcium absorption.",w:"The most common secondary cause of osteoporosis; fracture risk rises within months."},
bisphos:{l:"bisphosphonates",c:"drug",d:"Drugs such as alendronic acid that slow bone breakdown.",w:"Bone protection for many patients on long-term steroids."},

/* ===== Lecture 7 subsection 7: Metabolism and inactivation – header + steps 1–3 ===== */
const M7={
meta:"Endocrinology › Lecture 7 › Subsection 7 · lecture pages 24–25 · ⏱ about 25 minutes in 6 bite-sized steps",
intro:`<p>Cortisol is made on demand and cannot be stored, so its level depends just as much on how fast it is <b>switched off</b> as on how fast it is made. In this module you follow cortisol (and its siblings aldosterone and the adrenal androgens) to the liver, into tissues that switch it on and off, and finally into the urine, where we can measure it.</p>`,
goals:[
"Explain how long cortisol lasts in blood and why the liver is the main place where it is switched off",
"Describe the two liver steps (A-ring reduction and conjugation) and what ends up in the urine",
"Explain how 11-beta-hydroxysteroid dehydrogenase types 1 and 2 switch cortisol on and off inside tissues",
"Explain how liquorice (and very high cortisol) causes apparent mineralocorticoid excess",
"Use 24-hour urinary free cortisol correctly and know its pitfalls",
"Predict how drugs, thyroid status and liver or kidney disease change steroid breakdown"],
cards:[

{id:"e1",title:"Where does cortisol go? Half-life and the liver",min:3,goal:0,obj:["Give the approximate plasma half-life of cortisol","Explain why bound cortisol is protected from breakdown","Tell plasma half-life from biological half-life"],html:`
<div class="scene"><b>The scene:</b> In theatre a surgeon asks you: "We gave 100 mg hydrocortisone at induction. Why does the anaesthetist want to give more in a few hours, or run it as an infusion?"</div>
<p>Cortisol has a short plasma [[halflife]]: roughly <b>1 to 1.5 hours</b>. Every hour a large part of it is cleared, mainly by the <b>liver</b>; the kidney then excretes the products.</p>
<ol><li>About 9 in 10 cortisol molecules ride on [[cbg]] or albumin (Module 6). <b>Bound cortisol is protected</b>: enzymes in the liver only reach the free fraction.</li>
<li>Free cortisol enters liver cells, is made inactive and water-soluble (step 2), and leaves via the kidney.</li>
<li>A very small part reaches the urine <b>unchanged</b>, as [[ufc]] (step 5).</li></ol>
<p><b>Plasma versus biological half-life.</b> Cortisol leaves the blood within hours, but the genes it switched on stay active longer. Hydrocortisone therefore acts for about <b>8–12 hours</b> (its biological half-life). That is why replacement is given 2–3 times a day, and why stress doses are repeated every 6 hours or given as a continuous infusion.</p>
<div class="hint">💡 <b>"The blood forgets fast, the genes remember longer."</b> Plasma half-life tells you when the hormone has left the blood; biological half-life tells you when the effect ends.</div>
<details class="chk"><summary>✋ Checkpoint: why does a woman on the oestrogen pill have a higher TOTAL cortisol but normal cortisol effects?</summary><p>Oestrogen makes the liver produce more cortisol-binding globulin. More cortisol is bound (and protected), so total cortisol rises, but the free, active part stays normal.</p></details>`,
recap:["Cortisol plasma half-life ≈ 1–1.5 hours; the liver is the main site of inactivation.","Only free cortisol is broken down; bound cortisol is protected.","Biological effect (about 8–12 hours for hydrocortisone) outlasts the blood level."],
quiz:[{q:"Which fraction of cortisol can liver enzymes break down?",o:["Only cortisol bound to cortisol-binding globulin","Only free cortisol","Both equally"],a:1,e:"Bound cortisol is protected; only the free fraction enters liver cells and is inactivated."},
{q:"Why is hydrocortisone replacement split into 2–3 doses per day?",o:["Because its effect lasts only about 8–12 hours","Because it is not absorbed in the evening","Because the liver stores it"],a:0,e:"Short plasma half-life and a biological effect of about 8–12 hours mean a single dose cannot cover 24 hours."}]},

{id:"e2",title:"The liver's clean-up: reduce first, then attach a sugar acid",min:4,goal:1,obj:["Name the two liver steps that inactivate cortisol","Name the minor hydroxylation route and why it matters for drugs","Describe what happens to adrenal androgens and aldosterone"],html:`
<div class="scene"><b>The scene:</b> A chemistry student asks you: "Cortisol is fat-soluble. How can the body get rid of it in watery urine?"</div>
<p>The liver works in <b>two steps</b>:</p>
<ol><li><b>Switch it off:</b> [[aring]]. The enzymes [[red5]] and [[hsd3a]] add hydrogen to ring A. The result, [[thf]] (and tetrahydrocortisone from cortisone), cannot bind the receptor any more.</li>
<li><b>Make it water-soluble:</b> [[glucur]]. A sugar acid is attached; the kidney filters the conjugate into the urine.</li></ol>
<p><b>Minor route:</b> [[cyp3a4]] adds a hydroxyl group at carbon 6 (6-beta-hydroxycortisol). Small for natural cortisol, but this enzyme is the main route for many <b>synthetic</b> steroids, which is why drug interactions matter (step 6).</p>
<p>👉 Click through the route:</p>
<div data-widget="liver"></div>
<h3>The other adrenal steroids</h3>
<table><tr><th>Steroid</th><th>What happens</th></tr>
<tr><td>[[dhea|Dehydroepiandrosterone]]</td><td>Sulfated to dehydroepiandrosterone sulfate in the adrenal itself, the liver and the kidney (a long-lived storage form in blood).</td></tr>
<tr><td>[[andro|Androstenedione]]</td><td>In peripheral tissues: → testosterone (17-beta-hydroxysteroid dehydrogenase) → dihydrotestosterone (5-alpha-reductase); or → oestrone ([[aromatase]], for example in fat tissue).</td></tr>
<tr><td>[[aldo|Aldosterone]]</td><td>Liver: → [[thaldo]] (conjugated). Kidney: → aldosterone 18-glucuronide. Half-life only about <b>15–20 minutes</b> (slide 24).</td></tr></table>
<div class="corr">📝 <b>Slide check (page 24):</b><br>• "Cortisol: inactivation by hydroxilation" (spelling: <i>hydroxylation</i>) is a simplification. The <b>main</b> inactivation step in the liver is <b>A-ring reduction</b> (5-alpha-/5-beta-reductase plus 3-alpha-hydroxysteroid dehydrogenase), followed by conjugation with glucuronic acid or sulfate. Hydroxylation (6-beta, by cytochrome P450 3A4) is a minor route for cortisol, although it matters for drug interactions.<br>• "Androstenedione → testosterone / DHT": dihydrotestosterone is made from <b>testosterone</b> by 5-alpha-reductase, not directly from androstenedione in the classic pathway. So the order is androstenedione → testosterone → dihydrotestosterone.</div>
<div class="hint">💡 <b>"Laundry rule": soften, then tag.</b> The liver first <b>reduces</b> ring A (cortisol is switched off), then sews on a water-soluble <b>glucuronic acid tag</b> so the kidney can wash it out.</div>
<details class="chk"><summary>✋ Checkpoint: which of the two liver steps actually makes cortisol inactive?</summary><p>Step 1, A-ring reduction. Conjugation (step 2) only makes the already inactive metabolite water-soluble.</p></details>`,
recap:["Main inactivation: A-ring reduction → tetrahydrocortisol (inactive).","Then conjugation with glucuronic acid or sulfate → water-soluble → urine.","6-beta-hydroxylation by cytochrome P450 3A4 is minor for cortisol but major for many synthetic steroids.","Aldosterone half-life ≈ 15–20 minutes; dehydroepiandrosterone is stored as its sulfate."],
quiz:[{q:"What is the MAIN inactivating step for cortisol in the liver?",o:["6-beta-hydroxylation","A-ring reduction","Sulfation in the adrenal"],a:1,e:"Reduction of ring A by 5-alpha-/5-beta-reductase and 3-alpha-hydroxysteroid dehydrogenase makes tetrahydro metabolites that no longer bind the receptor."},
{q:"Dihydrotestosterone is made directly from…",o:["Androstenedione","Testosterone","Dehydroepiandrosterone sulfate"],a:1,e:"5-alpha-reductase converts testosterone to dihydrotestosterone (for example in the skin and prostate)."}]},

{id:"e3",title:"The on/off switch: 11-beta-hydroxysteroid dehydrogenase types 1 and 2",min:5,goal:2,obj:["State where each type works and in which direction","Explain how type 2 protects the mineralocorticoid receptor","Apply the shuttle to prednisone and to pregnancy"],html:`
<div class="scene"><b>The scene:</b> The kidney's [[mr]] binds cortisol just as strongly as aldosterone, and blood contains roughly 100 to 1000 times more cortisol than aldosterone. So why doesn't everybody retain salt as if they had an aldosterone tumour?</div>
<p>Because tissues can switch cortisol off and on locally with two enzymes. Together they form the <b>cortisol–cortisone shuttle</b>:</p>
<table><tr><th></th><th>[[hsd11b2|Type 2]]: switches OFF</th><th>[[hsd11b1|Type 1]]: switches ON</th></tr>
<tr><td>Reaction</td><td>Cortisol → [[cortisone]] (inactive)</td><td>Cortisone → cortisol (active)</td></tr>
<tr><td>Where</td><td>Kidney (collecting duct), colon, salivary and sweat glands, <b>placenta</b></td><td>Liver, fat tissue, brain, skin, bone</td></tr>
<tr><td>Why</td><td>Guards the mineralocorticoid receptor so that only aldosterone controls salt; protects the fetus</td><td>Raises cortisol locally; activates tablets such as cortisone and [[prednisone]]</td></tr></table>
<p>👉 Try each situation in the diagram:</p>
<div data-widget="shuttle"></div>
<p><b>Pregnancy:</b> the [[placbar]] (type 2) inactivates most maternal cortisol and much of the prednisolone. So prednisolone is a good choice to treat the <b>mother</b> (for example asthma), while [[dexa]] and [[betameth]] are poor substrates, pass through, and are used to mature the <b>baby's</b> lungs before a preterm birth.</p>
<div class="corr">📝 <b>Slide check (page 25, Guyton and Hall figure):</b> the placenta appears on both sides of the diagram. Placental tissue can express both enzymes, but its key job as a <b>barrier</b> between mother and fetus is done by <b>type 2</b> (inactivation). For exams: "placenta = type 2 barrier".</div>
<div class="hint">💡 <b>"Type ONE turns it ON; type TWO says NO."</b> Type 2 says no to cortisol at the kidney's salt receptor and at the placenta.</div>
<details class="chk"><summary>✋ Checkpoint: a patient with severe liver failure is given prednisone tablets. Why may they work poorly?</summary><p>Prednisone is inactive and needs liver 11-beta-hydroxysteroid dehydrogenase type 1 to become prednisolone. Give prednisolone directly instead.</p></details>`,
recap:["Type 2 (kidney, colon, salivary and sweat glands, placenta): cortisol → inactive cortisone.","Type 1 (liver, fat, brain, skin, bone): cortisone → active cortisol; also prednisone → prednisolone.","Type 2 keeps cortisol off the mineralocorticoid receptor and forms the placental barrier."],
quiz:[{q:"Which enzyme activates prednisone to prednisolone?",o:["11-beta-hydroxysteroid dehydrogenase type 1 in the liver","11-beta-hydroxysteroid dehydrogenase type 2 in the kidney","11-beta-hydroxylase in the adrenal"],a:0,e:"Prednisone, like cortisone, is a prodrug reactivated by type 1 (mainly in the liver)."},
{q:"Which steroid is given to the mother to mature the lungs of a baby expected to be born preterm?",o:["Prednisolone","Hydrocortisone","Dexamethasone or betamethasone"],a:2,e:"These are poor substrates for placental type 2, so they reach the fetus. Prednisolone and cortisol are largely inactivated by the placenta."}]}
]};

{id:"e4",title:"Liquorice: when the guard falls asleep",min:4,goal:3,obj:["Explain apparent mineralocorticoid excess step by step","Predict renin, aldosterone and potassium","List other causes of the same 'low–low' pattern"],html:`
<div class="scene"><b>The scene:</b> A 47-year-old woman has new high blood pressure, muscle cramps and a potassium of 2.9 mmol/L. Renin and aldosterone are both <b>low</b>. On direct questioning she drinks several cups of liquorice tea a day "for her stomach".</div>
<p><b>Step by step:</b></p>
<ol><li>Glycyrrhetinic acid from [[liquorice]] blocks [[hsd11b2]] in the kidney.</li>
<li>Cortisol is no longer switched off and occupies the [[mr]].</li>
<li>The kidney keeps sodium and water and loses potassium (and acid) → high blood pressure, low potassium.</li>
<li>Volume expansion switches off [[renin]] → aldosterone falls. This is [[ame]]: the effect of aldosterone without aldosterone.</li></ol>
<table><tr><th>Pattern (high blood pressure + low potassium)</th><th>Renin</th><th>Aldosterone</th></tr>
<tr><td>Primary hyperaldosteronism (Conn syndrome)</td><td>Low</td><td><b>High</b></td></tr>
<tr><td>Renal artery stenosis, diuretics</td><td>High</td><td>High</td></tr>
<tr><td>Liquorice, inherited type 2 deficiency, cortisol flood in [[ectopic]], [[liddle]]</td><td>Low</td><td><b>Low</b></td></tr></table>
<p><b>Why the cortisol flood?</b> In ectopic adrenocorticotropic hormone syndrome cortisol rises so high that type 2 is saturated; the excess spills onto the mineralocorticoid receptor. That is why very low potassium is typical of the ectopic form of Cushing syndrome.</p>
<p><b>Treatment:</b> stop liquorice (blood pressure and potassium recover over weeks), replace potassium, and use [[spiro]] if needed. Liquorice is in sweets, teas, herbal remedies and some chewing tobacco.</p>
<div class="hint">💡 <b>"Low–low with low potassium? Someone else is sitting in aldosterone's chair."</b> Ask about liquorice first: it is cheap to stop and easy to miss.</div>
<details class="chk"><summary>✋ Checkpoint: would spironolactone help a liquorice patient?</summary><p>Yes. The problem is cortisol acting on the mineralocorticoid receptor, and spironolactone blocks that receptor whatever the hormone sitting on it.</p></details>
<p>Revisit the liquorice lover in <a onclick="showModule('m5');setTimeout(()=>go('k2'),300)" style="cursor:pointer;color:var(--acc);font-weight:700">Module 5, case 2</a>.</p>`,
recap:["Liquorice blocks 11-beta-hydroxysteroid dehydrogenase type 2 → cortisol acts on the mineralocorticoid receptor.","Result: high blood pressure, low potassium, LOW renin and LOW aldosterone.","Same pattern: inherited type 2 deficiency, cortisol flood (ectopic adrenocorticotropic hormone), Liddle syndrome."],
quiz:[{q:"High blood pressure, potassium 2.9 mmol/L, renin low, aldosterone low. Which cause fits?",o:["Primary hyperaldosteronism","Renal artery stenosis","Daily liquorice"],a:2,e:"Low renin AND low aldosterone with mineralocorticoid effects means something other than aldosterone is acting: liquorice (cortisol on the receptor)."},
{q:"Why is low potassium especially common in ectopic adrenocorticotropic hormone syndrome?",o:["Cortisol saturates 11-beta-hydroxysteroid dehydrogenase type 2 and acts on the mineralocorticoid receptor","Adrenocorticotropic hormone blocks the kidney's potassium channels","The tumour secretes renin"],a:0,e:"Very high cortisol overwhelms the type 2 'guard', so cortisol has an aldosterone-like effect."}]},

{id:"e5",title:"Measuring the output: 24-hour urinary free cortisol",min:4,goal:4,obj:["Explain what urinary free cortisol reflects","Collect it correctly","Recognise false highs and false lows"],html:`
<div class="scene"><b>The scene:</b> A general practitioner refers a woman with weight gain, new diabetes and bruising. A single afternoon blood cortisol was "normal". Is that reassuring?</div>
<p>No. Cortisol is pulsatile and has a strong daily rhythm (Module 8), so one random value says little. To screen for [[cushsyn]] we use tests that look at the <b>whole day</b> or at the <b>midnight low</b>: [[ufc]], [[lnsc]] and the 1 mg overnight [[dst]].</p>
<p><b>Why urine works:</b> only <b>free</b> cortisol is filtered by the kidney. When cortisol rises, cortisol-binding globulin becomes saturated, the free part rises steeply, and so does urinary free cortisol. It is <b>not affected by cortisol-binding globulin</b> (for example the pill).</p>
<p><b>How to collect:</b> discard the first urine on waking on day 1, then collect <b>every</b> drop for 24 hours, including the first urine on waking on day 2. Usually <b>two</b> collections are done; urine creatinine checks completeness.</p>
<p><b>Pitfalls:</b> more than about <b>5 litres of urine a day</b> falsely raises the result, so keep a normal fluid intake; reduced kidney function (creatinine clearance below about 60 mL/min) can make it <b>falsely low</b>.</p>
<p>👉 Sort these: does each one make urinary free cortisol falsely high, falsely low, or neither?</p>
<div data-widget="sort3"></div>
<div class="hint">💡 <b>"Urine tells the 24-hour story; blood tells one moment."</b> Always ask: was the collection complete, and does the patient drink litres of water?</div>
<details class="chk"><summary>✋ Checkpoint: why can urinary free cortisol be falsely LOW in severe kidney disease?</summary><p>Less cortisol is filtered into the urine, so a truly high production can look normal.</p></details>`,
recap:["Random cortisol is useless for Cushing screening; use urinary free cortisol, late-night salivary cortisol or the 1 mg dexamethasone test.","Urinary free cortisol = filtered free cortisol over 24 hours, unaffected by cortisol-binding globulin.","Pitfalls: incomplete collection, very high fluid intake, kidney failure, pseudo-Cushing states, some interfering drugs."],
quiz:[{q:"A woman on the combined pill has a high total blood cortisol. Which test is NOT distorted by her raised cortisol-binding globulin?",o:["Morning total serum cortisol","24-hour urinary free cortisol","Both are distorted equally"],a:1,e:"Urine contains only filtered free cortisol, so changes in cortisol-binding globulin do not affect it."},
{q:"Which finding suggests an INCOMPLETE 24-hour urine collection?",o:["Unusually low urine creatinine","High urine volume","Normal urine sodium"],a:0,e:"Creatinine excretion per day is fairly constant for a person; a low value means urine was missed."}]},

{id:"e6",title:"Speed-up and slow-down: drugs, thyroid, liver and kidney",min:4,goal:5,obj:["Predict the effect of enzyme inducers and inhibitors on steroid dosing","Explain 'steroids before thyroxine'","Describe how liver and kidney disease change steroid handling"],html:`
<div class="scene"><b>The scene:</b> A man with Addison disease starts treatment for tuberculosis. Two weeks later he is exhausted and dizzy, although he never missed a hydrocortisone tablet.</div>
<table><tr><th>Situation</th><th>Effect on steroid breakdown</th><th>What to do</th></tr>
<tr><td>[[inducer|Enzyme inducers]]: [[rifampicin]], phenytoin, carbamazepine, phenobarbital, St John's wort</td><td><b>Faster</b> (more [[cyp3a4]]); dexamethasone and prednisolone strongly affected, hydrocortisone too</td><td>Higher dose (often double hydrocortisone); reduce again when the drug stops</td></tr>
<tr><td>[[inhib|Enzyme inhibitors]]: [[ritonavir]], itraconazole, ketoconazole, clarithromycin</td><td><b>Slower</b>; even inhaled [[fluticasone]] or [[budes]] and joint injections build up</td><td>Choose a steroid less dependent on this enzyme (for example beclometasone inhaler), or change the interacting drug</td></tr>
<tr><td>Overactive thyroid</td><td>Faster cortisol clearance</td><td>Higher replacement needs until the thyroid is controlled</td></tr>
<tr><td>Underactive thyroid</td><td>Slower clearance</td><td><b>Steroids before thyroxine</b>: thyroxine speeds clearance and can trigger a crisis in untreated adrenal insufficiency</td></tr>
<tr><td>Liver cirrhosis</td><td>Slower clearance; less cortisol-binding globulin and albumin; slower aldosterone clearance</td><td>Interpret total cortisol with care; prefer prednisolone over prednisone</td></tr>
<tr><td>Kidney failure</td><td>Metabolites build up; urinary free cortisol falsely low</td><td>Use blood or saliva tests instead</td></tr></table>
<div class="hint">💡 <b>"INducers INcrease the dose you need; INhibitors INflate the steroid effect."</b></div>
<details class="chk"><summary>✋ Checkpoint: a patient on ritonavir uses a fluticasone nasal spray and develops a round face. What happens if you simply stop the spray?</summary><p>The axis is suppressed, so stopping suddenly can cause adrenal insufficiency. Switch carefully, and cover with hydrocortisone and test the axis if needed.</p></details>`,
recap:["Inducers (rifampicin, antiepileptics) speed up steroid breakdown → higher doses.","Inhibitors (ritonavir, cobicistat, azole antifungals) → Cushing syndrome even from inhaled or injected steroids.","Thyroxine speeds cortisol clearance: replace cortisol first. Kidney failure makes urinary free cortisol falsely low."],
quiz:[{q:"A patient with Addison disease starts rifampicin. What usually happens to the hydrocortisone dose?",o:["It is increased (often doubled)","It is halved","No change"],a:0,e:"Rifampicin induces cytochrome P450 3A4 and speeds up cortisol breakdown, so replacement must be increased while it is taken."},
{q:"Why should glucocorticoid replacement start before thyroxine when both are missing?",o:["Thyroxine speeds cortisol clearance and can precipitate adrenal crisis","Thyroxine blocks the glucocorticoid receptor","Hydrocortisone lowers thyroxine absorption"],a:0,e:"Thyroid hormone raises metabolism and cortisol clearance; without cortisol replacement this can tip the patient into crisis."}]}
);

["Minor cortisol route important for drug interactions","6-beta-hydroxylation by cytochrome P450 3A4."],
["Aldosterone half-life","About 15–20 minutes."],
["11-beta-hydroxysteroid dehydrogenase type 1","Cortisone → cortisol; liver, fat, brain, skin, bone; activates prednisone."],
["11-beta-hydroxysteroid dehydrogenase type 2","Cortisol → cortisone; kidney, colon, salivary and sweat glands, placenta; guards the mineralocorticoid receptor."],
["Liquorice: renin and aldosterone?","Both LOW, with high blood pressure and low potassium (apparent mineralocorticoid excess)."],
["Why is potassium very low in ectopic adrenocorticotropic hormone syndrome?","Cortisol flood saturates 11-beta-hydroxysteroid dehydrogenase type 2 and acts on the mineralocorticoid receptor."],
["Which steroids cross the placenta well?","Dexamethasone and betamethasone (poor substrates for placental type 2)."],
["What does 24-hour urinary free cortisol measure?","Free (unbound) cortisol filtered into urine over a whole day."],
["Urinary free cortisol falsely low","Incomplete collection, severe kidney disease."],
["Effect of rifampicin on hydrocortisone dose","Increase (often double) while on rifampicin."],
["Inhaled fluticasone + ritonavir","Cushing syndrome, then adrenal insufficiency if stopped suddenly."]],
exam:[
"Cortisol plasma half-life ≈ 1–1.5 hours; only <b>free</b> cortisol is inactivated, mainly in the <b>liver</b>.",
"Liver: <b>A-ring reduction</b> (main inactivation) → <b>conjugation</b> with glucuronic acid or sulfate → urine. 6-beta-hydroxylation by cytochrome P450 3A4 is minor for cortisol.",
"Aldosterone half-life ≈ 15–20 min (tetrahydroaldosterone, aldosterone 18-glucuronide). Dehydroepiandrosterone → sulfate; androstenedione → testosterone → dihydrotestosterone.",

/* ===== Lecture 7 subsection 8: hypothalamic–pituitary–adrenal axis – header + steps 1–3 ===== */
const M8={
meta:"Endocrinology › Lecture 7 › Subsection 8 · lecture page 26 · ⏱ about 25 minutes in 5 bite-sized steps",
intro:`<p>Cortisol is not stored, so its level is controlled minute by minute from the brain. This module follows the command chain from hypothalamus to adrenal, the thermostat that keeps it stable (negative feedback), the daily clock, the stress override, and the test that uses all of this logic: the dexamethasone suppression test.</p>`,
goals:[
"Name each level of the axis, its hormone and its target",
"Explain negative feedback and predict the hormone pattern when the axis breaks at different levels",
"Describe the daily rhythm and the pulses, and time tests and tablets accordingly",
"Explain how stress and inflammation override the rhythm",
"Use the logic of the dexamethasone suppression tests to find the cause of high cortisol"],
cards:[

{id:"f1",title:"The chain of command: hypothalamus → pituitary → adrenal",min:4,goal:0,obj:["Name the three levels and their hormones","Explain why the zona glomerulosa is mostly outside this chain","Name the other products of proopiomelanocortin"],html:`
<div class="scene"><b>The scene:</b> 3 a.m., a frightening dream, your heart races. Two relays start: a <b>fast</b> one (nerves → adrenal medulla → adrenaline, seconds) and a <b>slower</b> hormonal one that raises cortisol within minutes. This module is about the slower one.</div>
<figure><svg viewBox="0 0 640 300" style="width:100%" role="img" aria-label="Command chain of the hypothalamic–pituitary–adrenal axis">
<defs><marker id="f1a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#444"/></marker></defs>
<g font-size="14" font-weight="700" text-anchor="middle" fill="#222">
<rect x="20" y="110" width="140" height="64" rx="12" fill="#f3ecff" stroke="#7b3fc4" stroke-width="2.5"/><text x="90" y="138">Hypothalamus</text><text x="90" y="158" font-weight="400" font-size="12">paraventricular nucleus</text>
<rect x="250" y="110" width="140" height="64" rx="12" fill="#e3f1ff" stroke="#2f6fdb" stroke-width="2.5"/><text x="320" y="138">Anterior pituitary</text><text x="320" y="158" font-weight="400" font-size="12">corticotroph cells</text>
<rect x="480" y="110" width="140" height="64" rx="12" fill="#fff3d6" stroke="#d9730d" stroke-width="2.5"/><text x="550" y="138">Adrenal cortex</text><text x="550" y="158" font-weight="400" font-size="12">fasciculata, reticularis</text></g>
<line x1="160" y1="142" x2="248" y2="142" stroke="#444" stroke-width="3" marker-end="url(#f1a)"/><line x1="390" y1="142" x2="478" y2="142" stroke="#444" stroke-width="3" marker-end="url(#f1a)"/>
<g font-size="12" fill="#0f8b8d" font-weight="700" text-anchor="middle"><text x="205" y="98">corticotropin-</text><text x="205" y="112">releasing hormone</text><text x="205" y="196" fill="#555" font-weight="400">(+ vasopressin)</text><text x="205" y="212" fill="#555" font-weight="400">via portal vessels</text>
<text x="435" y="98">adrenocorticotropic</text><text x="435" y="112">hormone</text><text x="435" y="196" fill="#555" font-weight="400">via the blood</text></g>
<line x1="550" y1="174" x2="550" y2="232" stroke="#444" stroke-width="3" marker-end="url(#f1a)"/><text x="550" y="254" text-anchor="middle" font-size="14" font-weight="700" fill="#0f8b8d">cortisol (+ adrenal androgens)</text>
<g font-size="12" fill="#555"><text x="20" y="40">Inputs to the hypothalamus:</text><text x="20" y="58">body clock · stress · inflammation · low glucose</text></g>
<line x1="90" y1="66" x2="90" y2="108" stroke="#7b3fc4" stroke-width="2" marker-end="url(#f1a)"/></svg>
<figcaption>The command chain, drawn by MedLearn (schematic). Feedback is added in step 2.</figcaption></figure>
<ol><li>The [[pvn]] of the hypothalamus releases [[crh]], helped by vasopressin ([[adh]]).</li>
<li>It travels in the [[portal]] to the anterior pituitary. There [[corticotroph]] cells cut [[pomc]] into [[acth]] (plus melanocyte-stimulating hormone and beta-endorphin).</li>
<li>Adrenocorticotropic hormone binds the [[mc2r]] on zona fasciculata and reticularis cells → cortisol within minutes (Module 5) and gland growth over days.</li></ol>
<p><b>Not the glomerulosa:</b> aldosterone is run mainly by [[angii]] and potassium. That is why aldosterone survives pituitary failure.</p>
<div class="hint">💡 <b>"Call – Command – Carry out":</b> corticotropin-releasing hormone <b>calls</b>, adrenocorticotropic hormone <b>commands</b>, cortisol <b>carries out</b> the job.</div>
<details class="chk"><summary>✋ Checkpoint: why do patients with primary adrenal insufficiency get dark skin?</summary><p>Without cortisol feedback the pituitary makes lots of proopiomelanocortin, which is also cut into melanocyte-stimulating hormone; adrenocorticotropic hormone itself also stimulates melanocytes.</p></details>`,
recap:["Hypothalamus (corticotropin-releasing hormone + vasopressin) → anterior pituitary (adrenocorticotropic hormone) → adrenal cortex (cortisol).","Proopiomelanocortin gives adrenocorticotropic hormone, melanocyte-stimulating hormone and beta-endorphin.","The glomerulosa (aldosterone) follows angiotensin II and potassium, not this chain."],
quiz:[{q:"Which pituitary cells make adrenocorticotropic hormone?",o:["Somatotroph cells","Corticotroph cells","Lactotroph cells"],a:1,e:"Corticotroph cells of the anterior pituitary cut proopiomelanocortin into adrenocorticotropic hormone."},
{q:"Which hormone helps corticotropin-releasing hormone stimulate the pituitary, especially in stress?",o:["Vasopressin","Oxytocin","Prolactin"],a:0,e:"Vasopressin (antidiuretic hormone) from the paraventricular nucleus strongly boosts the action of corticotropin-releasing hormone."}]},

{id:"f2",title:"Negative feedback: the thermostat",min:5,goal:1,obj:["Explain how cortisol inhibits the levels above it","Predict cortisol and adrenocorticotropic hormone at each broken level","Use the 'look one level up' rule"],html:`
<div class="scene"><b>The scene:</b> The heating in your flat switches off when the room is warm. Cortisol does the same: when there is enough, it switches off the hypothalamus and the pituitary.</div>
<p>Cortisol inhibits the release of [[crh]] and [[acth]] (and the gene for [[pomc]]). This [[negfb]] works <b>fast</b> (minutes, responding to a rising cortisol) and <b>slowly</b> (hours to days, changing gene activity). It keeps cortisol stable and explains every pattern of axis disease.</p>
<p>👉 Click each situation and watch the hormone levels:</p>
<div data-widget="axisloop"></div>
<table><tr><th>Situation</th><th>Cortisol</th><th>Adrenocorticotropic hormone</th></tr>
<tr><td>Adrenal destroyed ([[pai|primary insufficiency]])</td><td>Low</td><td><b>High</b></td></tr>
<tr><td>Pituitary failure ([[sai|secondary insufficiency]])</td><td>Low</td><td>Low</td></tr>
<tr><td>[[cushdis]] (pituitary adenoma)</td><td>High</td><td>High-normal or high</td></tr>
<tr><td>[[adrad]]</td><td>High</td><td><b>Low</b> (suppressed)</td></tr>
<tr><td>[[ectopic]]</td><td>Very high</td><td>Very high</td></tr>
<tr><td>Steroid medicines ([[iatro]])</td><td>Own cortisol low (drug effect high)</td><td>Low</td></tr></table>
<div class="hint">💡 <b>"Look one level up."</b> If the hormone above is shouting (high), the problem is below it. If the hormone above is silent (low), it is either the cause, or it has been told to be quiet by too much cortisol.</div>
<details class="chk"><summary>✋ Checkpoint: high cortisol + low adrenocorticotropic hormone. Where is the problem?</summary><p>In the adrenal (an adenoma or carcinoma) or outside the body (steroid medicines). The pituitary is silent because feedback is working.</p></details>`,
recap:["Cortisol inhibits corticotropin-releasing hormone and adrenocorticotropic hormone (fast and slow feedback).","Low cortisol + high adrenocorticotropic hormone = primary; low + low = secondary or tertiary.","High cortisol + low adrenocorticotropic hormone = adrenal tumour or steroid medicines; high + high = pituitary or ectopic source."],
quiz:[{q:"Cortisol high, adrenocorticotropic hormone undetectable. Most likely source?",o:["Pituitary adenoma","Cortisol-secreting adrenal adenoma","Ectopic tumour"],a:1,e:"Autonomous adrenal cortisol suppresses the pituitary by feedback, so adrenocorticotropic hormone is low."},
{q:"A patient takes prednisolone 20 mg daily. What happens to his own adrenocorticotropic hormone and cortisol?",o:["Both high","Both low","Adrenocorticotropic hormone high, cortisol low"],a:1,e:"The drug acts on the hypothalamus and pituitary like cortisol; the axis is switched off and the adrenal makes little cortisol."}]},

{id:"f3",title:"The daily rhythm and the pulses",min:4,goal:2,obj:["Describe when cortisol is highest and lowest","Explain which tests are timed and why","Link the rhythm to tablet timing"],html:`
<div class="scene"><b>The scene:</b> A friend who works night shifts asks why her doctor wants a blood test "before 9 in the morning" and a saliva sample "at 11 at night".</div>
<p>The axis follows a [[circadian]] set by the [[scn]] (the master clock, reset by daylight). On top of this, adrenocorticotropic hormone comes in bursts, each followed by a cortisol pulse ([[pulsatile]]).</p>
<p>👉 Click the time points on the curve:</p>
<div data-widget="circadian"></div>
<p><b>Clinical consequences:</b></p>
<ul><li><b>Too little cortisol?</b> Test at the <b>peak</b>: a [[basalcort]] at about 8–9 a.m.</li>
<li><b>Too much cortisol?</b> Test at the <b>low point</b>: [[lnsc]]. Losing the midnight low is an early sign of Cushing syndrome.</li>
<li><b>Tablets:</b> give the biggest hydrocortisone dose on waking, and prednisolone in the <b>morning</b> (less axis suppression and less insomnia).</li>
<li><b>Night shifts and jet lag:</b> the rhythm shifts only slowly and often incompletely, so interpret timed tests by the patient's sleep times.</li></ul>
<div class="hint">💡 <b>"Hunt too little at the top, too much at the bottom."</b> Low cortisol shows best at the morning peak; high cortisol shows best at the midnight low.</div>
<details class="chk"><summary>✋ Checkpoint: why is a single afternoon cortisol useless to exclude Cushing syndrome?</summary><p>Pulses and the daily fall make afternoon values vary a lot, and many patients with Cushing syndrome have normal afternoon values. Their problem is the missing evening fall.</p></details>`,
recap:["Cortisol rises in late sleep, peaks around waking, and is lowest around midnight (slide 26).","Adrenocorticotropic hormone is pulsatile; single random values mislead.","Morning cortisol tests for insufficiency; late-night salivary cortisol tests for Cushing syndrome; give steroids in the morning."],
quiz:[{q:"When is cortisol normally lowest?",o:["Around waking","Around midday","Around midnight"],a:2,e:"Cortisol falls through the day and reaches its lowest level around midnight, then rises in the second half of the night."},
{q:"Which test uses the loss of the midnight low to screen for Cushing syndrome?",o:["Morning serum cortisol","Late-night salivary cortisol","Short stimulation test"],a:1,e:"Saliva collected at about 11 p.m. reflects free cortisol at the time it should be lowest."}]}
]};

/* ===== Subsection 8: steps 4–5 ===== */
M8.cards.push(
{id:"f4",title:"Stress: when the axis overrides the clock",min:4,goal:3,obj:["List physical, psychological and inflammatory triggers","Explain how cytokines drive the axis","Explain what cortisol does for the body in stress"],html:`
<div class="scene"><b>The scene:</b> Day 1 after a hip replacement. Pain, blood loss, inflammation. Although it is evening, her cortisol is far above her usual morning peak.</div>
<p><b>Triggers:</b> surgery, trauma, infection, low glucose, low blood pressure, burns, intense emotion or fear. Signals arrive from the limbic system, the brainstem and the blood: [[cytok]] (interleukin-1, interleukin-6, tumour necrosis factor) switch on corticotropin-releasing hormone and adrenocorticotropic hormone directly.</p>
<p><b>What happens:</b> the set point is turned <b>up</b>. Feedback still works, but the brain now defends a much higher cortisol. Vasopressin adds extra drive.</p>
<p><b>Why it helps:</b></p>
<ul><li>Fuel: more glucose ([[gneo]]) and mobilised amino acids and fatty acids.</li>
<li>Circulation: the [[permis]] keeps blood vessels responsive to adrenaline and noradrenaline.</li>
<li>Brake on the immune system: cortisol stops inflammation from overshooting. The immune system switches the axis on, and cortisol damps the immune system: a second feedback loop.</li>
<li>Medulla: cortisol-rich blood flows from the cortex into the medulla and supports the enzyme that makes adrenaline (phenylethanolamine N-methyltransferase).</li></ul>
<p>👉 In the diagram, compare <b>normal</b> with <b>stress</b>:</p>
<div data-widget="axisloop" data-start="stress"></div>
<p><b>Clinical link:</b> a patient without a working adrenal (Addison disease, or an axis suppressed by steroid tablets) cannot mount this rise. That is the reason for [[stressdose]] and [[sickday]] (see <a onclick="showModule('d2')" style="cursor:pointer;color:var(--acc);font-weight:700">module 2.2</a>). Long-term overactivation (severe depression, alcohol excess) gives [[pseudocush]].</p>
<div class="hint">💡 <b>"Stress turns the thermostat up, it does not remove it."</b> The loop still works, just at a higher setting.</div>
<details class="chk"><summary>✋ Checkpoint: why does a patient on long-term prednisolone need extra steroid for surgery?</summary><p>Her axis is suppressed, so she cannot raise her own cortisol in response to the surgical stress. The extra dose replaces the rise she cannot make.</p></details>`,
recap:["Stress (physical, psychological, inflammatory) overrides the rhythm and raises the set point.","Cytokines (interleukin-1, interleukin-6, tumour necrosis factor) and vasopressin drive the axis.","Cortisol in stress: fuel, blood pressure (permissive effect), brake on inflammation; patients without an axis need stress dosing."],
quiz:[{q:"Which statement about stress is correct?",o:["Negative feedback stops working completely","The set point rises, but feedback still works","Cortisol falls to protect the immune system"],a:1,e:"The brain defends a higher cortisol level during stress; feedback remains active around the new set point."},
{q:"Which cytokine is a classic activator of the axis during infection?",o:["Interleukin-6","Insulin","Erythropoietin"],a:0,e:"Interleukin-1, interleukin-6 and tumour necrosis factor stimulate corticotropin-releasing hormone and adrenocorticotropic hormone."}]},

{id:"f5",title:"Dexamethasone suppression tests: the logic",min:5,goal:4,obj:["Explain why dexamethasone is used","Interpret the 1 mg overnight and the low-dose tests","Use adrenocorticotropic hormone and the high-dose test to find the source","Name causes of false results"],html:`
<div class="scene"><b>The scene:</b> A 41-year-old woman has a round red face, wide purple stretch marks, weak thighs and new high blood pressure. Is her cortisol truly too high, and if so, where does it come from?</div>
<p><b>Why dexamethasone?</b> [[dexa]] acts like a strong cortisol on the pituitary, but it is given in tiny doses and most cortisol assays do not detect it. So any cortisol you measure afterwards is the patient's <b>own</b>. In a healthy person feedback switches off adrenocorticotropic hormone, and cortisol falls.</p>
<h3>Step A: is there Cushing syndrome?</h3>
<ul><li><b>1 mg overnight test:</b> 1 mg dexamethasone at 11 p.m.–midnight, serum cortisol at 8–9 a.m. Normal suppression: below <b>1.8 µg/dl (50 nmol/L)</b> (Endocrine Society, 2008).</li>
<li><b>Low-dose 48-hour test:</b> 0.5 mg every 6 hours for 48 hours; the same cut-off. Used to confirm.</li></ul>
<h3>Step B: where does it come from?</h3>
<ul><li><b>Adrenocorticotropic hormone first.</b> Low → adrenal source (imaging of the adrenals). Normal or high → pituitary or ectopic source.</li>
<li><b>[[hddst]]:</b> 8 mg. A pituitary adenoma usually keeps some feedback, so cortisol falls clearly (classically by more than half); ectopic and adrenal tumours do not suppress.</li>
<li>Today pituitary magnetic resonance imaging, the corticotropin-releasing hormone test and [[ipss]] are the main tools to tell pituitary from ectopic.</li></ul>
<p>👉 Run the test on each patient:</p>
<div data-widget="dextest"></div>
<p><b>False "no suppression":</b> the oestrogen pill (more cortisol-binding globulin), drugs that speed up dexamethasone breakdown (carbamazepine, phenytoin, rifampicin), a forgotten or vomited tablet, [[pseudocush]], severe illness. Measuring the dexamethasone level together with cortisol checks that the drug was really present. <b>False "suppression":</b> drugs that slow dexamethasone breakdown (for example itraconazole, ritonavir), and liver or kidney failure.</p>
<p><b>Oestrogen and the test:</b> Stop <b>oral</b> oestrogen about 6 weeks before testing (Nieman and colleagues, 2008). Oestrogen through the skin (patches, gels) and progestogen-only methods barely change cortisol-binding globulin. If oral oestrogen cannot be stopped, use late-night saliva cortisol or 24-hour urine free cortisol instead.</p>
<div class="hint">💡 <b>Dexamethasone asks the pituitary: "Are you still listening?"</b> Healthy: yes, even to a whisper (1 mg). Pituitary tumour: only if you shout (8 mg). Ectopic tumour and adrenal tumour: never, because they do not listen to the pituitary's feedback at all.</div>
<details class="chk"><summary>✋ Checkpoint: why does an adrenal adenoma not suppress even with 8 mg?</summary><p>Its cortisol does not depend on adrenocorticotropic hormone at all (which is already suppressed), so lowering adrenocorticotropic hormone further changes nothing.</p></details>`,
recap:["Dexamethasone = feedback signal that is not measured as cortisol.","1 mg overnight or low-dose 48-hour test: normal cortisol below 1.8 µg/dl (50 nmol/L).","Then adrenocorticotropic hormone: low → adrenal; normal/high → pituitary (partly suppresses with 8 mg) or ectopic (does not).","False positives: pill, enzyme inducers, missed tablet, pseudo-Cushing states."],
quiz:[{q:"After 1 mg dexamethasone overnight, morning cortisol is 0.9 µg/dl. Interpretation?",o:["Normal suppression; Cushing syndrome unlikely","Cushing syndrome confirmed","Adrenal insufficiency"],a:0,e:"Cortisol below 1.8 µg/dl (50 nmol/L) after 1 mg dexamethasone is normal suppression."},
{q:"Cortisol is high, adrenocorticotropic hormone is high and cortisol does NOT fall with 8 mg dexamethasone. Most likely source?",o:["Pituitary adenoma","Ectopic adrenocorticotropic hormone-secreting tumour","Adrenal adenoma"],a:1,e:"High adrenocorticotropic hormone points to a pituitary or ectopic source; failure to suppress with high dose favours ectopic."}]}
);

cases:[
{id:"q1",title:"Case 1: The test that failed because of the pill",steps:[
{t:`<b>The scene:</b> A 29-year-old woman with obesity and irregular periods is screened for Cushing syndrome. She takes a combined oestrogen pill. After 1 mg dexamethasone overnight, her cortisol is 3.5 µg/dl (97 nmol/L): "not suppressed". She has no stretch marks, bruising or muscle weakness.`,q:"What is the most likely explanation?",o:["Cushing disease","Oestrogen raised cortisol-binding globulin, so total cortisol stays higher (a false positive)","Adrenal insufficiency"],a:1,e:"Oestrogen increases cortisol-binding globulin; total cortisol measured after dexamethasone can stay above the cut-off without true cortisol excess."},
{t:`She would like to keep the pill.`,q:"What is the most sensible next test?",o:["Inferior petrosal sinus sampling","24-hour urinary free cortisol (twice) and late-night salivary cortisol","High-dose dexamethasone test"],a:1,e:"Both measure free cortisol, so they are not affected by cortisol-binding globulin. Alternatively stop the oral oestrogen pill about 6 weeks before repeating the dexamethasone test (Nieman and colleagues, 2008). Patches, gels or a progestogen-only method would barely affect cortisol-binding globulin."}],

{id:"q3",title:"Case 3 (bonus): Read the axis",steps:[

{t:`Patient C feels terrible and her blood pressure is low.`,q:"Which levels of her axis are suppressed?",o:["Only the adrenal","Hypothalamus and pituitary (with an atrophied adrenal cortex)","None"],a:1,e:"Long-term prednisolone switches off corticotropin-releasing hormone and adrenocorticotropic hormone; the adrenal shrinks from lack of stimulation. Aldosterone is usually preserved."}],

],

"False positives: oestrogen pill, enzyme inducers, missed dose, pseudo-Cushing states."],
finalHtml:`<div class="exam" style="border-color:var(--ok)"><b>➡️ Next</b><br>What does all this cortisol actually do, and what happens when we give it as a drug? <b>Subsection 9: glucocorticoid actions, therapy and side effects.</b><br><button class="pri" style="margin-top:8px" onclick="showModule('m9')">→ Open subsection 9</button></div>`,
