cards:[
{id:"a1",title:"Meet M.T.: what is suspicious?",min:3,goal:0,obj:["Read a case file like a detective: separate red flags from background noise","Recognise that adrenal insufficiency can look like a stomach or gallbladder problem","Notice the autoimmune clue hidden in the history"],html:`
<div class="scene"><b>The scene:</b> Emergency department. M.T., 53, female. She has pain under the right ribs (right hypochondrium), nausea and vomiting, and has felt exhausted for weeks. Blood pressure is low and her sodium is 130 mmol/L. She takes <b>no medication</b>.</div>
<table><tr><th>Case file (slides 2–3)</th><th></th></tr>
<tr><td>Reasons for admission</td><td>Right hypochondrium pain, nausea, vomiting, fatigue, low blood pressure, [[hyponat]] (sodium 130 mmol/L, emergency department)</td></tr>
<tr><td>Past history</td><td>At 45: hiatal hernia, fatty liver disease. Toxic hepatitis. Gallstones (cholelithiasis)</td></tr>
<tr><td>Gynaecology</td><td>First period at 14, <b>menopause at 38</b>, no births</td></tr>
<tr><td>Medication</td><td>None</td></tr></table>
<p>👉 <b>Click each clue</b> to decide why it matters:</p>
<div data-widget="clues"></div>
<p><b>The big lesson:</b> [[crisis|Adrenal insufficiency]] is a great <b>mimic</b>. Nausea, vomiting and abdominal pain are common in adrenal insufficiency, so a patient can end up on a surgical ward. Low blood pressure plus low sodium in someone who is vomiting should always make you ask: <i>"Could this be the adrenals?"</i></p>
<div class="hint">💡 <b>"Vomiting + low pressure + low sodium = think adrenal before you blame the gallbladder."</b> And: menopause before 40 = premature. Ask yourself: <i>"What else could be autoimmune here?"</i></div>`,
recap:["Abdominal pain, nausea, vomiting, fatigue, low blood pressure and low sodium together suggest adrenal insufficiency.","Menopause at 38 = primary ovarian insufficiency, a possible autoimmune clue.","'No medication' matters: it makes steroid withdrawal (secondary insufficiency) unlikely."],
quiz:[{q:"Which detail in M.T.'s history best hints that more than one gland may be under immune attack?",o:["Hiatal hernia at 45","Menopause at 38","Gallstones"],a:1,e:"Menopause before 40 is premature (primary ovarian insufficiency). Ovarian failure can be autoimmune and is associated with autoimmune adrenal disease."},
{q:"Why is 'no medication' an important negative?",o:["It excludes stopping long-term steroid tablets, the most common cause of secondary adrenal insufficiency","It proves she is healthy","It rules out gallstones"],a:0,e:"Steroid tablets suppress the hypothalamic–pituitary–adrenal axis. If someone stops them, secondary insufficiency follows. No steroid use makes that cause unlikely."}]},

{id:"a2",title:"Examination and presumptive diagnosis",min:4,goal:1,obj:["Explain why the skin darkens in primary adrenal insufficiency","Link low blood pressure and loss of body hair to the missing hormones","Write a problem list (presumptive diagnosis) like the slide"],html:`
<div class="scene"><b>The scene:</b> You examine M.T. Her skin is dry and darker than you expected. Her armpits are hairless. Her eyes are slightly yellow. Blood pressure 90/60 mmHg, pulse 80 per minute.</div>
<table><tr><th>Finding (slides 4–5)</th><th>What it tells you</th></tr>
<tr><td>[[hyperpig|Hyperpigmentation]], dry skin</td><td>Low cortisol → no feedback → the pituitary makes huge amounts of [[acth]] from [[pomc]], which also stimulates melanocytes. <b>Dark skin = primary.</b></td></tr>
<tr><td>Blood pressure 90/60 mmHg</td><td>Cortisol keeps blood vessels responsive to adrenaline and noradrenaline; [[aldo|aldosterone]] keeps salt and water in. Both are missing.</td></tr>
<tr><td>Loss of axillary and pubic hair</td><td>In women, body hair depends on adrenal androgens ([[dhea]]). Adrenal failure removes them (and her ovaries have also stopped).</td></tr>
<tr><td>[[goitre|Goitre grade Ib]], elastic, painless</td><td>Thyroid clue → think [[thyroiditis]]. Is she hypothyroid?</td></tr>
<tr><td>Yellow sclerae, right hypochondrium pain</td><td>Bile problem ([[cholestasis]]?) with known gallstones.</td></tr>
<tr><td>Negative Giordano sign</td><td>No pain when the kidney area is tapped → kidney infection or stone less likely.</td></tr>
<tr><td>Body mass index 26 kg/m²</td><td>Slightly overweight: adrenal insufficiency does not always make people thin.</td></tr>
<tr><td>Pituitary: no headache, no visual field problems</td><td>No sign of a pituitary tumour, so a pituitary (secondary) cause is less likely.</td></tr></table>
${FIG("hyper","M.T. shows the same pattern: darker skin than expected for her.")}
<h3>Presumptive diagnosis (slide 7)</h3>
<p>• Early menopause &nbsp;• <b>Adrenal insufficiency suspected</b> &nbsp;• Goitre grade Ib: hypothyroidism? &nbsp;• Gallstones? &nbsp;• Cholestatic syndrome?</p>
<div class="hint">💡 <b>"Primary = Pigmented, Potassium high."</b> Both come from the adrenal itself failing: high adrenocorticotropic hormone darkens the skin; missing aldosterone raises potassium. <br>Fun fact: the man in the photo on slide 24 is United States president John F. Kennedy, who had Addison disease. His year-round "tan" is often linked to it.</div>`,
recap:["Dark skin = high adrenocorticotropic hormone from proopiomelanocortin = primary insufficiency.","Low blood pressure: no cortisol (vessel tone) and no aldosterone (volume).","Loss of axillary and pubic hair in women = loss of adrenal androgens."],
quiz:[{q:"Which examination finding best separates primary from secondary adrenal insufficiency?",o:["Fatigue","Hyperpigmentation","Low blood pressure"],a:1,e:"Only primary insufficiency has very high adrenocorticotropic hormone, which darkens the skin. Fatigue and low blood pressure occur in both."},
{q:"Why has M.T. lost her axillary and pubic hair?",o:["Lack of adrenal androgens such as dehydroepiandrosterone","Lack of aldosterone","Too much cortisol"],a:0,e:"In women, adrenal androgens drive axillary and pubic hair. Adrenal failure (in both primary and secondary insufficiency) removes them."}]},

{id:"a3",title:"Routine labs: read the blood like a story",min:4,goal:2,obj:["Explain low sodium, high potassium and low glucose in adrenal insufficiency","Use serum osmolality to confirm true hyponatraemia","Separate adrenal findings from the second problem (the bile ducts)"],html:`
<div class="scene"><b>The scene:</b> The first blood results arrive. The registrar circles four values in red and says: "Explain each one and you have the diagnosis."</div>
<p>👉 <b>Click any value</b> (red = high, blue = low) to see why it happens. Explain every abnormal value for a bonus.</p>
<div data-widget="labs"></div>
<p><b>The adrenal pattern (slide 13):</b> [[hyponat]], [[hyperkal]], sometimes high calcium, raised urea from dehydration, anaemia and [[eos]]. Plus [[hypogly]]. M.T. has the core four: <b>low sodium, high potassium, low glucose, low [[osm|osmolality]]</b>.</p>
<p><b>Why sodium falls twice over:</b> no aldosterone → salt is lost in the urine; no cortisol → the brake on [[adh]] is released → water is kept and sodium is diluted.</p>
<div class="hint">💡 <b>"Salt goes, potassium stays, sugar drops."</b> No aldosterone → sodium is lost and potassium is kept. No cortisol → glucose falls.</div>
<div class="corr">📝 <b>Slide check (slides 9 and 13):</b><br>• Albumin is written as "40, range 38–54 <b>mg/dl</b>". That must be <b>g/L</b> (40 g/L = 4.0 g/dl). 40 mg/dl would be incompatible with life.<br>• Creatine kinase has the same reference range as lactate dehydrogenase (125–220 U/L), probably copied by mistake. Low values of both have no clinical meaning here.<br>• Slide 13 lists raised urea (azotaemia), high calcium and eosinophilia as typical. M.T. actually has <b>low</b> urea and <b>normal</b> calcium, and no white cell differential is given, so we cannot judge eosinophils. Textbook lists are possibilities, not guarantees.</div>`,
recap:["Low sodium: aldosterone loss (salt wasting) plus antidiuretic hormone excess from cortisol lack.","High potassium: no aldosterone, so it points to primary insufficiency.","Low glucose: no cortisol for gluconeogenesis. Raised bilirubin and gamma-glutamyl transferase = cholestasis, a separate problem."],
quiz:[{q:"Which electrolyte finding points specifically to PRIMARY rather than secondary insufficiency?",o:["Low sodium","High potassium","Low glucose"],a:1,e:"Potassium rises only when aldosterone is missing, and aldosterone is lost only when the adrenal itself fails. Low sodium and low glucose can occur in secondary insufficiency too."},
{q:"Why can sodium be low even in SECONDARY insufficiency, where aldosterone is normal?",o:["Cortisol lack increases antidiuretic hormone → water retention dilutes sodium","Renin is very high","The kidney loses potassium"],a:0,e:"Cortisol normally restrains antidiuretic hormone (vasopressin). Without cortisol the body keeps water, so sodium is diluted."}]},

{id:"a4",title:"The diagnostic ladder: confirm it and find the level",min:5,goal:3,obj:["Interpret a morning cortisol using the slide thresholds","Choose and read the short and long stimulation tests","Know when the insulin tolerance test is the gold standard, and when it is not needed or dangerous","Tell primary from secondary using adrenocorticotropic hormone, renin and aldosterone"],html:`
<div class="scene"><b>The scene:</b> You suspect adrenal insufficiency. The consultant asks two questions: <b>"Is the cortisol really too low?"</b> and <b>"Where is the chain broken: adrenal, pituitary or hypothalamus?"</b></div>
<p>Remember the [[hpa]]: [[crh]] → adrenocorticotropic hormone → cortisol. Click the levels to see what happens to each hormone:</p>
<div data-widget="hpa"></div>
<h3>🪜 Climb the ladder (click each rung)</h3>
<p>Tools on the ladder: [[basalcort]], [[renin]], [[sst]] with [[synacthen]], [[lst]], [[itt]], [[ab21]] and [[ct]].</p>
<div data-widget="ladder"></div>
<h3>Primary versus secondary at a glance (slide 24, extended)</h3>
<table><tr><th></th><th>[[pai|Primary]] (adrenal)</th><th>[[sai|Secondary]] (pituitary)</th></tr>
<tr><td>Skin and mucosa</td><td><b>Dark</b></td><td>Pale</td></tr>
<tr><td>Potassium</td><td><b>High</b></td><td>Normal</td></tr>
<tr><td>Sodium</td><td>Low</td><td>Normal or low</td></tr>
<tr><td>Adrenocorticotropic hormone</td><td><b>Very high</b></td><td>Low or inappropriately normal</td></tr>
<tr><td>Renin / aldosterone</td><td>Renin high, aldosterone low</td><td>Normal (intact renin–angiotensin–aldosterone system)</td></tr>
<tr><td>Associated diseases</td><td>Primary hypothyroidism, type 1 diabetes, vitiligo, neurological deficit (adrenoleukodystrophy, males only)</td><td>Low sex hormones or low thyroid from the pituitary, growth hormone deficiency, diabetes insipidus, headaches, visual field problems</td></tr></table>
<p>The third level, [[tai]], behaves like secondary at the bedside.</p>
<div class="hint">💡 <b>"Low cortisol? Ask the boss."</b> If adrenocorticotropic hormone (the boss) is shouting (very high), the worker (adrenal) is broken = primary. If the boss is silent (low), the boss is the problem = secondary.</div>
<div class="corr">📝 <b>Slide check:</b><br>• <b>Slide 16, "Cortrosyn 250/5/1 µg":</b> ambiguous. The standard tests are the <b>250 µg</b> (high-dose, standard) and the <b>1 µg</b> (low-dose) test. A 5 µg dose is not a standard test.<br>• <b>Normal response "above 18–20 µg/dl"</b> (about 500–550 nmol/L) is the classic cut-off. Newer, more specific cortisol assays use lower cut-offs, so always use your laboratory's value.<br>• <b>Slide 21, insulin tolerance test "gold standard":</b> true for testing the <i>whole</i> axis (especially suspected pituitary or hypothalamic disease). For suspected primary insufficiency the short stimulation test is the recommended first-line test (Endocrine Society guideline, 2016). For M.T. the insulin test would be <b>dangerous</b>: she is already hypoglycaemic (59 mg/dl) and hypotensive.<br>• <b>Slide 12:</b> 14 µg/dl × 27.59 = 386 nmol/L. The slide rounds this to 400 nmol/L, so treat both as approximate.<br>• Conversion used in this module: cortisol µg/dl × 27.59 = nmol/L.</div>`,
recap:["Morning cortisol: below 3 µg/dl = insufficiency very likely, above 14 µg/dl = intact. M.T.: 4.8 µg/dl (about 132 nmol/L), grey zone → test.","Short stimulation test (250 µg): M.T. peaked at 7.2 µg/dl (normal above 18–20) = adrenal insufficiency confirmed.","Adrenocorticotropic hormone 701.9 pg/ml (about 11 times the upper limit) = PRIMARY. Insulin test = whole-axis gold standard, but not needed or not safe here."],
quiz:[{q:"M.T.'s 8 a.m. cortisol is 4.8 µg/dl (about 132 nmol/L). Using the slides, what next?",o:["Nothing: adrenal insufficiency is excluded","Do a stimulation test: the value is between 3 and 14 µg/dl","Insulin tolerance test immediately"],a:1,e:"Above 14 µg/dl excludes insufficiency and below 3 µg/dl makes it very likely. 4.8 µg/dl is in between and very suspicious, so do a stimulation test. The insulin test is unsafe in a hypoglycaemic, hypotensive patient."},
{q:"After 250 µg tetracosactide her cortisol is 7.2 µg/dl at 30 minutes and 6.4 µg/dl at 60 minutes; adrenocorticotropic hormone is 701.9 pg/ml. Diagnosis?",o:["Secondary adrenal insufficiency","Primary adrenal insufficiency","Normal adrenal function"],a:1,e:"No cortisol rise (normal above 18–20 µg/dl) = adrenal insufficiency. Very high adrenocorticotropic hormone = the pituitary is shouting at a broken adrenal = primary."}]}
]};

/* ===== CBL 5 lesson: steps 5–7 ===== */
CBL5.cards.push(
{id:"a5",title:"Putting it together: Schmidt syndrome",min:4,goal:4,obj:["Match each part of the final diagnosis to its evidence","Define autoimmune polyglandular syndromes types 1 to 4","Compare type 1 and type 2","Know what to screen for, and the 'hydrocortisone before thyroxine' rule"],html:`
<div class="scene"><b>The scene:</b> The remaining results come back (slide 20). [[tsh]] 0.94 and free thyroxine 0.96: normal. [[antitg]] 24.3 (normal up to 4.1): <b>positive</b>. [[antitpo]] 0.37: negative. [[pth|Parathyroid hormone]] 72 pg/ml (high), corrected calcium 8.9 mg/dl (normal), phosphorus normal, [[vitd]] 18 ng/ml (low). Abdominal computed tomography: adrenal glands normal (slide 27).</div>
<h3>Final diagnosis (slide 28) and the evidence</h3>
<table><tr><th>Diagnosis</th><th>Evidence</th></tr>
<tr><td><b>[[schmidt]] / [[aps2]]</b></td><td>Autoimmune adrenal failure + autoimmune thyroid disease (+ ovarian failure)</td></tr>
<tr><td>[[pai|Primary adrenal insufficiency]], acute adrenal failure</td><td>Cortisol 4.8 µg/dl, no response to stimulation, adrenocorticotropic hormone 701.9 pg/ml, high potassium, low sodium, low glucose, dark skin</td></tr>
<tr><td>Goitre grade Ib, [[thyroiditis]], [[euthy]]</td><td>Goitre, anti-thyroglobulin positive, normal thyroid hormones</td></tr>
<tr><td>[[poi|Primary ovarian failure]]</td><td>Menopause at 38</td></tr>
<tr><td>[[shpt]] due to vitamin D deficiency</td><td>Parathyroid hormone high, calcium normal, vitamin D low</td></tr>
<tr><td>Hiatal hernia, gallstones, [[cholestasis|cholestatic syndrome]], fatty liver, overweight</td><td>History, yellow sclerae, high direct bilirubin and [[ggt]], body mass index 26</td></tr></table>
<div class="corr">📝 <b>Thyroid note:</b> M.T. is <b>anti-thyroglobulin positive but anti-thyroid peroxidase negative</b>. Most people with autoimmune thyroiditis are thyroid peroxidase positive, so this pattern is less typical. Positive thyroglobulin antibodies with a goitre still support autoimmune thyroiditis. Also, slide 7 asked "hypothyroidism?": the answer is <b>no</b>, she is euthyroid. The ultrasound on slide 26 is a reference picture from Radiopaedia, not necessarily M.T.'s scan.</div>
${FIG("adrenalitis","This is what is happening in M.T.'s adrenals.")}
<h3>[[aps|Autoimmune polyglandular syndromes]] (slide 29)</h3>
<table><tr><th>Type</th><th>Definition</th></tr>
<tr><td>Type 1</td><td>Chronic candidiasis, hypoparathyroidism, autoimmune adrenal insufficiency (at least two)</td></tr>
<tr><td><b>Type 2 (Schmidt)</b></td><td>Autoimmune adrenal insufficiency (<b>must always be present</b>) + autoimmune thyroid disease and/or type 1 diabetes</td></tr>
<tr><td>Type 3</td><td>Autoimmune thyroid disease + other autoimmune diseases (excluding adrenal insufficiency, hypoparathyroidism, chronic candidiasis)</td></tr>
<tr><td>Type 4</td><td>Two or more organ-specific autoimmune diseases that do not fit types 1–3</td></tr></table>
<h3>Type 1 versus type 2</h3>
<table><tr><th></th><th>[[aps1|Type 1]]</th><th>[[aps2|Type 2]]</th></tr>
<tr><td>Cause</td><td>One gene: autoimmune regulator gene, autosomal recessive</td><td>Many genes, linked to human leukocyte antigen DR3 / DR4</td></tr>
<tr><td>Onset</td><td>Childhood</td><td>Adulthood</td></tr>
<tr><td>Sex</td><td>Both sexes equally</td><td>More often women</td></tr>
<tr><td>Core diseases</td><td>Candidiasis, hypoparathyroidism, Addison disease</td><td>Addison disease + thyroid disease and/or type 1 diabetes. Also possible: ovarian failure, vitiligo, coeliac disease, pernicious anaemia</td></tr></table>
<p><b>Clinical consequences:</b> screen M.T. regularly for thyroid function, diabetes (glucose), vitamin B12 deficiency and coeliac disease, and tell first-degree relatives about the risk. [[ab21]] confirm the autoimmune cause. [[ct|Imaging]] matters less in primary insufficiency (take-home message); it is needed when antibodies are negative, to look for bleeding, metastases or tuberculosis (slide 19).</p>
<div class="hint">💡 <b>"Two = Thyroid (or Type 1 diabetes) Together with the adrenal."</b> And the safety rule: <b>"Steroids before thyroxine."</b> If adrenal insufficiency and hypothyroidism coexist, start hydrocortisone first. Thyroxine speeds up cortisol breakdown and can trigger a crisis.</div>`,
recap:["Final diagnosis: autoimmune polyglandular syndrome type 2 (Schmidt) = autoimmune Addison disease + autoimmune thyroiditis (+ primary ovarian failure).","Type 2: adrenal always present; adult women; human leukocyte antigen-linked. Type 1: autoimmune regulator gene, childhood, candidiasis + hypoparathyroidism + Addison disease.","Secondary hyperparathyroidism here is from low vitamin D, not autoimmune. Start hydrocortisone before thyroxine."],
quiz:[{q:"Which component MUST be present for autoimmune polyglandular syndrome type 2?",o:["Type 1 diabetes","Autoimmune adrenal insufficiency","Hypoparathyroidism"],a:1,e:"Type 2 = autoimmune adrenal insufficiency (always) + autoimmune thyroid disease and/or type 1 diabetes. Hypoparathyroidism belongs to type 1."},
{q:"A new patient has untreated adrenal insufficiency AND untreated hypothyroidism. What do you start first?",o:["Thyroxine first","Hydrocortisone first, then thyroxine","It does not matter"],a:1,e:"Thyroxine increases cortisol clearance. Giving it first to someone with untreated adrenal insufficiency can precipitate an adrenal crisis."}]},

{id:"a6",title:"Adrenal crisis: treat first, confirm later",min:4,goal:5,obj:["Recognise an adrenal crisis","Give the correct first-hour treatment (hydrocortisone, saline, glucose)","Explain why hydrocortisone beats dexamethasone","Know when fludrocortisone is (not) needed acutely"],html:`
<div class="scene"><b>The scene:</b> Back to admission day. M.T. is vomiting, her blood pressure is 90/60 mmHg, sodium 126, potassium 6.21, glucose 59 mg/dl. The cortisol result will not be ready until tomorrow. Do you wait?</div>
<p><b>No.</b> First take-home message (slide 35): <b>if you clinically suspect acute adrenal insufficiency ([[crisis]]), start emergency treatment before the diagnosis is confirmed.</b> Take blood for cortisol and adrenocorticotropic hormone first if it costs no time, then treat.</p>
<p>👉 Click each box in the flow:</p>
${FIG("crisis")}
<div data-widget="crisis"></div>
<p><b>Why [[hydrocortisone]]?</b> At high doses, hydrocortisone also acts on the mineralocorticoid receptor, so it replaces cortisol <i>and</i> covers the missing aldosterone. [[dexa]] has no salt-retaining effect at all.</p>
<p><b>Why no [[fludro|fludrocortisone]] at first?</b> While hydrocortisone is 50 mg per day or more, its own mineralocorticoid effect is enough. Fludrocortisone is started when the dose is lowered below that.</p>
<div class="hint">💡 <b>The 5 S of adrenal crisis:</b> <b>S</b>alt (0.9 % saline), <b>S</b>ugar (glucose), <b>S</b>teroid (hydrocortisone), <b>S</b>upport (monitoring, intensive care if needed), <b>S</b>earch for the trigger (infection, vomiting, surgery, stopped tablets).</div>
<div class="corr">📝 <b>Slide check (slide 30): handle with care</b><br>• <b>"IV hydrocortisone 100 mg or DXM 4 mg every 6 hours":</b> dexamethasone 4 mg every 6 hours is <b>not</b> standard crisis treatment. Hydrocortisone is preferred because it also has a mineralocorticoid effect. If dexamethasone is used at all (for example while a stimulation test is still planned, because it does not interfere with the cortisol assay), it is usually given as <b>one 4 mg dose</b>, repeated at most once every 24 hours, and switched to hydrocortisone as soon as possible. Treatment must never be delayed for testing.<br>• <b>Hydrocortisone dosing</b> on the slide is ambiguous. Standard regimen (Endocrine Society guideline, 2016): <b>100 mg into a vein (or muscle) immediately</b>, then <b>200 mg per 24 hours</b> (50 mg every 6 hours, or as a continuous infusion), then taper to oral doses over 1–3 days once the trigger has resolved. The slide's "50 mg every 6 hours, then oral in 4–5 days" fits this maintenance part.<br>• <b>Fluids:</b> "1–3 litres per day" understates the first hour. Give <b>1 litre of 0.9 % saline within the first hour</b>, then adjust to circulation and blood results.<br>• <b>Fludrocortisone 0.1 mg</b> is not needed while hydrocortisone is 50 mg per day or more.<br>• <b>"Large needle (19G)":</b> resuscitation usually uses a large-bore cannula (18 gauge or wider). 19 gauge is not usually called large-bore.<br>• "HHS" on the slide = hydrocortisone hemisuccinate (the injectable form).</div>`,
recap:["Suspected adrenal crisis → treat immediately; never wait for cortisol results.","Hydrocortisone 100 mg into a vein or muscle, then 200 mg per 24 hours; 1 litre 0.9 % saline in the first hour; glucose if low; treat the trigger.","Hydrocortisone beats dexamethasone (mineralocorticoid effect). Fludrocortisone only once hydrocortisone is below 50 mg per day."],
quiz:[{q:"M.T. is hypotensive and vomiting; the cortisol result is pending until tomorrow. What do you do?",o:["Wait for the cortisol before giving steroids","Take blood, then give hydrocortisone 100 mg into a vein and start 0.9 % saline now","Give fludrocortisone tablets"],a:1,e:"Adrenal crisis is lethal if untreated. Take blood for cortisol and adrenocorticotropic hormone (no delay), then give hydrocortisone and saline immediately. She is vomiting, so tablets will not work."},
{q:"Why is hydrocortisone preferred to dexamethasone in adrenal crisis?",o:["It is cheaper","At high doses it also activates the mineralocorticoid receptor, replacing aldosterone","Dexamethasone does not work on the glucocorticoid receptor"],a:1,e:"Dexamethasone is a pure, potent glucocorticoid with practically no salt-retaining effect. High-dose hydrocortisone covers both deficits."}]},

{id:"a7",title:"Going home: replacement, sick-day rules, monitoring",min:5,goal:6,obj:["Prescribe physiological replacement for primary insufficiency","Teach sick-day rules and the emergency injection","Monitor glucocorticoid and mineralocorticoid replacement correctly","Recall the take-home messages"],html:`
<div class="scene"><b>The scene:</b> M.T. is stable and eating again. Before discharge she asks: "Do I need these tablets forever? And what if I get the flu?"</div>
<h3>M.T.'s discharge plan (slide 31)</h3>
<p>• Correct volume, dehydration and low glucose; salt-rich diet.<br>
• [[hydrocortisone|Hydrocortisone]] 10 mg tablets: 1½ – ½ – 0 = <b>15 mg on waking + 5 mg at midday = 20 mg per day</b> (largest dose in the morning, mimicking the natural morning peak).<br>
• [[fludro|Fludrocortisone]] 0.1 mg once in the morning.<br>
• Calcium 1500 mg per day + vitamin D3 2000 units, 2 tablets a day for 1 month, then 1 a day (for the low vitamin D and secondary hyperparathyroidism).<br>
• Silymarin (milk thistle) 1–1–1 for the liver, plus surgical and gastroenterology review for the gallstones and cholestasis.</p>
<h3>Chronic treatment options (slide 32)</h3>
<table><tr><th>Medicine</th><th>Dose</th><th>Monitoring</th></tr>
<tr><td>[[hydrocortisone|Hydrocortisone]]</td><td>15–25 mg per day in 2–3 doses</td><td rowspan="3">Symptoms of under- or over-replacement (see below)</td></tr>
<tr><td>[[pred|Prednisone]] (alternative)</td><td>3–5 mg once daily</td></tr>
<tr><td>[[dexa|Dexamethasone]]</td><td>0.5 mg once daily (slide; see check below)</td></tr>
<tr><td>[[fludro|Fludrocortisone]]</td><td>0.05–0.2 mg once daily; may need more in summer (salt lost in sweat)</td><td>Blood pressure, sodium, potassium, renin in the upper normal range</td></tr>
<tr><td>[[dhea|Dehydroepiandrosterone]]</td><td>25–50 mg once daily</td><td>Libido, mood, sense of well-being (women)</td></tr></table>
<h3>⚠️ [[sickday|Sick-day rules]] (slide 34): the lifesaver</h3>
<table><tr><th>Situation</th><th>Action</th></tr>
<tr><td>Fever above 38 °C</td><td><b>Double</b> the usual daily hydrocortisone dose</td></tr>
<tr><td>Fever above 39 °C</td><td><b>Triple</b> the usual daily dose</td></tr>
<tr><td>Cannot keep tablets down (repeated vomiting, severe diarrhoea, collapse)</td><td><b>100 mg hydrocortisone into a muscle</b> immediately + emergency care</td></tr></table>
<p>The slide also quotes the National Institute for Health and Care Excellence (2024): during major physical stress, at least 40 mg per day in 2–4 divided doses, continued until recovery (often 2–3 days). And always: <b>never stop glucocorticoids</b>, carry a [[card]], keep a [[kit]], and train patient and family.</p>
${FIG("sickday")}
<h3>Monitoring (slide 33)</h3>
<table><tr><th>Hydrocortisone (glucocorticoid)</th><th>Fludrocortisone (mineralocorticoid)</th></tr>
<tr><td>Symptoms: fatigue, weakness, appetite, nausea<br>Energy, weight, muscle strength<br>Blood pressure, dizziness on standing<br><b>Too little:</b> ongoing symptoms, weight loss, low pressure<br><b>Too much:</b> weight gain, hypertension, glucose rise, Cushing-like features</td>
<td>Sodium and potassium<br>Blood pressure, including standing<br>Salt craving and hydration<br>Swelling (oedema)<br><b>Too little:</b> salt craving, low sodium, high potassium, high renin<br><b>Too much:</b> hypertension, oedema, suppressed renin</td></tr></table>
<p><b>Key rule:</b> replacement is adjusted <b>clinically</b>. Chasing cortisol levels is not the standard way to adjust it.</p>
<div class="corr">📝 <b>Slide check (slide 32):</b><br>• <b>Dexamethasone 0.5 mg daily</b> appears in the American table, but current guidance (Endocrine Society, 2016) advises <b>against</b> dexamethasone for routine Addison replacement: it is long-acting, hard to dose finely, and carries a high risk of Cushing-like side effects. Hydrocortisone is first choice.<br>• "Low to normal plasma adrenocorticotropic hormone indicates over-replacement": in primary insufficiency adrenocorticotropic hormone is high before the morning dose anyway, and guidelines advise against using it to adjust the dose. Slide 33 agrees: adjust by symptoms and signs.</div>
<div class="exam" style="border-color:var(--ok)"><b>🏁 Take-home messages (slide 35)</b><ul>
<li>Clinical suspicion of acute adrenal insufficiency → start emergency treatment <b>before</b> diagnostic confirmation.</li>
<li>Primary insufficiency → replace glucocorticoid <b>and</b> mineralocorticoid at physiological doses.</li>
<li>Monitor clinically: symptoms, blood pressure, electrolytes, glucose.</li>
<li>Autoimmune cause → often associated with other autoimmune diseases.</li>
<li>Imaging is less important in primary adrenal insufficiency.</li></ul></div>
<div class="hint">💡 <b>"38 double, 39 triple, vomit = needle."</b></div>`,
recap:["Primary insufficiency: hydrocortisone 15–25 mg per day in 2–3 doses (biggest dose on waking) + fludrocortisone 0.05–0.2 mg per day.","Sick-day rules: above 38 °C double, above 39 °C triple, vomiting → 100 mg hydrocortisone into a muscle and go to hospital.","Monitor clinically; fludrocortisone by blood pressure, sodium, potassium and renin."],
quiz:[{q:"M.T. (hydrocortisone 20 mg per day) has the flu with a temperature of 38.5 °C and is eating and drinking. What should she take?",o:["Her usual 20 mg","40 mg per day (double)","100 mg into a muscle"],a:1,e:"Fever above 38 °C → double the usual daily dose while she can keep tablets down. Above 39 °C → triple."},
{q:"Two days later she vomits repeatedly and cannot keep tablets down. Correct action?",o:["Triple the oral dose","Inject 100 mg hydrocortisone into a muscle and seek emergency care","Skip the tablets until the vomiting stops"],a:1,e:"If tablets are not absorbed, oral dosing fails. Inject 100 mg hydrocortisone into a muscle immediately and go to hospital."},
{q:"Which is the best way to check that her fludrocortisone dose is right?",o:["Morning cortisol","Blood pressure (lying and standing), sodium, potassium and renin","Thyroid-stimulating hormone"],a:1,e:"Mineralocorticoid replacement is judged by volume status and electrolytes, with renin in the upper normal range."}]}
);

ladder:[["1. Morning (basal) cortisol","Blood at about 8 a.m.","Above 14 µg/dl (about 386–400 nmol/L) → axis intact (slide 12). Below 3 µg/dl (about 83 nmol/L) → insufficiency very likely; no stimulation test needed (slide 18). In between → stimulation test.","4.8 µg/dl (about 132 nmol/L; laboratory range 5–25) → grey zone and very suspicious → next rung."],
["2. Plasma adrenocorticotropic hormone","Same morning sample (before any steroid)","High → primary (adrenal). Low or inappropriately normal → secondary or tertiary.","701.9 pg/ml (range 7.2–63.3), about 11 times the upper limit → PRIMARY."],
["3. Renin and aldosterone (mineralocorticoid status)","Plasma renin activity and aldosterone","Primary: renin high, aldosterone low. Secondary: intact renin–angiotensin–aldosterone system (slide 14).","Not shown in the slides, but potassium 6.21 and sodium 126 fit low aldosterone."],
["4. Short stimulation test","250 µg tetracosactide into a vein or muscle; cortisol at 0, 30, 60 minutes (slide 16)","Normal: peak cortisol above 18–20 µg/dl (about 500–550 nmol/L). No rise → adrenal insufficiency.","30 min: 7.2 µg/dl (about 199 nmol/L); 60 min: 6.4 µg/dl (about 177 nmol/L) → FAILED → adrenal insufficiency confirmed."],
["5. Long (depot) stimulation test","Depot tetracosactide, cortisol over 48 hours (slide 17)","No rise → Addison disease. Normal peak → no insufficiency. Late peak → secondary insufficiency (the sleepy gland wakes up).","Not needed: already clear."],
["6. Insulin tolerance test","Insulin 0.05–0.15 units/kg into a vein; glucose and cortisol every 30 minutes for 2 hours. Valid only if glucose falls to 40 mg/dl (2.2 mmol/L) or lower (slide 18)","Normal: cortisol above 18–20 µg/dl. Gold standard for the WHOLE axis. Not needed if basal cortisol is below 3 µg/dl. Avoid in heart disease, epilepsy, or existing hypoglycaemia.","NOT appropriate: she is already hypoglycaemic and hypotensive, and the diagnosis is already made."],
["7. Find the cause","21-hydroxylase antibodies; adrenal computed tomography (slide 19)","Antibodies positive → autoimmune. Computed tomography: bleeding (both sides), metastases, tuberculosis, or a normal or small gland in autoimmune disease.","Computed tomography: normal adrenals (slide 27) → fits autoimmune adrenalitis. Antibody result not given in the slides."]],
crisis:[["1. SUSPECT","Shock or low blood pressure, vomiting, abdominal pain, confusion, fever; low sodium, high potassium, low glucose. Known Addison disease or steroid use? Dark skin?","#c62828"],
["2. BLOOD, but do not wait","Draw cortisol and adrenocorticotropic hormone (plus electrolytes, glucose, blood count, cultures) while placing a large-bore cannula. Never delay treatment for results.","#c62828"],
["3. HYDROCORTISONE 100 mg NOW","Into a vein (or into a muscle if there is no access). This is the single most important step.","#c62828"],
["4. FLUIDS + GLUCOSE","0.9 % saline: 1 litre within the first hour, then guided by blood pressure, urine output and electrolytes. Add glucose (dextrose) if glucose is low. Monitor potassium.","#d9730d"],
["5. CONTINUE + FIND THE TRIGGER","Hydrocortisone 200 mg per 24 hours (50 mg every 6 hours or as an infusion). Look for and treat the trigger: infection (antibiotics if fever persists), vomiting illness, surgery, stopped tablets.","#d9730d"],
["6. TAPER","When stable and eating: taper to oral hydrocortisone over 1–3 days. Start fludrocortisone (primary insufficiency) once hydrocortisone is below 50 mg per day.","#1f9d55"],
["7. CONFIRM + EDUCATE","Complete the diagnostic workup (stimulation test, antibodies), chronic replacement, sick-day rules, steroid emergency card, injection kit.","#1f9d55"]],
cases:[
{id:"x1",title:"Mini-case 1: The gardener who ran out of prednisolone",steps:[
{t:`<b>The scene:</b> A 70-year-old retired gardener has taken [[pred]] for polymyalgia rheumatica for many months. He ran out of tablets on holiday and stopped them suddenly 5 days ago. Now he is weak, nauseous and dizzy when standing. Blood pressure 95/60 mmHg. Sodium 131 mmol/L, <b>potassium 4.2 mmol/L</b>, glucose low-normal. His skin is pale.`,q:"Most likely diagnosis?",o:["Primary adrenal insufficiency (Addison disease)","Secondary or tertiary adrenal insufficiency from glucocorticoid suppression","Primary aldosterone excess"],a:1,e:"Months of prednisolone switched off corticotropin-releasing hormone and adrenocorticotropic hormone (glucocorticoid-induced adrenal suppression). Sudden stopping leaves a shrunken, sleepy adrenal without cortisol."},
{t:`Look at the clues again: potassium normal, skin pale. This is [[gcsup]].`,q:"Why is potassium normal?",o:["Aldosterone is controlled by the renin–angiotensin system, which still works","Prednisolone has strong salt-retaining effects","He has kidney failure"],a:0,e:"In secondary insufficiency only the adrenocorticotropic hormone drive is missing. The glomerulosa still answers to angiotensin II and potassium, so aldosterone and potassium stay normal. The low sodium comes from antidiuretic hormone excess."},
{t:`He is unwell but not shocked.`,q:"Best management?",o:["Restart glucocorticoid (stress dose while unwell), then taper slowly later; no fludrocortisone needed","Hydrocortisone plus fludrocortisone for life","Wait for a stimulation test before any steroid"],a:0,e:"Replace glucocorticoid now (higher dose while ill), then plan a slow taper so the axis can recover. Aldosterone is intact, so fludrocortisone is not needed. If he were shocked: treat as an adrenal crisis."}],
take:["The most common cause of adrenal insufficiency in practice is stopping long-term steroids.","Secondary: pale skin, normal potassium, low or normal adrenocorticotropic hormone.","Taper steroids after long-term use; teach sick-day rules to everyone on long-term steroids."]},
{id:"x2",title:"Mini-case 2: Addison disease meets a stomach bug",steps:[
{t:`<b>The scene:</b> A 34-year-old woman with known [[addison]] takes hydrocortisone 20 mg per day and fludrocortisone 0.1 mg. Since last night she has had vomiting and diarrhoea and cannot keep her tablets down. Her partner calls you: she is dizzy and getting confused.`,q:"What should the partner do right now?",o:["Give her double the oral dose","Inject 100 mg hydrocortisone into a muscle from her emergency kit and call emergency services","Wait until morning and see the family doctor"],a:1,e:"Vomiting means tablets are not absorbed. Sick-day rule: 100 mg hydrocortisone into a muscle immediately, then emergency care. Confusion is a warning sign of adrenal crisis."},
{t:`In the emergency department: blood pressure 80/50 mmHg, sodium 128, potassium 5.9, glucose 3.1 mmol/L. This is an [[crisis]].`,q:"First-hour treatment?",o:["Hydrocortisone 100 mg into a vein, 1 litre 0.9 % saline within the hour, glucose; then 200 mg per 24 hours","Fludrocortisone 0.2 mg by mouth","Dexamethasone 4 mg every 6 hours alone"],a:0,e:"Classic adrenal crisis: hydrocortisone, salt (saline), sugar (glucose), support, search for the trigger (here gastroenteritis). Fludrocortisone is unnecessary while hydrocortisone is high and cannot be swallowed anyway."},
{t:`She recovers in 2 days.`,q:"What matters most before discharge?",o:["Stop fludrocortisone","Review sick-day rules, check the injection kit and steroid emergency card, and train her partner","Halve her usual hydrocortisone"],a:1,e:"Most crises are preventable. Education (sick-day rules, injection kit, emergency card, family training) is the most effective prevention."}],
take:["Vomiting or diarrhoea in Addison disease = high crisis risk; oral tablets fail.","Home: 100 mg hydrocortisone into a muscle + emergency services.","Hospital: hydrocortisone + saline + glucose; then education."]},
{id:"x3",title:"Mini-case 3 (bonus): Fever, purple rash, collapse",steps:[
{t:`<b>The scene:</b> A 19-year-old student has fever, a rapidly spreading purple rash and shock that does not respond to fluids. Blood cultures later grow meningococci. Computed tomography shows bleeding in <b>both</b> adrenal glands (like the left picture on slide 19).`,q:"Which syndrome, and what extra drug does he need besides antibiotics?",o:["Waterhouse–Friderichsen syndrome: hydrocortisone","Cushing syndrome: metyrapone","Conn syndrome: spironolactone"],a:0,e:"Waterhouse–Friderichsen syndrome: bilateral adrenal haemorrhage in severe sepsis causes acute primary adrenal insufficiency. Give stress-dose hydrocortisone along with antibiotics and resuscitation."},
{t:`Read more: [[wfs]]. Bleeding into both adrenals destroys the cortex within hours, so it behaves like a sudden primary insufficiency.${FIG("haem")}`}],
take:["Bilateral adrenal bleeding (sepsis, anticoagulants) → sudden primary adrenal crisis.","Shock not responding to fluids in sepsis → think adrenal and give hydrocortisone.","Imaging matters in non-autoimmune causes: bleeding, metastases, tuberculosis."]}
],
flash:[["Skin colour: primary versus secondary adrenal insufficiency","Primary: dark (very high adrenocorticotropic hormone). Secondary: pale."],
["Which electrolyte separates primary from secondary?","Potassium: high only in primary (aldosterone missing)."],
["Why is sodium low even in secondary insufficiency?","Cortisol lack → more antidiuretic hormone → water retention → dilution."],
["Morning cortisol thresholds (slides)","Above 14 µg/dl: axis intact. Below 3 µg/dl: insufficiency very likely. In between: stimulation test."],
["Short stimulation test","250 µg tetracosactide; cortisol at 0, 30, 60 min; normal peak above 18–20 µg/dl (about 500–550 nmol/L)."],
["Long (depot) stimulation test: three results","No rise = Addison disease; late peak = secondary; normal peak = no insufficiency."],
["Gold standard test of the whole axis","Insulin tolerance test (glucose must fall to 40 mg/dl or lower). Not if basal cortisol is below 3 µg/dl, or in heart disease, epilepsy or hypoglycaemia."],
["Autoimmune polyglandular syndrome type 2 (Schmidt)","Autoimmune adrenal insufficiency (always) + autoimmune thyroid disease and/or type 1 diabetes. Adults, more often women."],
["Autoimmune polyglandular syndrome type 1","Autoimmune regulator gene, childhood: chronic mucocutaneous candidiasis + hypoparathyroidism + Addison disease (at least two)."],
["Adrenal crisis: first steps","Blood (no delay) → hydrocortisone 100 mg into a vein or muscle → 1 litre 0.9 % saline in the first hour → glucose if low → 200 mg per 24 hours → treat the trigger."],
["Chronic replacement in primary insufficiency","Hydrocortisone 15–25 mg per day in 2–3 doses (biggest on waking) + fludrocortisone 0.05–0.2 mg once daily."],
["Sick-day rules","Fever above 38 °C: double. Above 39 °C: triple. Cannot keep tablets down: 100 mg hydrocortisone into a muscle + emergency care."],
["Adrenal insufficiency + hypothyroidism: which first?","Hydrocortisone first, then thyroxine (thyroxine speeds cortisol breakdown and can trigger a crisis)."],
["How do you monitor fludrocortisone?","Blood pressure (lying and standing), sodium, potassium, renin (aim for the upper normal range)."]],
exam:[
"<b>Primary = Pigmented + Potassium high</b> (high adrenocorticotropic hormone, no aldosterone). Secondary = pale, normal potassium, aldosterone intact.",
"Routine labs: low sodium, high potassium, low glucose, low osmolality; sometimes high calcium, raised urea, anaemia, eosinophilia.",
"Morning cortisol: below 3 µg/dl very likely insufficiency; above 14 µg/dl intact. Confirm with the 250 µg short stimulation test (normal peak above 18–20 µg/dl, about 500–550 nmol/L).",
"Adrenocorticotropic hormone high = primary; low or normal = secondary or tertiary. Renin high + aldosterone low = primary.",
"Insulin tolerance test = gold standard for the whole axis, but not first-line for primary, not needed if cortisol is below 3 µg/dl, and dangerous in hypoglycaemia, heart disease or epilepsy.",
"Most common cause of Addison disease in Europe: autoimmune (21-hydroxylase antibodies). Imaging matters less in primary insufficiency.",
"Autoimmune polyglandular syndrome type 2 (Schmidt) = Addison disease (always) + thyroid disease and/or type 1 diabetes. Type 1 = autoimmune regulator gene, candidiasis + hypoparathyroidism + Addison disease.",
"<b>Adrenal crisis: treat before confirming.</b> Hydrocortisone 100 mg, then 200 mg per 24 hours; 1 litre 0.9 % saline in the first hour; glucose; treat the trigger.",
"Chronic: hydrocortisone 15–25 mg per day in 2–3 doses + fludrocortisone 0.05–0.2 mg; sick-day rules (38 °C double, 39 °C triple, vomiting = injection); emergency card; monitor clinically.",
"Start hydrocortisone before thyroxine."],
sources:"Sources: CBL 5 (Prof. Dr. Ionela Pascanu, UMCH 2026), slides 1–35 and the references cited on them (Hahner et al., Nature Reviews Disease Primers 2021; Charmandari et al., Lancet 2014; Michels and Michels, American Family Physician 2014; Ferri; Weiler et al. 2012). Crisis dosing and the slide checks follow the Endocrine Society guideline on primary adrenal insufficiency (Bornstein et al., 2016). M.T.'s values are taken from the slides; the mini-cases are invented teaching examples. Conversions: cortisol µg/dl × 27.59 = nmol/L; glucose mg/dl ÷ 18 = mmol/L.",
hpaPatient:true,casesHead:"🔁 Transfer mini-cases",casesIntro:"Same disease, new patients. Answer to reveal the next part."
});

/* ===== Module 2.2 Adrenal insufficiency – new glossary terms (existing ones are reused) ===== */
Object.assign(GLOSSARY,{
adrinsuf:{l:"adrenal insufficiency",c:"disease",d:"Not enough cortisol (with or without aldosterone) because the adrenal, the pituitary or the hypothalamus fails.",w:"Untreated, it can end in a life-threatening adrenal crisis. Treated, people live normal lives."},
autoadr:{l:"autoimmune adrenalitis",c:"disease",d:"The immune system destroys the adrenal cortex; 21-hydroxylase antibodies are usually positive. The glands look small or normal on imaging.",w:"The most common cause of primary adrenal insufficiency in high-income countries."},
tbadr:{l:"adrenal tuberculosis",c:"disease",d:"Tuberculosis infection of both adrenal glands. Early on the glands are enlarged; later they shrink and often calcify.",w:"Historically the classic cause of Addison disease and still important where tuberculosis is common."},
adrhaem:{l:"adrenal haemorrhage",c:"disease",d:"Bleeding into the adrenal glands; when both sides bleed, acute primary adrenal insufficiency follows.",w:"Think of it in sepsis, in patients on anticoagulants, and in antiphospholipid syndrome. Sudden flank or abdominal pain plus shock."},
anticoag:{l:"anticoagulants",c:"drug",d:"Blood-thinning medicines such as heparin, warfarin or the newer oral anticoagulants.",w:"A known risk factor for bilateral adrenal haemorrhage, especially in sick patients after surgery."},
ald:{l:"adrenoleukodystrophy",c:"disease",d:"X-linked inherited disorder (gene ABCD1): very long chain fatty acids cannot be broken down and damage the adrenal cortex, the brain white matter and the spinal cord.",w:"Consider it in a boy or young man with primary adrenal insufficiency and negative 21-hydroxylase antibodies. Adrenal failure can come before the neurological signs."},
vlcfa:{l:"very long chain fatty acids",c:"test",d:"Fatty acids with a very long carbon chain; measured in blood.",w:"Raised in adrenoleukodystrophy. Guidelines advise measuring them in males with primary insufficiency and negative antibodies."},
cmvadr:{l:"cytomegalovirus adrenalitis",c:"disease",d:"Infection of the adrenal glands by cytomegalovirus, seen mainly in advanced human immunodeficiency virus infection or other severe immune suppression.",w:"Infections (cytomegalovirus, fungi, tuberculosis) are classic causes in immunosuppressed patients."},
adrmets:{l:"adrenal metastases",c:"disease",d:"Cancer spread to the adrenals, typically from lung, breast, kidney or melanoma.",w:"Common, but most of both glands must be destroyed before insufficiency appears, so clinical adrenal failure from metastases is less common."},
sheehan:{l:"Sheehan syndrome",c:"disease",d:"Death (necrosis) of the pituitary after severe bleeding and low blood pressure during or after childbirth.",w:"Classic clue: no breast milk after delivery, then no periods return, fatigue and low sodium. Causes secondary insufficiency."},
hypophysitis:{l:"hypophysitis",c:"disease",d:"Inflammation of the pituitary. It can be autoimmune (lymphocytic, often around pregnancy) or caused by immune checkpoint inhibitor cancer drugs.",w:"Headache plus loss of pituitary hormones. Adrenocorticotropic hormone deficiency is the dangerous one."},
checkpoint:{l:"immune checkpoint inhibitors",c:"drug",d:"Cancer immunotherapy drugs that release the brakes on the immune system, for example ipilimumab, nivolumab and pembrolizumab.",w:"They can cause autoimmune side effects, including hypophysitis (classically with ipilimumab) and, more rarely, primary adrenalitis."},
apoplexy:{l:"pituitary apoplexy",c:"disease",d:"Sudden bleeding into, or infarction of, a pituitary tumour.",w:"Thunderclap headache, visual loss and sudden adrenocorticotropic hormone deficiency: give hydrocortisone urgently."},
opioidai:{l:"opioid-induced adrenal insufficiency",c:"disease",d:"Long-term opioid use can suppress corticotropin-releasing hormone and adrenocorticotropic hormone.",w:"A recognised cause of secondary or tertiary insufficiency. Ask about long-term painkillers."},
cranio:{l:"craniopharyngioma",c:"disease",d:"A benign tumour near the pituitary stalk and hypothalamus, often found in children and young adults.",w:"It and its treatment (surgery, radiotherapy) can cause tertiary and secondary hormone deficiencies."},
cbg:{l:"cortisol-binding globulin",c:"hormone",d:"The blood protein that carries most cortisol (also called transcortin). Laboratories usually measure TOTAL (bound + free) cortisol.",w:"Oestrogen (the pill, pregnancy) raises it and makes total cortisol look higher; critical illness, liver disease or protein loss lower it and make cortisol look lower."},
mettest:{l:"metyrapone test",c:"test",d:"Metyrapone blocks the last step of cortisol synthesis overnight. A healthy pituitary answers with more adrenocorticotropic hormone, so 11-deoxycortisol rises.",w:"An alternative to the insulin tolerance test for checking the hypothalamus and pituitary. Risky if insufficiency is already obvious."},
vitiligo:{l:"vitiligo",c:"disease",d:"Autoimmune loss of skin pigment: white patches.",w:"Next to hyperpigmentation it is a strong hint of autoimmune primary adrenal insufficiency."},
posthypo:{l:"postural hypotension",c:"concept",d:"Blood pressure falls on standing up, causing dizziness or fainting.",w:"Volume loss from missing aldosterone makes it typical of primary insufficiency, though it also occurs in secondary."},
saltcrave:{l:"salt craving",c:"concept",d:"A strong desire for salty food (eating salt from the packet, salty liquorice, pickles).",w:"Specific for primary insufficiency: the body is losing salt because aldosterone is missing."},
inducer:{l:"enzyme inducers",c:"drug",d:"Drugs that speed up liver breakdown of cortisol and other drugs, for example rifampicin, phenytoin, carbamazepine, phenobarbital and St John's wort.",w:"Patients on hydrocortisone may need a higher dose; starting one can tip a patient into crisis."},
inhib:{l:"enzyme inhibitors",c:"drug",d:"Drugs that slow the breakdown of glucocorticoids, for example ritonavir, cobicistat, itraconazole, clarithromycin and grapefruit juice.",w:"Can cause Cushing-like over-replacement. Classic trap: ritonavir plus inhaled fluticasone causes Cushing syndrome and then suppression."},
stressdose:{l:"stress dosing for surgery",c:"concept",d:"Extra glucocorticoid around operations, labour or major illness, given into a vein or muscle when the patient cannot take tablets.",w:"Prevents crisis during the biggest physical stress a patient will face. Follow the local or national protocol."},
bracelet:{l:"medical alert bracelet",c:"concept",d:"A bracelet or necklace stating that the wearer has adrenal insufficiency and needs hydrocortisone.",w:"Speaks for the patient when they are unconscious."},
adrenalectomy:{l:"bilateral adrenalectomy",c:"concept",d:"Surgical removal of both adrenal glands (for example for Cushing disease that cannot be cured otherwise).",w:"Always causes lifelong primary adrenal insufficiency."}
});

/* ===== Module 2.2 Adrenal insufficiency (theory): header + steps 1–4 ===== */
const D2={
meta:"Endocrinology › Adrenal disorders › 2.2 · theory module · ⏱ about 35 minutes in 7 bite-sized steps",
intro:`<p>This is the <b>theory</b> behind adrenal insufficiency, organised the way you will need it on the ward and in exams: what it is, why it happens, how it looks, how to prove it, how to treat the emergency, how to replace for life, and how to keep patients safe. At the end you can practise everything on a real patient in <a onclick="showModule('cbl5')" style="cursor:pointer;color:var(--acc);font-weight:700">CBL 5 (Schmidt syndrome)</a>.</p>`,
goals:[
"Define adrenal insufficiency and place primary, secondary and tertiary on the hormone axis",
"List the main causes of each type, starting with the most common",
"Recognise the symptoms and signs and tell primary from secondary at the bedside",
"Choose and interpret the diagnostic tests in the right order",
"Recognise an adrenal crisis and give the correct emergency treatment",
"Prescribe and monitor long-term replacement, including drug interactions and pregnancy",
"Teach sick-day rules, emergency card, injection kit and surgical stress dosing"],
ladderLabel:"💡 Pearl",ladderId:"b4-ladder",
cards:[
{id:"b1",title:"What is adrenal insufficiency? Three levels of failure",min:4,goal:0,obj:["Define adrenal insufficiency in one sentence","Place primary, secondary and tertiary failure on the hormone axis","Predict what happens to adrenocorticotropic hormone, aldosterone and skin colour at each level"],html:`
<div class="scene"><b>The scene:</b> Three patients on one ward: a woman with dark skin and a craving for salt, a man who stopped his prednisolone tablets last week, and a young woman whose pituitary was damaged after a difficult delivery. All three have low cortisol, but for three different reasons.</div>
<p>[[adrinsuf|Adrenal insufficiency]] means <b>the body does not make enough cortisol</b>. Sometimes aldosterone and adrenal androgens are missing too. Where the problem sits on the [[hpa]] decides which other hormones are affected:</p>
<table><tr><th>Level</th><th>What fails</th><th>Missing</th><th>Adrenocorticotropic hormone</th></tr>
<tr><td>[[pai|Primary]] ([[addison]])</td><td>The adrenal cortex itself</td><td>Cortisol + <b>aldosterone</b> + adrenal androgens</td><td><b>High</b></td></tr>
<tr><td>[[sai|Secondary]]</td><td>Pituitary (not enough adrenocorticotropic hormone)</td><td>Cortisol + adrenal androgens. Aldosterone <b>normal</b></td><td>Low or inappropriately normal</td></tr>
<tr><td>[[tai|Tertiary]]</td><td>Hypothalamus (not enough [[crh]])</td><td>Same as secondary</td><td>Low or inappropriately normal</td></tr></table>
<p>👉 Click the levels and watch the arrows:</p>
<div data-widget="hpa"></div>
<p><b>Why is aldosterone safe in secondary and tertiary failure?</b> Because the zona glomerulosa listens mainly to [[angii]] and potassium (the [[renin]] system), not to adrenocorticotropic hormone. You met this in Module 5.</p>
<div class="hint">💡 <b>"Primary = the factory burns down; secondary = the manager stops calling; tertiary = the boss above the manager stops calling."</b> Only when the factory burns down are all products (including aldosterone) lost, and only then does the manager shout (high adrenocorticotropic hormone → dark skin).</div>`,
recap:["Adrenal insufficiency = not enough cortisol.","Primary: adrenal destroyed → cortisol AND aldosterone low, adrenocorticotropic hormone high.","Secondary (pituitary) and tertiary (hypothalamus): cortisol low, aldosterone normal, adrenocorticotropic hormone low or normal."],
quiz:[{q:"Which level of failure loses aldosterone?",o:["Primary","Secondary","Tertiary"],a:0,e:"Only when the adrenal cortex itself is destroyed is the glomerulosa lost. In secondary and tertiary failure the renin–angiotensin system keeps aldosterone going."},
{q:"In tertiary adrenal insufficiency, which hormone is the FIRST one missing?",o:["Adrenocorticotropic hormone","Corticotropin-releasing hormone","Cortisol"],a:1,e:"Tertiary = the hypothalamus fails to make corticotropin-releasing hormone; adrenocorticotropic hormone and cortisol then fall as a consequence."}]},

{id:"b2",title:"Why does it happen? Causes, most common first",min:5,goal:1,obj:["Name the most common cause of primary insufficiency in high-income countries","Name the most common cause of adrenal insufficiency overall","Sort causes into primary versus secondary/tertiary","Spot the 'hidden' causes: drugs, bleeding, infections, genetics"],html:`
<div class="scene"><b>The scene:</b> Your consultant asks: "Name five causes of Addison disease and three causes of secondary insufficiency, starting with the most common." Here is your answer sheet.</div>
<h3>Primary (the adrenal is destroyed or blocked)</h3>
<table><tr><th>Cause</th><th>Key point</th></tr>
<tr><td><b>[[autoadr]]</b></td><td>Most common cause in high-income countries. [[ab21]] positive; often with other autoimmune diseases ([[aps2]]).</td></tr>
<tr><td>[[tbadr]]</td><td>Classic historical cause; still important where tuberculosis is common. Glands enlarged early, calcified later.</td></tr>
<tr><td>[[adrhaem]]</td><td>Sepsis (meningococcal = [[wfs]]), [[anticoag]], antiphospholipid syndrome.</td></tr>
<tr><td>[[adrmets]]</td><td>Lung, breast, kidney, melanoma. Both glands must be largely destroyed.</td></tr>
<tr><td>Infections in immune suppression</td><td>Human immunodeficiency virus with [[cmvadr]], fungal infections (for example histoplasmosis), tuberculosis.</td></tr>
<tr><td>Genetic</td><td>[[ald]] (boys and young men), [[cah]] (newborns), [[fgd]].</td></tr>
<tr><td>Drugs and surgery</td><td>[[mitotane]] (destroys the cortex), [[ketoconazole]], [[metyrapone]], [[osilodrostat]], [[etomidate]] (block enzymes); [[adrenalectomy]]. [[checkpoint|Checkpoint inhibitors]] rarely cause adrenalitis.</td></tr></table>
<h3>Secondary and tertiary (the signal is missing)</h3>
<table><tr><th>Cause</th><th>Key point</th></tr>
<tr><td><b>[[gcsup]]</b></td><td><b>Most common cause of adrenal insufficiency overall.</b> After stopping (or quickly reducing) long-term glucocorticoids, by any route: tablets, high-dose inhaled, joint injections, potent skin creams.</td></tr>
<tr><td>Pituitary tumours, surgery, radiotherapy</td><td>Large tumours press on normal pituitary; surgery and radiation damage it. [[apoplexy]] = sudden bleed.</td></tr>
<tr><td>[[sheehan]]</td><td>Pituitary necrosis after major bleeding at childbirth.</td></tr>
<tr><td>[[hypophysitis]]</td><td>Autoimmune, or from [[checkpoint]] (classically ipilimumab).</td></tr>
<tr><td>[[opioidai|Long-term opioids]]</td><td>Suppress the axis.</td></tr>
<tr><td>Hypothalamic disease</td><td>[[cranio]], radiotherapy, infiltrative diseases (for example sarcoidosis), trauma.</td></tr></table>
<p>🎮 <b>Sorting game:</b> is it primary or secondary/tertiary?</p>
<div data-widget="sort"></div>
<div class="hint">💡 <b>Primary causes, "ADDISON":</b> <b>A</b>utoimmune, <b>D</b>rugs (mitotane, ketoconazole, etomidate), <b>D</b>eposits (metastases), <b>I</b>nfection (tuberculosis, cytomegalovirus, fungi), <b>S</b>urgery (adrenalectomy), <b>O</b>ozing blood (haemorrhage), i<b>N</b>herited (adrenoleukodystrophy, congenital adrenal hyperplasia).</div>`,
recap:["Primary: autoimmune is most common in high-income countries; also tuberculosis, haemorrhage, metastases, infections, genetic causes, drugs, surgery.","Overall most common: stopping long-term glucocorticoids (secondary/tertiary).","Other secondary/tertiary: pituitary tumours, surgery, radiotherapy, Sheehan syndrome, hypophysitis (including checkpoint inhibitors), opioids."],
quiz:[{q:"What is the most common cause of adrenal insufficiency overall?",o:["Autoimmune adrenalitis","Stopping long-term glucocorticoid therapy","Tuberculosis"],a:1,e:"Glucocorticoids are prescribed to very many people; abrupt stopping after long-term use suppresses the axis. Autoimmune adrenalitis is the most common cause of PRIMARY insufficiency in high-income countries."},
{q:"A 15-year-old boy has primary adrenal insufficiency, negative 21-hydroxylase antibodies and his school grades are falling. Which test next?",o:["Very long chain fatty acids","Thyroid antibodies","Insulin tolerance test"],a:0,e:"Adrenoleukodystrophy (X-linked) affects boys and young men; adrenal failure can precede the brain involvement. Very long chain fatty acids are raised."}]},

{id:"b3",title:"How does it look? Symptoms and signs",min:4,goal:2,obj:["List the common symptoms (most are vague)","Name the three findings that point to PRIMARY insufficiency","Explain the lab pattern behind the symptoms"],html:`
<div class="scene"><b>The scene:</b> A 28-year-old teacher has been tired for months, has lost 6 kg without trying, feels dizzy when she stands up, and admits she has started eating salt straight from the shaker. Her gums have brown patches. Three doctors told her it was stress.</div>
<p>Adrenal insufficiency usually develops slowly and the symptoms are <b>vague</b>, so it is often missed until a crisis. Think of it whenever symptoms do not add up.</p>
<h3>Common to all types (cortisol lack)</h3>
<p>Fatigue and weakness, loss of appetite and weight, nausea, vomiting, abdominal pain, muscle and joint aches, dizziness, low mood, low glucose (especially in children). In women: loss of axillary and pubic hair and lower libido (adrenal androgens).</p>
<h3>Primary versus secondary at the bedside</h3>
<table><tr><th></th><th>[[pai|Primary]]</th><th>[[sai|Secondary / tertiary]]</th></tr>
<tr><td>Skin</td><td><b>[[hyperpig|Dark]]</b>: palm creases, knuckles, scars, gums, inside the cheeks. Sometimes [[vitiligo]]</td><td>Pale</td></tr>
<tr><td>[[saltcrave|Salt craving]]</td><td><b>Yes</b></td><td>No</td></tr>
<tr><td>[[posthypo|Postural hypotension]]</td><td>Marked (salt and water loss)</td><td>Milder</td></tr>
<tr><td>Potassium</td><td><b>[[hyperkal|High]]</b></td><td>Normal</td></tr>
<tr><td>Sodium</td><td>[[hyponat|Low]]</td><td>Normal or low ([[adh]] excess)</td></tr>
<tr><td>Other clues</td><td>Other autoimmune diseases (thyroid, type 1 diabetes, vitiligo)</td><td>Headache, visual field loss, other pituitary hormone deficiencies, history of steroids, pituitary surgery or childbirth bleeding</td></tr></table>
<p><b>Other lab clues:</b> [[hypogly]], mild high calcium, mild anaemia, [[eos]] and more lymphocytes. Thyroid-stimulating hormone can be mildly raised and may normalise once hydrocortisone is started, so recheck it before diagnosing hypothyroidism.</p>
${FIG("hyper")}
<div class="hint">💡 <b>The 3 P's of primary: Pigment, Potassium, Pinch of salt.</b> All three need either high adrenocorticotropic hormone or missing aldosterone, which only happen when the adrenal itself fails.<br>History fact: United States president John F. Kennedy had Addison disease, which was kept largely secret during his lifetime.</div>`,
recap:["Symptoms are vague: fatigue, weight loss, nausea, abdominal pain, dizziness, low glucose.","Primary only: hyperpigmentation, salt craving, high potassium (plus vitiligo as an autoimmune clue).","Low sodium happens in both; thyroid-stimulating hormone may be mildly high and correct with hydrocortisone."],
quiz:[{q:"Which finding is specific for PRIMARY adrenal insufficiency?",o:["Fatigue","Salt craving","Low sodium"],a:1,e:"Salt craving reflects salt loss from missing aldosterone, which happens only in primary insufficiency. Fatigue and low sodium occur in both."},
{q:"Why can sodium be low in secondary insufficiency even though aldosterone is normal?",o:["Cortisol lack lets antidiuretic hormone rise → water retention","Renin is suppressed","Potassium pushes sodium out"],a:0,e:"Cortisol normally restrains antidiuretic hormone. Without cortisol, water is retained and sodium is diluted."}]},

{id:"b4",title:"Proving it: the diagnostic ladder",min:5,goal:3,obj:["Use morning cortisol and adrenocorticotropic hormone as the first step","Know the short stimulation test as the confirmation test","Choose insulin tolerance or metyrapone tests for pituitary questions","Find the cause, and avoid the binding-protein traps"],html:`
<div class="scene"><b>The scene:</b> The salt-craving teacher is stable. Her morning cortisol is borderline. Your registrar asks: "What next, and what could make her cortisol look falsely normal?"</div>
<p>Three questions, in order: <b>1. Is cortisol too low? 2. Where is the failure? 3. What is the cause?</b> Always draw blood <b>before</b> giving hydrocortisone, which is measured as cortisol (prednisolone also cross-reacts in many cortisol tests). But if the patient is unwell, never delay treatment for a test.</p>
<h3>🪜 Climb the ladder (click each rung)</h3>
<p>Tools on the ladder: [[basalcort]], [[renin]], [[sst]] with [[synacthen]], [[itt]], [[mettest]], [[ab21]], [[vlcfa]] and [[ct]].</p>
<div data-widget="ladder"></div>
<h3>Traps</h3>
<table><tr><th>Trap</th><th>Why</th></tr>
<tr><td><b>Oral oestrogen</b> (the pill, hormone replacement) and <b>pregnancy</b></td><td>Raise [[cbg]], so total cortisol looks higher and can hide insufficiency.</td></tr>
<tr><td>Critical illness, liver cirrhosis, nephrotic syndrome</td><td>Low binding proteins, so total cortisol looks lower than the active (free) cortisol really is.</td></tr>
<tr><td>Recent pituitary damage (the first weeks after pituitary surgery or apoplexy)</td><td>The adrenal has not shrunk yet, so it can still answer the short stimulation test: a falsely normal result.</td></tr>
<tr><td>Patient already on glucocorticoids</td><td>Hydrocortisone and prednisolone interfere with the cortisol result; dexamethasone does not, but it suppresses the axis.</td></tr></table>
<div class="hint">💡 <b>"Cortisol, Commander, Confirm, Cause":</b> measure Cortisol, check the Commander (adrenocorticotropic hormone), Confirm with the stimulation test, then find the Cause (antibodies, very long chain fatty acids, computed tomography).</div>
<div class="corr">📝 <b>Threshold check:</b> cortisol cut-offs depend on the laboratory method. Newer, more specific cortisol assays give lower values, so their "normal response" thresholds are lower than the classic 18–20 µg/dl (500–550 nmol/L). Always use the cut-offs of the laboratory that measured the sample. Conversion: µg/dl × 27.59 = nmol/L.</div>`,
recap:["Morning cortisol + adrenocorticotropic hormone first; renin and aldosterone for mineralocorticoid status.","Short stimulation test (250 µg tetracosactide) confirms; insulin tolerance or metyrapone tests check the pituitary when needed.","Cause: 21-hydroxylase antibodies → very long chain fatty acids in males if negative → adrenal computed tomography. Oestrogen raises cortisol-binding globulin and can hide insufficiency."],
quiz:[{q:"A woman on the combined oral contraceptive pill has a 'normal' morning cortisol but typical symptoms and dark skin. Why might the result mislead you?",o:["Oestrogen raises cortisol-binding globulin, so total cortisol looks higher","The pill lowers adrenocorticotropic hormone","The pill destroys cortisol in the sample"],a:0,e:"Laboratories measure total cortisol. More binding protein means more total cortisol even when free (active) cortisol is low. Do a stimulation test and interpret it with care."},
{q:"Two weeks after pituitary surgery, a patient's short stimulation test is normal. Can you exclude secondary insufficiency?",o:["Yes, the test is always reliable","No: the adrenal has not shrunk yet, so the test can be falsely normal early on","Yes, if sodium is normal"],a:1,e:"After sudden loss of adrenocorticotropic hormone, the adrenal still responds to synthetic hormone for some weeks. Use morning cortisol, clinical judgement and, if needed, a later retest."}]}
]};

/* ===== Module 2.2: steps 5–7 ===== */
D2.cards.push(
{id:"b5",title:"Adrenal crisis: recognise it, treat it now",min:4,goal:4,obj:["Recognise the picture and the usual triggers of an adrenal crisis","Give hydrocortisone, saline and glucose in the right doses","Know why you never wait for the cortisol result"],html:`
<div class="scene"><b>The scene:</b> 2 a.m. A man with known Addison disease arrives after a day of vomiting and diarrhoea. He is confused, blood pressure 75/40 mmHg, sodium 127 mmol/L, potassium 6.0 mmol/L, glucose 3.0 mmol/L. The night laboratory cannot run cortisol until morning.</div>
<p>An [[crisis]] is a medical emergency: <b>shock</b> (often not responding to fluids alone), vomiting, abdominal pain (it can mimic an acute abdomen), fever, confusion or reduced consciousness, plus low sodium, high potassium (primary) and low glucose.</p>
<p><b>Typical triggers:</b> infections (especially gastroenteritis, because tablets are vomited), surgery or trauma, missed or stopped tablets, starting thyroxine before hydrocortisone, and starting [[inducer|enzyme-inducing drugs]]. It can also be the first presentation of undiagnosed insufficiency, or of [[adrhaem]].</p>
<p>👉 Click through the emergency flow:</p>
${FIG("crisis")}
<div data-widget="crisis"></div>
<p><b>The golden rule (Endocrine Society guideline, 2016):</b> if you suspect it, <b>take blood for cortisol and adrenocorticotropic hormone if it costs no time, then give [[hydrocortisone]] immediately.</b> A missed crisis can kill; one unnecessary dose of hydrocortisone almost never harms.</p>
<table><tr><th>Treatment</th><th>Dose (adults)</th></tr>
<tr><td>Hydrocortisone</td><td><b>100 mg</b> into a vein (or into a muscle) immediately, then <b>200 mg per 24 hours</b> (50 mg every 6 hours or as a continuous infusion)</td></tr>
<tr><td>Fluid</td><td><b>1 litre of 0.9 % saline within the first hour</b>, then guided by circulation, urine output and electrolytes</td></tr>
<tr><td>Glucose</td><td>If glucose is low (dextrose)</td></tr>
<tr><td>Trigger</td><td>Find and treat it (for example antibiotics for infection)</td></tr>
<tr><td>Later</td><td>Taper to oral doses over 1–3 days once the trigger has resolved; add [[fludro]] in primary insufficiency when hydrocortisone is below 50 mg per day</td></tr></table>
<p>High-dose hydrocortisone also acts on the mineralocorticoid receptor, which is why it beats [[dexa]] (no salt-retaining effect) in crisis.</p>
<div class="hint">💡 <b>The 5 S:</b> Salt (saline), Sugar (glucose), Steroid (hydrocortisone), Support (monitoring, intensive care), Search for the trigger.</div>`,
recap:["Crisis: shock, vomiting, abdominal pain, confusion; low sodium, high potassium, low glucose. Common trigger: gastroenteritis.","Draw cortisol and adrenocorticotropic hormone if it costs no time, but never wait: hydrocortisone 100 mg now, then 200 mg per 24 hours.","1 litre 0.9 % saline in the first hour, glucose if low, treat the trigger, taper over 1–3 days."],
quiz:[{q:"The cortisol result will take 8 hours. The patient is in shock. What do you do?",o:["Wait for the result to avoid giving unnecessary steroids","Draw the blood, then give hydrocortisone 100 mg into a vein and start saline now","Give fludrocortisone"],a:1,e:"Adrenal crisis is lethal and the treatment is safe. Treat first, confirm later."},
{q:"Which drug started in a patient with Addison disease can trigger a crisis by speeding up cortisol breakdown?",o:["Rifampicin","Paracetamol","Omeprazole"],a:0,e:"Rifampicin is a strong enzyme inducer: the hydrocortisone is broken down faster, so the dose usually needs to go up."}]},

{id:"b6",title:"Living with it: long-term replacement",min:5,goal:5,obj:["Prescribe physiological glucocorticoid replacement","Know who needs fludrocortisone (and who does not)","Monitor clinically, not with cortisol levels","Handle drug interactions and pregnancy"],html:`
<div class="scene"><b>The scene:</b> The salt-craving teacher is diagnosed with autoimmune Addison disease. She asks: "How many tablets, when, and how will we know the dose is right?"</div>
<h3>Glucocorticoid (everyone)</h3>
<p>[[hydrocortisone|Hydrocortisone]] <b>15–25 mg per day in 2–3 doses</b>, the largest dose on waking (mimicking the natural morning peak), the last dose no later than mid-afternoon. An alternative is [[pred|prednisolone]] 3–5 mg once daily. [[dexa|Dexamethasone]] is not recommended for routine replacement (long-acting, hard to fine-tune, Cushing-like side effects). (Endocrine Society guideline, 2016.)</p>
<h3>Mineralocorticoid (primary only)</h3>
<p>[[fludro|Fludrocortisone]] <b>50–200 µg once daily</b> (often starting at 50–100 µg). No salt restriction. More may be needed in hot weather (salt lost in sweat). <b>Not needed in secondary or tertiary insufficiency</b>, because aldosterone is intact.</p>
<h3>Androgen (optional, women)</h3>
<p>[[dhea|Dehydroepiandrosterone]] 25–50 mg daily may be tried in women with low libido, low mood or low energy despite otherwise good replacement; stop it if there is no benefit.</p>
<h3>Monitoring: clinical, not laboratory cortisol</h3>
<table><tr><th>Hydrocortisone</th><th>Fludrocortisone</th></tr>
<tr><td><b>Too little:</b> fatigue, nausea, weight loss, low blood pressure, pigmentation returning<br><b>Too much:</b> weight gain, high blood pressure, high glucose, Cushing-like features, bone loss<br>Cortisol day curves and adrenocorticotropic hormone are <b>not</b> used routinely to set the dose</td>
<td>Blood pressure lying and standing, sodium, potassium, [[renin]] (aim for the upper normal range)<br><b>Too little:</b> salt craving, postural dizziness, high potassium, high renin<br><b>Too much:</b> high blood pressure, swelling, low potassium, suppressed renin</td></tr></table>
<h3>Drug interactions</h3>
<p>• [[inducer]] (rifampicin, phenytoin, carbamazepine, phenobarbital, St John's wort) → faster breakdown → <b>higher</b> hydrocortisone dose needed.<br>
• [[inhib]] (ritonavir, cobicistat, itraconazole, clarithromycin, grapefruit juice) → slower breakdown → risk of <b>over-replacement</b>.</p>
<h3>Pregnancy</h3>
<p>Continue replacement and monitor clinically; many guidelines suggest a modest hydrocortisone increase in the third trimester, and stress doses at delivery (as for major surgery). Use hydrocortisone or prednisolone rather than dexamethasone, because the placenta inactivates hydrocortisone and prednisolone ([[hsd11b2]], Module 5) but not dexamethasone, which therefore reaches the baby. Renin rises normally in pregnancy, so it is not useful for monitoring fludrocortisone then.</p>
<div class="hint">💡 <b>"Hydro for all, Fludro for the Primary only."</b> And: <b>"Treat the patient, not the cortisol level."</b></div>`,
recap:["Hydrocortisone 15–25 mg per day in 2–3 doses (biggest on waking); prednisolone 3–5 mg is an alternative; avoid dexamethasone.","Fludrocortisone 50–200 µg per day in PRIMARY only; monitor blood pressure, potassium, sodium and renin. Dehydroepiandrosterone is optional for women.","Monitor clinically, not by cortisol levels. Enzyme inducers raise dose needs; ritonavir-type inhibitors cause over-replacement; in pregnancy avoid dexamethasone."],
quiz:[{q:"A man with secondary adrenal insufficiency after pituitary surgery asks whether he needs fludrocortisone. Answer?",o:["Yes, always","No: aldosterone is still controlled by the renin–angiotensin system","Only in winter"],a:1,e:"Secondary insufficiency spares the glomerulosa. Fludrocortisone is for primary insufficiency."},
{q:"How should hydrocortisone replacement mainly be adjusted?",o:["By symptoms, signs, weight, blood pressure and glucose","By measuring adrenocorticotropic hormone every morning","By keeping cortisol in the normal range on a day curve"],a:0,e:"Guidelines recommend clinical assessment. Adrenocorticotropic hormone is high before the morning dose in primary insufficiency anyway, and cortisol levels after tablets are hard to interpret."},
{q:"Why is dexamethasone avoided as replacement in pregnancy?",o:["The placenta does not inactivate it, so it reaches the baby","It is not absorbed in pregnancy","It raises renin"],a:0,e:"Placental 11-beta-hydroxysteroid dehydrogenase type 2 inactivates cortisol (hydrocortisone) and largely prednisolone, but not dexamethasone."}]},

{id:"b7",title:"Staying safe: sick-day rules, card, kit, surgery",min:4,goal:6,obj:["Teach the sick-day rules","Explain the steroid emergency card and the injection kit","Give stress doses for surgery and labour","Make the patient and family the first responders"],html:`
<div class="scene"><b>The scene:</b> Before discharge, the teacher's partner asks: "If she ever collapses or keeps vomiting, what exactly do I do?" This conversation prevents crises.</div>
<h3>⚠️ [[sickday|Sick-day rules]] (Endocrine Society guideline 2016; United Kingdom Society for Endocrinology guidance)</h3>
<table><tr><th>Situation</th><th>Action</th></tr>
<tr><td>Fever above 38 °C, or illness needing bed rest</td><td><b>Double</b> the daily hydrocortisone dose</td></tr>
<tr><td>Fever above 39 °C</td><td><b>Triple</b> the daily dose</td></tr>
<tr><td>Vomiting, diarrhoea, cannot keep tablets down, collapse</td><td><b>100 mg hydrocortisone into a muscle</b> immediately and go to hospital</td></tr></table>
<p>Continue extra doses until recovered (usually a few days), then return to the normal dose. Fludrocortisone is not doubled.</p>
<h3>Always carry, always know</h3>
<p>• A [[card]] (in Germany a "Notfallausweis") and a [[bracelet]].<br>
• A [[kit]] at home, at work and when travelling, plus spare tablets.<br>
• Patient <b>and family</b> trained to give the injection (into the outer thigh muscle).<br>
• Never stop glucocorticoids suddenly.</p>
${FIG("sickday")}
<h3>[[stressdose|Surgery, labour and procedures]] (typical approach; follow the local protocol)</h3>
<table><tr><th>Situation</th><th>Approach</th></tr>
<tr><td>Major surgery, labour, intensive care</td><td>Hydrocortisone 100 mg into a vein or muscle at the start, then 200 mg per 24 hours until eating and drinking, then about double the usual oral dose for a few days before returning to normal</td></tr>
<tr><td>Minor procedures (for example dental work, endoscopy)</td><td>Extra oral dose or double dose on the day</td></tr></table>
<p><b>Who else needs these rules?</b> Anyone with secondary insufficiency, and anyone on long-term glucocorticoid therapy whose axis may be suppressed ([[gcsup]]). Steroid therapy is covered in module 2.9.</p>
<div class="hint">💡 <b>"38 double, 39 triple, vomit = needle."</b> And: <b>"Card, kit, family, never stop."</b></div>
<div class="exam" style="border-color:var(--ok)"><b>🏥 Practise this on a real case</b><br>Ready to apply it? Work through M.T., a 53-year-old woman with abdominal pain, low blood pressure and low sodium, in CBL 5.<br><button class="pri" style="margin-top:8px" onclick="showModule('cbl5')">→ Open CBL 5: Schmidt syndrome</button></div>`,
recap:["Above 38 °C double, above 39 °C triple, vomiting → 100 mg hydrocortisone into a muscle + hospital.","Steroid emergency card, alert bracelet, injection kit, trained family, never stop tablets.","Surgery and labour: 100 mg at the start, then 200 mg per 24 hours, then about double oral dose for a few days."],
quiz:[{q:"Fever 38.4 °C, eating and drinking, usual dose hydrocortisone 20 mg per day. New daily dose?",o:["20 mg","40 mg","100 mg into a muscle"],a:1,e:"Fever above 38 °C → double the daily dose while tablets stay down."},
{q:"Which statement about fludrocortisone on sick days is correct?",o:["Double it like hydrocortisone","It is usually not changed; high-dose hydrocortisone already has mineralocorticoid effect","Stop it"],a:1,e:"Sick-day rules apply to the glucocorticoid. High hydrocortisone doses add mineralocorticoid action."}]}
);
