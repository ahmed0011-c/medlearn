/* ===== Lecture 7 subsection 9: glucocorticoid actions, therapy, side effects – header + steps 1–3 ===== */
const M9={
meta:"Endocrinology › Lecture 7 › Subsection 9 · lecture pages 27–29 · ⏱ about 30 minutes in 6 bite-sized steps",
intro:`<p>Glucocorticoids are among the most prescribed drugs in medicine, and among those with the most side effects. This module goes from the receptor inside the cell, through the body-wide actions of cortisol, to choosing the right steroid, preventing side effects, recognising Cushing syndrome from medicines, and stopping safely.</p>`,
goals:[
"Explain how glucocorticoids change gene activity inside the cell",
"List the main body-wide actions of cortisol and link each one to a side effect",
"Choose the right steroid using potency, salt-retaining effect and duration",
"Recall the side effects with a mnemonic and know how to prevent them",
"Recognise Cushing syndrome caused by steroid medicines and explain axis suppression",
"Taper and stop steroids safely and recognise withdrawal problems"],
cards:[

{id:"g1",title:"Inside the cell: the glucocorticoid receptor",min:4,goal:0,obj:["Follow the receptor from cytoplasm to DNA","Tell transactivation from transrepression","Explain why the effect takes hours"],html:`
<div class="scene"><b>The scene:</b> A patient with a severe asthma attack asks: "The doctor said the prednisolone needs a few hours to work. Why not instantly, like my blue reliever inhaler?"</div>
<p>👉 Step through what happens inside the cell:</p>
<div data-widget="grcell"></div>
<ol><li>The fat-soluble steroid crosses the cell membrane.</li>
<li>In the cytoplasm it binds the [[gr]], which is held by [[hsp]]. Binding releases them.</li>
<li>The activated receptor moves into the nucleus and binds [[gre]] on DNA.</li>
<li>[[transact]]: genes switched ON, for example [[annexin]] (anti-inflammatory) and liver enzymes of [[gneo]] (side effect: high glucose).</li>
<li>[[transrep]]: the receptor blocks [[nfkb]] and [[ap1]] → fewer cytokines, adhesion molecules and cyclo-oxygenase 2 → less inflammation.</li></ol>
<p><b>Why hours?</b> New messenger RNA and proteins have to be made (genomic effects, slide 27). Very high doses (for example intravenous methylprednisolone pulses) also have faster non-genomic effects on cell membranes, but the main benefit still needs hours. That is why the asthma attack needs the bronchodilator <b>now</b> and the steroid for the <b>next hours and days</b>.</p>
<div class="hint">💡 <b>"Turn ON the calming genes, turn OFF the shouting genes."</b> And it takes hours, because the cell has to build new proteins.</div>
<details class="chk"><summary>✋ Checkpoint: which mechanism gives most of the wanted anti-inflammatory effect?</summary><p>Transrepression: blocking nuclear factor kappa B and activator protein 1. Many metabolic side effects come from transactivation.</p></details>`,
recap:["Steroid enters the cell → binds the glucocorticoid receptor → heat-shock proteins released → receptor enters nucleus.","Binds glucocorticoid response elements: transactivation (genes on) and transrepression (blocks nuclear factor kappa B, activator protein 1).","Genomic effects take hours."],
quiz:[{q:"Where is the unbound glucocorticoid receptor mainly found?",o:["In the cell membrane","In the cytoplasm, held by heat-shock proteins","In the mitochondria"],a:1,e:"The receptor waits in the cytoplasm bound to heat-shock proteins; hormone binding releases them so it can enter the nucleus."},
{q:"Blocking nuclear factor kappa B by the glucocorticoid receptor is called…",o:["Transactivation","Transrepression","Down-regulation of the receptor"],a:1,e:"Transrepression: the receptor interferes with inflammatory transcription factors and switches inflammatory genes off."}]},

{id:"g2",title:"What cortisol does around the body",min:5,goal:1,obj:["List the actions of cortisol by organ system","Link each action to a side effect of excess and a sign of deficiency"],html:`
<div class="scene"><b>The scene:</b> The hormone that keeps you alive in a crisis gives, in excess, the round face, thin skin and fragile bones. Every side effect is a normal action turned up too high for too long.</div>
<p>👉 Click each organ system: <b>normal action</b> → <b>too much</b> → <b>too little</b>.</p>
<div data-widget="actions"></div>
<p>The lecture groups them as metabolism, cardiovascular system, immune system and central nervous system (slide 28). Add <b>bone, skin and muscle, eye, salt and water, and the fetal lung</b> to see where most side effects come from.</p>
<div class="hint">💡 <b>"Side effect = normal action × too much × too long."</b> If you know what cortisol does, you can predict every side effect without memorising a list.</div>
<details class="chk"><summary>✋ Checkpoint: why does a patient on high-dose steroids have a HIGH neutrophil count but LOW eosinophils?</summary><p>Cortisol releases neutrophils from the vessel wall and bone marrow into the blood, and pushes eosinophils and lymphocytes out of the blood. It is not a sign of infection by itself.</p></details>`,
recap:["Metabolism: gluconeogenesis, insulin resistance, protein breakdown, fat redistribution.","Circulation: permissive effect on catecholamines; immune: anti-inflammatory, fewer lymphocytes and eosinophils.","Bone: fewer bone-building cells, less calcium absorption; brain: mood and sleep; fetal lung maturation."],
quiz:[{q:"Which action of cortisol explains steroid-induced diabetes?",o:["More gluconeogenesis and insulin resistance","More insulin secretion","Less glucose absorption"],a:0,e:"Cortisol makes the liver produce glucose and makes muscle and fat less sensitive to insulin."},
{q:"Which blood count change is typical on high-dose glucocorticoids?",o:["High eosinophils","High neutrophils, low lymphocytes and eosinophils","Low neutrophils"],a:1,e:"Neutrophils are released into the blood; lymphocytes and eosinophils fall. Eosinophilia is a clue to cortisol deficiency."}]},

{id:"g3",title:"Choosing a steroid: potency, salt effect and duration",min:5,goal:2,obj:["Read a steroid potency table","Convert between equivalent doses","Match the steroid to the clinical job"],html:`
<div class="scene"><b>The scene:</b> Ward round. A woman with Addison disease. A man with brain metastases and swelling around them. A flare of rheumatoid arthritis. A pregnancy at 29 weeks with threatened preterm labour. Four patients, four different steroids.</div>
<p>👉 Compare the drugs, then try the dose converter:</p>
<div data-widget="potency"></div>
<table><tr><th>Job</th><th>Usual choice</th><th>Why</th></tr>
<tr><td>Replacement in adrenal insufficiency</td><td>[[hydrocortisone]] (+ [[fludro]] in primary)</td><td>Identical to natural cortisol; short-acting, so it can mimic the rhythm</td></tr>
<tr><td>Most anti-inflammatory courses by mouth</td><td>[[pred]] (or [[prednisone]])</td><td>Intermediate action, little salt effect, once in the morning; largely inactivated by the placenta</td></tr>
<tr><td>Severe flares, intravenous pulses</td><td>[[mpred]]</td><td>High potency, low salt effect</td></tr>
<tr><td>Brain swelling around tumours, nausea with chemotherapy, severe coronavirus disease 2019 (COVID-19) needing oxygen</td><td>[[dexa]]</td><td>Very potent, long-acting, <b>no</b> salt retention</td></tr>
<tr><td>Fetal lung maturation before preterm birth</td><td>Dexamethasone or [[betameth]] (given to the mother)</td><td>Cross the placenta (Module 7)</td></tr></table>
<p><b>Route matters:</b> inhaled, nasal, skin, eye and joint steroids act mostly locally, but high doses, large skin areas or interacting drugs (ritonavir) can still cause systemic effects and axis suppression.</p>
<div class="hint">💡 <b>"Hydrocortisone replaces, prednisolone calms, methylprednisolone hammers, dexamethasone goes to the brain and to the baby."</b></div>
<details class="chk"><summary>✋ Checkpoint: why is dexamethasone a poor choice for Addison disease replacement?</summary><p>It has no salt-retaining (mineralocorticoid) effect, and its long action cannot mimic the daily rhythm, so it easily causes over-replacement and Cushing features. Guidelines advise against it.</p></details>`,
recap:["Equivalent doses: hydrocortisone 20 mg ≈ prednisolone 5 mg ≈ methylprednisolone 4 mg ≈ dexamethasone 0.75 mg.","Salt effect: hydrocortisone > prednisolone > methylprednisolone; dexamethasone none; fludrocortisone mainly salt.","Duration: hydrocortisone short, prednisolone and methylprednisolone intermediate, dexamethasone long."],
quiz:[{q:"Prednisolone 5 mg has about the same glucocorticoid effect as…",o:["Hydrocortisone 5 mg","Hydrocortisone 20 mg","Dexamethasone 5 mg"],a:1,e:"Prednisolone is about 4 times as potent as hydrocortisone: 5 mg ≈ 20 mg hydrocortisone ≈ 0.75 mg dexamethasone."},
{q:"Which steroid has essentially no mineralocorticoid (salt-retaining) effect?",o:["Hydrocortisone","Fludrocortisone","Dexamethasone"],a:2,e:"Dexamethasone is a pure glucocorticoid, which is why it is used for brain swelling but not for mineralocorticoid replacement."}]}
]};

/* ===== Subsection 9: steps 4–6 ===== */
M9.cards.push(
{id:"g4",title:"Side effects: the CUSHINGOID checklist",min:5,goal:3,obj:["Recall the main side effects with one word","Name the prevention or monitoring step for each","Know which side effects need urgent action"],html:`
<div class="scene"><b>The scene:</b> Your patient with polymyalgia rheumatica starts prednisolone 15 mg daily and asks: "What exactly could these tablets do to me, and what can we do about it?"</div>
<p>👉 Click each letter of <b>CUSHINGOID</b>:</p>
<div data-widget="mnemonic"></div>
<p><b>Also remember:</b> [[myop]] (difficulty standing from a chair), slowed growth in children, fluid retention, acne and easy bruising. Risk rises with <b>dose and duration</b>. Some effects appear within days (high glucose, mood, sleep), others over months (bone, eyes, skin).</p>
<p><b>The three general rules:</b> lowest effective dose for the shortest time; give it in the morning; add a [[spare|steroid-sparing drug]] (for example [[mtx]]) when long treatment is expected.</p>
<div class="corr">📝 <b>Slide check (page 29):</b> the side-effect list on the slide is correct but incomplete. Add <b>avascular necrosis of bone</b>, <b>proximal myopathy</b>, <b>growth suppression in children</b> and <b>peptic ulcer risk</b> (mainly together with non-steroidal anti-inflammatory painkillers). Bone protection (United Kingdom National Osteoporosis Guideline Group): prednisolone 7.5 mg or more a day for 3 months or more in women after the menopause and in men aged 50 or over; lower thresholds with a previous fracture, age 70 or over, or a high fracture-risk score. Start it <b>alongside the steroid</b>, without waiting for a bone density scan. Younger patients: decided case by case.</div>
<div class="hint">💡 <b>CUSHINGOID</b> = Cataracts, Ulcers, Skin, Hypertension, Infections, Necrosis of bone, Glucose, Osteoporosis, Insomnia and mood, Diminished own cortisol.</div>
<details class="chk"><summary>✋ Checkpoint: a patient on prednisolone for 4 months develops new groin pain when walking. What must you exclude?</summary><p>Avascular necrosis of the femoral head (and an osteoporotic fracture): arrange imaging, ideally magnetic resonance imaging.</p></details>`,
recap:["CUSHINGOID: cataracts, ulcers, skin, hypertension, infections, necrosis of bone, glucose, osteoporosis, insomnia/mood, diminished own cortisol.","Plus proximal myopathy and growth suppression in children.","Prevent: lowest dose, morning dosing, steroid-sparing drugs, bone protection, glucose and blood pressure checks, steroid card."],
quiz:[{q:"Which side effect typically shows as afternoon or evening high glucose in a patient taking prednisolone in the morning?",o:["Steroid-induced hyperglycaemia","Avascular necrosis","Cataract"],a:0,e:"Morning prednisolone acts most strongly over the following hours, so glucose peaks in the afternoon and evening."},
{q:"Which prevention step fits a 70-year-old woman starting prednisolone for at least 6 months?",o:["Bone protection (calcium, vitamin D and usually a bisphosphonate)","Stop the steroid every weekend","Give it at bedtime"],a:0,e:"Glucocorticoid-induced osteoporosis starts early and fracture risk rises within months; older patients on long courses usually need bone protection."}]},

{id:"g5",title:"Cushing syndrome from medicines and the suppressed axis",min:4,goal:4,obj:["Recognise exogenous Cushing syndrome","Explain why the patient's own axis is switched off","Know who is at risk of adrenal insufficiency"],html:`
<div class="scene"><b>The scene:</b> A 66-year-old woman has taken prednisolone 10 mg daily for 14 months for polymyalgia rheumatica. She now has a round red face, thin bruised skin, a vertebral fracture and high glucose.</div>
<p>[[iatro]] is the <b>most common cause</b> of Cushing syndrome. It can come from tablets, injections into joints, potent skin creams over large areas, and inhalers, especially with [[ritonavir]] (Module 7).</p>
<p><b>The two faces of the same patient:</b></p>
<ul><li><b>Outside:</b> too much glucocorticoid → Cushing features.</li>
<li><b>Inside:</b> [[negfb]] has switched off corticotropin-releasing hormone and adrenocorticotropic hormone for months → the zona fasciculata and reticularis have <b>shrunk</b>: [[gcsup]]. Her own adrenal cannot respond to stress or to sudden stopping.</li></ul>
<p><b>Who is at risk?</b> Anyone on more than a [[physdose]] for more than about <b>4 weeks</b>; also repeated short courses, evening doses, long-acting steroids (dexamethasone), and high-dose inhaled steroids. These patients should carry a [[card]] and follow [[sickday]] (the National Health Service England safety alert of 2020 gives the steroid emergency card to people on prednisolone 5 mg or more a day, or equivalent, for at least 4 weeks). A course shorter than about 3 weeks can usually be stopped without tapering, unless other risks apply.</p>
<p><b>Lab trap:</b> prednisolone cross-reacts with many cortisol immunoassays, while dexamethasone does not. Testing her own axis means measuring cortisol in the morning: take it <b>before</b> that day's dose and at least 24 hours after the last hydrocortisone dose (longer after longer-acting steroids such as prednisolone or dexamethasone).</p>
<div class="hint">💡 <b>"Cushing outside, Addison inside."</b> She looks like too much cortisol, but her own adrenal is asleep. Never stop suddenly.</div>
<details class="chk"><summary>✋ Checkpoint: is aldosterone affected by axis suppression from prednisolone?</summary><p>Usually not: the glomerulosa is driven by angiotensin II and potassium. So potassium is usually normal if she becomes adrenally insufficient.</p></details>`,
recap:["Steroid medicines are the most common cause of Cushing syndrome.","They suppress corticotropin-releasing hormone and adrenocorticotropic hormone; the inner cortex atrophies.","Risk: above physiological dose for more than about 4 weeks → steroid card, sick-day rules, no sudden stop."],
quiz:[{q:"What is the most common cause of Cushing syndrome?",o:["Pituitary adenoma","Glucocorticoid medicines","Adrenal carcinoma"],a:1,e:"Exogenous (medicine-induced) Cushing syndrome is far more common than all endogenous causes together."},
{q:"A patient on prednisolone 10 mg for a year becomes adrenally insufficient after stopping abruptly. Typical potassium?",o:["High, as in Addison disease","Usually normal","Very low"],a:1,e:"Suppression affects the hypothalamus–pituitary–fasciculata axis; aldosterone (renin–angiotensin) is preserved, so potassium is usually normal."}]},

{id:"g6",title:"Coming off: tapering, withdrawal and recovery of the axis",min:5,goal:5,obj:["Give two reasons to taper","Tell disease flare, adrenal insufficiency and withdrawal syndrome apart","Interpret a morning cortisol during the taper"],html:`
<div class="scene"><b>The scene:</b> Your polymyalgia patient feels well and wants to stop prednisolone tomorrow. "Why do I have to come down so slowly?"</div>
<p><b>Two reasons to taper:</b> (1) the disease may flare; (2) the suppressed axis needs time to wake up (weeks to months, sometimes longer).</p>
<p><b>Three problems when the dose comes down:</b></p>
<table><tr><th>Problem</th><th>Clues</th></tr>
<tr><td>Disease flare</td><td>Symptoms of the original disease return (for example shoulder and hip girdle pain, raised inflammatory markers)</td></tr>
<tr><td>Adrenal insufficiency</td><td>Fatigue, nausea, dizziness on standing, low blood pressure, low sodium, low glucose; danger of crisis with illness</td></tr>
<tr><td>[[gws]]</td><td>Fatigue, aches, low mood, poor appetite, although cortisol is adequate; improves over weeks</td></tr></table>
<p>👉 Walk through a taper:</p>
<div data-widget="taper"></div>
<p><b>The approach</b> (European Society of Endocrinology and Endocrine Society guideline on glucocorticoid-induced adrenal insufficiency, 2024): taper as fast as the disease allows while the dose is high; slow down near the physiological dose (prednisolone about 4–5 mg per day); then either keep tapering slowly or check a morning cortisol. Take the blood in the morning <b>before</b> that day's dose and at least 24 hours after the last hydrocortisone dose (longer after longer-acting steroids such as prednisolone or dexamethasone). Results (Beuschlein and colleagues, 2024): <b>above about 300 nmol/L</b> = recovered, the steroid can be stopped; <b>about 150–300 nmol/L</b> = keep the physiological dose and retest in weeks to months; <b>below about 150 nmol/L</b> = keep the physiological dose and retest in a few months. The cut-offs depend on the laboratory method. Keep the steroid card and stress dosing until recovery is shown.</p>
<div class="hint">💡 <b>"Fast down the steep part of the mountain, slow on the last steps to the valley."</b> High doses can come down quickly; the last few milligrams need patience.</div>
<details class="chk"><summary>✋ Checkpoint: during the taper, her morning cortisol (taken before the dose) is about 400 nmol/L. What does that suggest?</summary><p>Above about 300 nmol/L (10 µg/dl) suggests that the axis has recovered, and the steroid can usually be stopped (follow the guideline and the specialist's plan).</p></details>`,
recap:["Taper to prevent flare and to let the axis recover.","Coming down: think flare versus adrenal insufficiency versus withdrawal syndrome.","Near the physiological dose: slow taper or morning cortisol (above about 300 nmol/L = recovered; 150–300 = retest in weeks to months; below about 150 nmol/L = retest in a few months). Blood before that day's dose, at least 24 hours after the last hydrocortisone dose."],
quiz:[{q:"A patient tapering from prednisolone 30 mg to 7.5 mg feels tired and achy, with normal blood pressure, sodium and inflammatory markers. Most likely?",o:["Glucocorticoid withdrawal syndrome","Adrenal crisis","Disease flare"],a:0,e:"The dose is still above physiological replacement, the disease markers are quiet and the electrolytes are normal: tissues are adapting to the lower dose."},
{q:"Which statement about tapering is correct?",o:["All steroid courses must be tapered","Courses shorter than about 3 weeks can usually be stopped without tapering","Taper fastest near the physiological dose"],a:1,e:"Short courses rarely suppress the axis enough to matter (unless other risks apply). The slowest part of a long taper is near the physiological dose."}]}
);

{id:"r1",title:"Case 1: Polymyalgia, prednisolone and a broken vertebra",steps:[
{t:`<b>The scene:</b> A 66-year-old woman has taken prednisolone 10 mg daily for 14 months for polymyalgia rheumatica. She has a round red face, bruises on her forearms, thin skin, new diabetes and sudden back pain after lifting a shopping bag. An X-ray shows a vertebral compression fracture.`,q:"What is the cause of her Cushing features?",o:["A pituitary adenoma","Her prednisolone (exogenous Cushing syndrome)","An adrenal carcinoma"],a:1,e:"Long-term supraphysiological prednisolone is by far the most common cause of Cushing syndrome."},
{t:`A colleague suggests a dexamethasone suppression test to "confirm Cushing syndrome".`,q:"Is that useful?",o:["Yes, it is essential","No: the cause is known, and her own axis is already suppressed by prednisolone","Only the high-dose test is useful"],a:1,e:"Dexamethasone tests look for endogenous cortisol excess. Here the cause is the medicine; her own cortisol and adrenocorticotropic hormone are low."},
{t:`Her polymyalgia flares whenever the dose goes below 7.5 mg.`,q:"Best overall plan?",o:["Stop prednisolone today","Add a steroid-sparing drug (for example methotrexate), taper slowly to the lowest effective dose, start bone protection, treat glucose, and give a steroid card","Switch to dexamethasone 4 mg daily"],a:1,e:"Reduce exposure (steroid-sparing drug, slow taper), treat and prevent the side effects, and protect her suppressed axis."}],
take:["Exogenous Cushing syndrome: diagnosis is clinical; no suppression test needed.","Prevent harm: lowest dose, steroid-sparing drug, bone protection, glucose and blood pressure checks.","Suppressed axis: steroid card, sick-day rules, never stop abruptly."]},
{id:"r2",title:"Case 2: Ran out of tablets on holiday",steps:[
{t:`<b>The scene:</b> A 58-year-old man has taken prednisolone 20 mg daily for 6 months for a lung disease. On holiday he ran out of tablets. Three days later he is vomiting and dizzy. Blood pressure 85/50 mmHg, sodium 129 mmol/L, potassium 4.6 mmol/L, glucose 3.3 mmol/L.`,q:"Most likely diagnosis?",o:["Gastroenteritis only","Adrenal crisis from glucocorticoid-induced adrenal suppression","Primary adrenal insufficiency from autoimmune adrenalitis"],a:1,e:"Months of prednisolone suppressed his axis; stopping suddenly removed all glucocorticoid. Potassium is normal because aldosterone is preserved."},

take:["Sudden stop after long steroid use → adrenal crisis.","Glucocorticoid-induced insufficiency: potassium usually normal (aldosterone intact).","Prevention: steroid card, enough tablets, sick-day rules, emergency injection kit where appropriate."]},
{id:"r3",title:"Case 3 (bonus): Four patients, four steroids",steps:[
{t:`<b>Patient 1:</b> a man with lung cancer has headaches and vomiting; scans show swelling around brain metastases.`,q:"Which steroid?",o:["Hydrocortisone","Dexamethasone","Fludrocortisone"],a:1,e:"Dexamethasone: very potent, long-acting, no salt retention. The classic choice for oedema around brain tumours."},
{t:`<b>Patient 2:</b> a woman with newly diagnosed Addison disease.`,q:"Which combination?",o:["Hydrocortisone + fludrocortisone","Dexamethasone alone","Methylprednisolone pulses"],a:0,e:"Hydrocortisone replaces cortisol and mimics the rhythm in 2–3 doses; fludrocortisone replaces aldosterone in primary insufficiency."},
{t:`<b>Patient 3:</b> a pregnant woman at 29 weeks with threatened preterm labour.`,q:"Which steroid, and for whom?",o:["Prednisolone for the mother","Dexamethasone or betamethasone to the mother, to mature the baby's lungs","No steroid in pregnancy"],a:1,e:"These steroids cross the placenta (poor substrates for placental 11-beta-hydroxysteroid dehydrogenase type 2) and speed up fetal lung maturation."},
{t:`<b>Patient 4:</b> a pregnant woman with a severe asthma flare.`,q:"Which oral steroid is usually preferred?",o:["Prednisolone","Dexamethasone","Betamethasone"],a:0,e:"Prednisolone treats the mother; much of it is inactivated by the placenta, so fetal exposure is lower."}],

const shuf=a=>{const b=a.map((x,i)=>[x,i]);for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}if(b.every((x,i)=>x[1]==i)&&b.length>1)[b[0],b[1]]=[b[1],b[0]];return b};
W.order=el=>{const D=XO[el.dataset.set];let next=0,mist=0;const sh=shuf(D.items);
el.innerHTML=`<div class="xgame"><b>🎮 ${D.t}</b> <small>(tap the steps in the right order)</small><ol class="xord"></ol><div class="xchips">${sh.map(([t,i])=>`<button class="xchip" data-i="${i}">${t}</button>`).join("")}</div><div class="info xo-info">Tap the first step.</div><button class="xreset">↺ Shuffle again</button></div>`;
const info=el.querySelector(".xo-info"),ol=el.querySelector(".xord");
el.querySelectorAll(".xchip").forEach(b=>b.onclick=()=>{if(+b.dataset.i==next){b.remove();ol.insertAdjacentHTML("beforeend",`<li>${D.items[next]}</li>`);next++;info.textContent=next==D.items.length?`🏆 Perfect order${mist?` (${mist} slip${mist>1?"s":""} on the way)`:""}!`:"✅ Yes. Next step?";if(next==D.items.length)complete("x-ord-"+el.dataset.set,10,"🧩 Sequence complete! +10 XP")}
else{mist++;b.classList.add("shake");setTimeout(()=>b.classList.remove("shake"),400);info.textContent="❌ Not yet. What has to happen first?"}});
el.querySelector(".xreset").onclick=()=>W.order(el)};
W.spot=el=>{const [t,S]=XS[el.dataset.set];
el.innerHTML=`<div class="xgame"><b>🔎 ${t}</b> <small>(one statement is wrong: tap it)</small>${S.map((s,i)=>`<button class="xstate" data-i="${i}">${s[0]}</button>`).join("")}<div class="info xs-info">Which one is wrong?</div></div>`;
const info=el.querySelector(".xs-info");el.querySelectorAll(".xstate").forEach(b=>b.onclick=()=>{const s=S[+b.dataset.i];
if(s[1]){b.classList.add("ok");info.innerHTML="✔️ That one is true. Keep looking."}else{b.classList.add("bad");el.querySelectorAll(".xstate").forEach(x=>x.disabled=true);info.innerHTML="🎯 Found it! "+s[2];complete("x-spot-"+el.dataset.set,10,"🔎 Error spotted! +10 XP")}})};
W.termdeck=el=>{const K=XT[el.dataset.set].split(",").filter(k=>GLOSSARY[k]);let q=[...K],i=0,known=0;
el.innerHTML=`<div class="xgame"><b>🃏 Key terms deck</b> <small>(tap the card to flip)</small><button class="xcard"><span class="xf"></span></button><div class="ctrl"><button class="xa">🔁 Again</button><button class="xg">✅ Got it</button></div><div class="info xt-info"></div></div>`;
const c=el.querySelector(".xcard"),f=el.querySelector(".xf"),inf=el.querySelector(".xt-info");let back=false;
const show=()=>{back=false;c.classList.remove("back");const g=GLOSSARY[q[i]];f.innerHTML=`<b class="t-${g.c}">${g.l}</b>`;inf.textContent=`${known}/${K.length} known · ${q.length} left in the deck`};
c.onclick=()=>{back=!back;c.classList.toggle("back",back);const g=GLOSSARY[q[i]];f.innerHTML=back?`<small>${g.d}</small>`:`<b class="t-${g.c}">${g.l}</b>`};
el.querySelector(".xa").onclick=()=>{q.push(q.splice(i,1)[0]);show()};
el.querySelector(".xg").onclick=()=>{q.splice(i,1);known++;if(!q.length){f.innerHTML="🏆 Deck finished!";inf.textContent=`${known}/${K.length} known`;c.onclick=null;el.querySelectorAll(".ctrl button").forEach(b=>b.disabled=true);complete("x-deck-"+el.dataset.set,10,"🃏 Deck finished! +10 XP");return}if(i>=q.length)i=0;show()};show()};
W.pick=el=>{const O=["Hydrocortisone","Prednisolone","Methylprednisolone","Dexamethasone","Fludrocortisone"];let n=0,right=0;
const draw=()=>{if(n>=XP_.length){el.innerHTML=`<div class="xgame"><b>💊 Which steroid would you pick?</b><div class="info">🏆 Done: ${right}/${XP_.length} right first time.</div><button class="xreset">↺ Play again</button></div>`;el.querySelector(".xreset").onclick=()=>{n=0;right=0;draw()};complete("x-pick",15,"💊 Steroid picker done! +15 XP");return}
const s=XP_[n];let first=true;el.innerHTML=`<div class="xgame"><b>💊 Which steroid would you pick?</b> <small>(${n+1}/${XP_.length})</small><p class="xscen">${s[0]}</p><div class="ctrl">${O.map(o=>`<button data-o="${o}">${o}</button>`).join("")}</div><div class="info xp-info">Pick one.</div></div>`;
el.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>{const inf=el.querySelector(".xp-info");if(b.dataset.o==s[1]){if(first)right++;b.classList.add("right");el.querySelectorAll("[data-o]").forEach(x=>x.disabled=true);inf.innerHTML=`✅ <b>${s[1]}.</b> ${s[2]} <button class="xnext">Next ▶</button>`;inf.querySelector(".xnext").onclick=()=>{n++;draw()}}else{first=false;b.classList.add("wrong");b.disabled=true;inf.textContent="❌ Think about potency, salt effect and how long it lasts."}})};draw()};

{const add=(Lx,id,h)=>{const c=Lx.cards.find(c=>c.id==id);if(c)c.html+=h};
